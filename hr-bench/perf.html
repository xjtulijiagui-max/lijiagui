<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.WB_OFFLINE=true;</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="color-scheme" content="light">
<title>绩效管理师 · 硬仗变考核表 · HR自动化工作台</title>
<link rel="stylesheet" href="shared.css?v=13">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Microsoft YaHei","微软雅黑","PingFang SC",sans-serif; background:#FAFAF9; color:#1F2328; line-height:1.6; font-size:14px; }
main { max-width:1280px; margin:0 auto; padding:24px 20px 70px; }
.layout { display:grid; grid-template-columns:380px 1fr; gap:20px; align-items:start; }
.panel { background:#FFFFFF; border:1px solid #ECEAE6; border-radius:10px; padding:18px; }
.side { position:sticky; top:74px; }
.ptitle { font-size:15px; font-weight:700; margin-bottom:4px; }
.pnote { font-size:12px; color:#8A8F98; margin-bottom:14px; }
.fgroup { margin-bottom:15px; }
.flabel { font-size:12px; font-weight:700; color:#5F5E5A; margin-bottom:7px; display:flex; align-items:center; }
.flabel .dot { width:5px; height:5px; border-radius:50%; background:#16A06A; margin-right:6px; }
.frow { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
.frow label { flex:0 0 64px; font-size:12px; color:#6B7280; }
.frow input, .frow select { flex:1; min-width:0; font-family:inherit; font-size:13px; padding:6px 9px; border:1px solid #DCDAD4; border-radius:5px; background:#FCFCFB; color:#1F2328; }
.frow input:focus, .frow select:focus { outline:none; border-color:#16A06A; background:#fff; }
.frow .unit { flex:0 0 34px; font-size:11px; color:#A0A4AC; }
.hint { font-size:11.5px; color:#8A8F98; margin-top:2px; line-height:1.5; }
.kpi-row { display:grid; grid-template-columns:1.4fr 1fr 64px; gap:6px; margin-bottom:6px; align-items:center; }
.kpi-row input { font-family:inherit; font-size:12.5px; padding:5px 7px; border:1px solid #DCDAD4; border-radius:5px; background:#FCFCFB; }
.kpi-row input:focus { outline:none; border-color:#16A06A; background:#fff; }
.kpi-row .w { display:flex; align-items:center; gap:3px; }
.kpi-row .w input { width:100%; text-align:right; }
.kpi-row .w span { font-size:11px; color:#A0A4AC; }
.kpi-add { font-size:12px; color:#16A06A; cursor:pointer; background:none; border:none; padding:4px 0; }
.kpi-add:hover { text-decoration:underline; }
table.rst { width:100%; border-collapse:collapse; font-size:13px; margin-top:4px; }
table.rst th { background:#F5F5F3; font-size:12px; font-weight:700; color:#3D4450; padding:8px 10px; text-align:right; border-bottom:1px solid #ECEAE6; white-space:nowrap; }
table.rst th:first-child { text-align:left; }
table.rst td { padding:8px 10px; text-align:right; border-bottom:1px solid #F0EEE9; }
table.rst td:first-child { text-align:left; color:#3D4450; }
table.rst tr.hl td { background:#EAF7F1; font-weight:700; color:#16A06A; }
table.rst td.num { font-variant-numeric:tabular-nums; }
.badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; font-weight:700; }
.b-good { background:#EAF7F1; color:#16A06A; } .b-mid { background:#FAEEDA; color:#854F0B; } .b-bad { background:#FCEBEB; color:#A32D2D; }
.callout { background:#F5F5F3; border-radius:8px; padding:13px 15px; font-size:13px; color:#3D4450; margin-top:12px; }
.callout.green { background:#EAF7F1; color:#118A5A; } .callout.red { background:#FCEBEB; color:#791F1F; }
.callout b { font-weight:700; }
.concl { background:#16A06A; color:#fff; border-radius:10px; padding:20px 22px; margin-top:16px; }
.concl h3 { font-size:15px; font-weight:700; margin-bottom:14px; }
.concl ol { margin-left:18px; } .concl li { margin-bottom:11px; font-size:14px; } .concl li:last-child { margin-bottom:0; } .concl b { font-weight:700; }
section { background:#FFFFFF; border:1px solid #ECEAE6; border-radius:10px; padding:20px; margin-bottom:16px; }
.sec-h { display:flex; align-items:center; gap:9px; margin-bottom:14px; }
.sec-n { width:22px; height:22px; flex:0 0 22px; border-radius:5px; background:#16A06A; color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.sec-t { font-size:15px; font-weight:700; } .sec-sub { font-size:12px; color:#8A8F98; margin-left:auto; text-align:right; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:16px; }
.kpi { background:#fff; border:1px solid #ECEAE6; border-radius:10px; padding:14px 15px; }
.kpi .k { font-size:12px; color:#8A8F98; } .kpi .v { font-size:22px; font-weight:700; margin:3px 0 2px; font-variant-numeric:tabular-nums; }
.kpi .d { font-size:11.5px; color:#6B7280; } .kpi.g .v { color:#16A06A; } .kpi.r .v { color:#A32D2D; }
.grid9 { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:6px; }
.grid9 div { font-size:12px; padding:9px 6px; text-align:center; border-radius:6px; border:1px solid #ECEAE6; background:#FAFAF9; }
.grid9 div.cur { background:#16A06A; color:#fff; border-color:#16A06A; font-weight:700; }
.grid9 div .t { display:block; font-weight:700; } .grid9 div .s { font-size:10.5px; opacity:.75; }
@media (max-width:980px){ .layout{grid-template-columns:1fr;} .side{position:static;} }
@media print { .wb-head,.wb-foot{display:none!important;} body{background:#fff;} .layout{display:block;} .side{display:none;} section{border:1px solid #ccc; page-break-inside:avoid;} }
</style>
<style>
.layout > *, .panel, section, .fgroup, #out { min-width:0; }
.hr-table-scroll { max-width:100%; overflow-x:auto; overscroll-behavior-inline:contain; }
.hr-table-scroll:focus-visible { outline:2px solid #16A06A; outline-offset:2px; }
.hr-table-scroll table.rst { min-width:460px; }
.hr-table-scroll .emp-tb { min-width:460px; }
.hr-table-scroll .task-tb { min-width:620px; }
.hr-table-scroll .pos-tb { min-width:360px; }
.kpi-row { grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 64px; }
.kpi-row input, .kpi-row .w { min-width:0; width:100%; }
@media(max-width:600px){ .sec-h{flex-wrap:wrap;} .sec-sub{margin-left:31px;text-align:left;} .shapebox{flex-wrap:wrap;} }
@media print { .hr-table-scroll{overflow:visible;} .hr-table-scroll table.rst{min-width:0;} }
</style>
</head>
<body>

<main>
<div class="layout">
  <div class="side">
    <div class="panel">
      <div class="ptitle">① 绩效合约书自检</div>
      <div class="pnote">列出部门 KPI，权重自动求和并跑 SMART 自查。</div>
      <div class="fgroup">
        <div class="flabel"><span class="dot"></span>部门 / 周期</div>
        <div class="frow"><label>部门</label><input id="dept" value="生产部"></div>
        <div class="frow"><label>周期</label><select id="cycle"><option>月度</option><option>季度</option><option>年度</option></select></div>
      </div>
      <div class="fgroup">
        <div class="flabel"><span class="dot"></span>KPI 指标（名称 / 目标值 / 权重%）</div>
        <div id="kpiBox"></div>
        <button class="kpi-add" onclick="addKpi()">+ 添加指标</button>
        <div class="hint">KPI ≤ 5 个；单项权重 5%~30%；合计须 = 100%。</div>
      </div>

      <div class="ptitle" style="margin-top:18px;">② 强制分布拉差</div>
      <div class="fgroup">
        <div class="flabel"><span class="dot"></span>原始考核分</div>
        <div class="frow"><input id="rawScores" value="94, 95, 96, 97, 95, 94" placeholder="逗号分隔，如 94,95,96"></div>
        <div class="hint">当大家都挤在 90 分以上、拉不开差距时，拉差到 70~90。</div>
      </div>

      <div class="ptitle" style="margin-top:18px;">③ 九宫格定位</div>
      <div class="fgroup">
        <div class="flabel"><span class="dot"></span>绩效 / 潜力（0~10）</div>
        <div class="frow"><label>绩效</label><input id="perf" type="number" value="8.5"><span class="unit">分</span></div>
        <div class="frow"><label>潜力</label><input id="pot" type="number" value="7.5"><span class="unit">分</span></div>
      </div>

      <button class="wb-btn wb-primary" style="width:100%" onclick="calc()">生成绩效方案</button>
    </div>
  </div>

  <div>
    <div id="out"></div>
    <div class="callout" style="margin-top:14px;">
      <b>用法</b>：把部门硬仗拆成的 KPI 填进①，它会自动校验权重、跑 SMART 自查；②解决「分数挤在 90 分拉不开」；③把一个人按绩效×潜力放进九宫格、给出培养策略。三个可分开用。
    </div>
  </div>
</div>
</main>

<script src="shared.js?v=13"></script>
<script>
wbShell('绩效管理师');

var KPI_SEED = [['销售额达成率','≥500万','30'],['一次合格率','≥99.5%','25'],['交付及时率','≥98%','20'],['成本控制','≤预算','15'],['安全事故数','0','10']];

function addKpi(name, target, weight){
  var box = document.getElementById('kpiBox');
  var row = document.createElement('div'); row.className = 'kpi-row';
  row.innerHTML = '<input class="kn" placeholder="指标名" value="'+(name||'')+'">'
    + '<input class="kt" placeholder="目标值" value="'+(target||'')+'">'
    + '<div class="w"><input class="kw" type="number" value="'+(weight||'')+'"><span>%</span></div>';
  box.appendChild(row);
}
KPI_SEED.forEach(function(r){ addKpi(r[0], r[1], r[2]); });

function band(v){ return v>=8 ? '高' : (v>=5 ? '中' : '低'); }
function gridCell(perfB, potB){
  // 返回 九宫格策略
  var map = {
    '高-高':['★ 高潜','加速培养、挑战项目、优先晋升'],
    '中-高':['稳盘骨干','稳固留任、横向拓展、专家路线'],
    '低-高':['待激活','轮岗试炼、教练辅导、激活潜力'],
    '高-中':['待激活','调整岗位匹配、明确目标+激励'],
    '中-中':['稳盘支撑','保持稳定、适度培养、渐进提升'],
    '低-中':['需优化','调整岗位、降低期望、考虑替换'],
    '高-低':['待激活','诊断绩效障碍、导师一对一、限期改善'],
    '中-低':['需优化','限期整改、明确底线、观察6个月'],
    '低-低':['需优化','优先汰换、释放资源、引进替代']
  };
  return map[perfB+'-'+potB];
}

function calc(){
  window.__perf = {};

  // —— ① KPI 自检 ——
  var dept = wbVal('dept') || '本部门';
  var rows = [];
  document.querySelectorAll('#kpiBox .kpi-row').forEach(function(r){
    var n = r.querySelector('.kn').value.trim(), t = r.querySelector('.kt').value.trim();
    var w = parseFloat(r.querySelector('.kw').value);
    if(n || t || !isNaN(w)) rows.push({n:n, t:t, w:isNaN(w)?0:w});
  });
  var sumW = rows.reduce(function(a,b){return a+b.w;},0);
  var checks = [];
  checks.push(['KPI 数量 ≤ 5', rows.length>0 && rows.length<=5, rows.length+' 个']);
  checks.push(['单项权重 ≥ 5%', rows.every(function(r){return r.w>=5;}), '']);
  checks.push(['单项权重 ≤ 30%', rows.every(function(r){return r.w<=30;}), '']);
  checks.push(['权重合计 = 100%', Math.abs(sumW-100)<0.01, '当前 '+sumW.toFixed(0)+'%']);
  checks.push(['每个指标有目标值(S)', rows.every(function(r){return r.t;}), '']);
  checks.push(['每个指标有评分规则(M)', rows.every(function(r){return r.t;}), '']);
  var allPass = checks.every(function(c){return c[1];});

  var h1 = '<section><div class="sec-h"><span class="sec-n">1</span><span class="sec-t">绩效合约书 · '+wbEsc(dept)+'</span>'
    + '<span class="sec-sub">'+wbVal('cycle')+'考核</span></div>';
  h1 += '<div class="hr-table-scroll" tabindex="0" role="region" aria-label="数据表，可左右滚动"><table class="rst"><thead><tr><th>KPI指标</th><th>目标值</th><th>权重%</th><th>评分规则</th></tr></thead><tbody>';
  rows.forEach(function(r){ h1 += '<tr><td style="text-align:left">'+wbEsc(r.n||'（未命名）')+'</td><td style="text-align:left">'+wbEsc(r.t||'—')+'</td><td class="num">'+r.w+'</td><td style="text-align:left">达标满分，每低于目标按比例扣分</td></tr>'; });
  h1 += '<tr class="'+(Math.abs(sumW-100)<0.01?'hl':'')+'"><td style="text-align:left"><b>合计</b></td><td></td><td class="num"><b>'+sumW.toFixed(0)+'</b></td><td></td></tr>';
  h1 += '</tbody></table></div>';
  h1 += '<div class="callout '+(allPass?'green':'red')+'"><b>部门KPI自查十条</b>（可程序化部分）：'
    + checks.map(function(c){ return '<br>· '+(c[1]?'✓':'⚠')+' '+c[0]+(c[2]?('（'+c[2]+'）'):''); }).join('')
    + '<br>其余：目标有时限(T)、与硬仗相关(R)、过程指标(KBI)补位——请人工确认。</div></section>';
  window.__perf.kpiSum = sumW; window.__perf.kpiPass = allPass; window.__perf.kpiCount = rows.length;

  // —— ② 强制分布拉差 ——
  var raw = (wbVal('rawScores')||'').split(/[\s,，;；]+/).map(function(s){return parseFloat(s);}).filter(function(v){return !isNaN(v);});
  var diff = '';
  if(raw.length>=2){
    var Xm = Math.max.apply(null,raw), Xo = Math.min.apply(null,raw);
    var Tm = 90, T1 = 70;
    var a = (Tm-T1)/(Xm-Xo);
    var pulled = raw.map(function(x){ return a*(x-Xo)+T1; });
    diff = '<section><div class="sec-h"><span class="sec-n">2</span><span class="sec-t">强制分布拉差</span>'
      + '<span class="sec-sub">'+raw.length+' 人 · 拉差到 70~90</span></div>';
    diff += '<div class="hr-table-scroll" tabindex="0" role="region" aria-label="数据表，可左右滚动"><table class="rst"><thead><tr><th>人</th><th>原始分</th><th>拉差后</th></tr></thead><tbody>';
    raw.forEach(function(x,i){ diff += '<tr><td>第'+(i+1)+'人</td><td class="num">'+x.toFixed(1)+'</td><td class="num">'+pulled[i].toFixed(1)+'</td></tr>'; });
    diff += '</tbody></table></div>';
    var span = Xm-Xo;
    diff += '<div class="callout '+(span<3?'red':'')+'">拉差系数 a='+a.toFixed(3)+'。'
      + (span<3 ? ' 原始分极差仅 '+span.toFixed(1)+' 分，说明打分趋中——拉差后有效拉开差距，避免「大锅饭」。'
               : ' 原始分已有差距，拉差后进一步线性放大。')+'</div></section>';
    window.__perf.pulled = pulled; window.__perf.diffA = a;
  } else {
    diff = '<section><div class="sec-h"><span class="sec-n">2</span><span class="sec-t">强制分布拉差</span></div>'
      + '<div class="callout">请在左侧填入 ≥2 个原始分（逗号分隔）。</div></section>';
  }

  // —— ③ 九宫格 ——
  var perf = parseFloat(wbVal('perf')), pot = parseFloat(wbVal('pot'));
  var g3 = '';
  if(!isNaN(perf) && !isNaN(pot)){
    var pb = band(perf), tb = band(pot);
    var cell = gridCell(pb, tb);
    g3 = '<section><div class="sec-h"><span class="sec-n">3</span><span class="sec-t">九宫格人才定位</span>'
      + '<span class="sec-sub">绩效 '+perf+' · 潜力 '+pot+'</span></div>';
    g3 += '<div class="grid9">';
    [['高','高'],['中','高'],['低','高'],['高','中'],['中','中'],['低','中'],['高','低'],['中','低'],['低','低']].forEach(function(p){
      var key = p[0]+'-'+p[1];
      var cur = (key===pb+'-'+tb);
      var c = gridCell(p[0],p[1]);
      g3 += '<div class="'+(cur?'cur':'')+'"><span class="t">'+c[0]+'</span><span class="s">'+c[1].slice(0,6)+'</span></div>';
    });
    g3 += '</div>';
    g3 += '<div class="callout green" style="margin-top:12px;"><b>当前定位：'+cell[0]+'</b> —— '+cell[1]+'。</div></section>';
    window.__perf.grid = cell[0]; window.__perf.gridStrategy = cell[1];
  } else {
    g3 = '<section><div class="sec-h"><span class="sec-n">3</span><span class="sec-t">九宫格人才定位</span></div>'
      + '<div class="callout">请填入绩效、潜力分（0~10）。</div></section>';
  }

  // 结论
  var concl = [];
  concl.push('绩效不是考核。把 '+rows.length+' 个 KPI 从硬仗拆到岗位，权重合计 '+(allPass?'正好 100%':'差 '+(100-sumW).toFixed(0)+'%，需调整')+'，每个指标必须可追溯硬仗。');
  if(window.__perf.pulled) concl.push('打分趋中时，用拉差公式把 70~90 拉开，让 S/A 真有激励、C/D 真有压力。');
  if(window.__perf.grid) concl.push('这个人落在九宫格「'+window.__perf.grid+'」：'+window.__perf.gridStrategy+'。高潜给挑战、稳盘给留任、待激活给辅导、需优化给限期整改或汰换。');
  var hc = '<div class="concl"><h3>三条能拿去开会的结论</h3><ol>';
  concl.forEach(function(c){ hc += '<li>'+c+'</li>'; });
  hc += '</ol></div>';

  document.getElementById('out').innerHTML = h1 + diff + g3 + hc;
}

calc();
</script>
<script src="dataIface.js?v=12"></script>
<script>wbDataIface.setup({ pageKey:'perf_v1', tables:[{id:'kpiBox', label:'KPI指标(指标名/目标值/权重%)', rowSel:'.kpi-row', cellSel:'input', cols:['指标名','目标值','权重%']}], afterLoad:function(){ if(typeof calc==='function') calc(); } });</script>

<script>window.WB_AGENT_KEY='perf';</script>
</body>
</html>
