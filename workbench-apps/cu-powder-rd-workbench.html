<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>铜粉研发实验设计与数据复盘助手 · 工作台原型 v0.1（本地预览）</title>
<style>
:root{
  --bg:#f5f7fa; --panel:#ffffff; --panel2:#fbfcfe; --line:#e2e8f0; --line2:#eef2f7;
  --ink:#16202c; --muted:#5f7085; --dim:#8494a7;
  --accent:#0b5f8a; --accent-soft:#e8f2f8;
  --ok:#1a6b4a; --ok-soft:#e6f4ed;
  --warn:#8a5b00; --warn-soft:#fdf3e0;
  --bad:#b3261e; --bad-soft:#fbeae8;
  --grey:#6b7787; --grey-soft:#eef1f4;
  --blocked:#6d4c9f; --blocked-soft:#f1ecfa;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.65 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
code,.mono{font-family:"Cascadia Mono",Consolas,Menlo,monospace;font-size:12.5px}
button{font:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}

/* ---------- top ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{max-width:1440px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:1px;min-width:250px}
.brand b{font-size:15px;letter-spacing:.2px}
.brand span{font-size:11.5px;color:var(--dim)}
.spacer{flex:1}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:12px;white-space:nowrap}
.chip.state{border-color:#bcd6e6;background:var(--accent-soft);color:#0a4f73;font-weight:600}
.chip.q{border-color:#e8d6a8;background:var(--warn-soft);color:var(--warn);cursor:pointer}
select.role{font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}

/* ---------- banner ---------- */
.banner{max-width:1440px;margin:0 auto;padding:0 18px}
.banner-in{margin-top:10px;border:1px solid #e8d6a8;background:var(--warn-soft);color:#6f4a00;border-radius:var(--r);padding:8px 12px;font-size:12.5px;display:flex;gap:10px;align-items:flex-start}
.banner-in b{color:#5a3b00}

/* ---------- layout ---------- */
.layout{max-width:1440px;margin:0 auto;padding:12px 18px 40px;display:grid;grid-template-columns:236px 1fr;gap:14px;align-items:start}
.side{position:sticky;top:74px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;max-height:calc(100vh - 96px);overflow:auto}
.stage{margin-bottom:10px}
.stage-h{font-size:11.5px;color:var(--dim);letter-spacing:.4px;padding:6px 6px 4px;display:flex;justify-content:space-between;align-items:center}
.stage-h em{font-style:normal;color:#b9c4d2}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:7px 8px;border:0;border-radius:8px;background:transparent;color:var(--ink);font-size:13px}
.nav button:hover{background:var(--panel2)}
.nav button.on{background:var(--accent-soft);color:#0a4f73;font-weight:600}
.nav button.locked{color:#a9b4c2;cursor:not-allowed}
.nav button.locked:hover{background:transparent}
.nav .vid{font-size:11px;color:var(--dim);width:38px;flex:none}
.nav button.on .vid{color:#0a4f73}
.nav .lock{margin-left:auto;font-size:11px}

/* ---------- main ---------- */
.main{min-width:0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:baseline;gap:10px;padding:12px 16px 0;flex-wrap:wrap}
.card-h h2{margin:0;font-size:15.5px}
.card-h .sub{font-size:12px;color:var(--muted)}
.card-b{padding:12px 16px 16px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.note.warn{color:var(--warn)}
hr.sep{border:0;border-top:1px solid var(--line2);margin:12px 0}

.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px}
.btn:hover:not(:disabled){border-color:#c9d6e3;background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:#0a527a}
.btn.danger{border-color:#e6b7b2;color:var(--bad)}
.btn:disabled{opacity:.45;background:var(--grey-soft);border-color:var(--line)}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:7px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

table{width:100%;border-collapse:collapse;font-size:12.8px}
th,td{border-bottom:1px solid var(--line2);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--panel2);font-weight:700;color:#33475f;position:sticky;top:0;z-index:1}
tbody tr:hover td{background:#fafcfe}
.tw{overflow:auto;border:1px solid var(--line);border-radius:9px;max-height:none}
.tw.lg{max-height:460px}
td.sticky,th.sticky{position:sticky;left:0;background:var(--panel);z-index:2;border-right:1px solid var(--line2)}
th.sticky{background:var(--panel2);z-index:3}
td.num{text-align:right;font-variant-numeric:tabular-nums}

.tri{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.tri.ok{background:var(--ok-soft);color:var(--ok)}
.tri.no{background:var(--bad-soft);color:var(--bad)}
.tri.na{background:var(--grey-soft);color:var(--grey)}
.tri.warn{background:var(--warn-soft);color:var(--warn)}
.tri.q{background:var(--blocked-soft);color:var(--blocked)}
.tag{display:inline-block;padding:1px 6px;border-radius:5px;background:#f1f4f8;color:#54657a;font-size:11px;border:1px solid #e6ebf1}
.tag.rule{background:#eef4fb;color:#1f4e79;border-color:#d9e6f4}
.tag.p0{background:var(--bad-soft);color:var(--bad);border-color:#f0c9c5}
.tag.p1{background:var(--warn-soft);color:var(--warn);border-color:#eddcb6}
.tag.p2{background:var(--grey-soft);color:var(--grey)}
.tag.miss{background:#fff;color:#9aa7b5;border:1px dashed #cfd8e3}
.tag.sim{background:#f3f0fa;color:#6d4c9f;border-color:#e0d8f2}

.empty{padding:26px 12px;text-align:center;color:var(--dim);font-size:13px;border:1px dashed var(--line);border-radius:9px;background:var(--panel2)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.field label{color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid #cfe4f0;border-color:#a9cbdf}
.field .hint{font-size:11.5px;color:var(--dim)}
.req{color:var(--bad)}
.deny{border:1px solid #e6b7b2;background:#fdf6f5;border-radius:var(--r);padding:18px}
.deny h3{margin:0 0 6px;font-size:15px;color:var(--bad)}
.deny p{margin:4px 0;font-size:13px;color:#7a3b36}
.deny code{background:#fff;border:1px solid #f0d6d3;padding:1px 5px;border-radius:5px}
.hidden-note{margin-top:10px;padding:8px 11px;border:1px dashed #d8c2be;border-radius:9px;background:#fdfaf9;font-size:12px;color:#8a5b52}
.zone{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--panel2)}
.zone h4{margin:0 0 8px;font-size:13px;display:flex;gap:8px;align-items:center}
.zone .li{border-top:1px solid var(--line2);padding:7px 0;font-size:12.8px}
.zone .li:first-of-type{border-top:0}
.zone .li .ev{font-size:11px;color:var(--dim)}
.zone .li .why{font-size:11.5px;color:var(--warn)}
.sec{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;overflow:hidden}
.sec-h{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--panel2);font-size:13px;font-weight:600}
.sec-h .miss{color:var(--bad);font-weight:600}
.sec-b{padding:9px 12px;font-size:12.9px}
.sec-b p{margin:5px 0}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;margin:6px 0 2px}
.flow .st{padding:3px 9px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}
.flow .st.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.flow .st.err{background:var(--bad-soft);border-color:#f0c9c5;color:var(--bad)}
.flow .ar{color:#c3ceda}
.toast{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 36px))}
.toast div{background:#132029;color:#eaf2f8;padding:10px 13px;border-radius:9px;font-size:12.5px;box-shadow:0 8px 24px rgba(10,25,40,.22)}
.toast div.bad{background:#7d241f}
.toast div.ok{background:#145c41}
.loglist{max-height:300px;overflow:auto;font-size:12.2px}
.loglist .lg{border-top:1px solid var(--line2);padding:6px 0}
.loglist .lg:first-child{border-top:0}
.loglist .t{color:var(--dim);font-size:11px}
.qpanel{position:fixed;inset:0;z-index:80;background:rgba(12,24,36,.34);display:none;align-items:flex-start;justify-content:center;padding:60px 18px}
.qpanel.on{display:flex}
.qbox{background:var(--panel);border-radius:14px;max-width:820px;width:100%;max-height:80vh;overflow:auto;padding:20px 22px}
.qbox h3{margin:0 0 4px}
.qitem{border-top:1px solid var(--line2);padding:11px 0;font-size:13px}
.qitem b{display:block;margin-bottom:3px}
.qitem .lvl{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--blocked-soft);color:var(--blocked);margin-right:6px}
@media (max-width:1080px){
  .layout{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  .grid2,.grid3{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <b>铜粉研发实验设计与数据复盘助手 · 工作台</b>
      <span>cu-powder-rd-review · 本地原型 v0.1 · 依据 specs/07-ui.md 九页 · init_state BASELINE_DRAFT</span>
    </div>
    <div class="spacer"></div>
    <div class="meta">
      <span class="chip">任务 <b id="t-taskid">—</b></span>
      <span class="chip state" id="t-state">—</span>
      <span class="chip q" id="t-q" title="查看规格未定项">待确认 <b>0</b></span>
      <label class="field" style="gap:0">
        <select class="role" id="roleSel" title="演示用角色切换，不对应真实登录"></select>
      </label>
    </div>
  </div>
</header>

<div class="banner"><div class="banner-in">
  <div>⚠</div>
  <div><b>候选原型，不可作为业务判定依据。</b>判据为 <code>示例判据</code>（SEM 中位等效径 ≥ 4.0 μm、干粉总氧 ≤ 0.30 wt%），<b>非产品标准</b>（Q-001）。数据来自 PRD §7 六组<b>模拟</b>记录。未连真实系统、未写库、未发布；业务测试 <code>NOT_RUN</code>。</div>
</div></div>

<div class="layout">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast"></div>
<div class="qpanel" id="qpanel"><div class="qbox" id="qbox"></div></div>

<script>
"use strict";
/* =========================================================================
   0. 常量：全部来自 specs/，不新增业务字段
   ========================================================================= */
const PROJECT = { id:"cu-powder-rd-review", taskId:"T-2026-011" };  // 任务ID编码规则未提供（Q-007），此处为示例值
const CRIT = { semMin:4.0, o2Max:0.30 };                            // 示例判据（RULE-OUT-002）
const VERDICT = { OK:"满足", NO:"未满足", NA:"无法判定" };

const ROLES = [
  { id:"R-01", name:"铜粉研发工程师" },
  { id:"R-02", name:"检测人员" },
  { id:"R-03", name:"项目负责人" },
  { id:"R-04", name:"铜浆研发/应用工程师" },
  { id:"R-05", name:"质量工程师" },
  { id:"R-06", name:"项目/EHS" },
  { id:"R-07", name:"查看者（只读）" }
];

const STATES = {
  "STATE-INTAKE":{ label:"已登记", d:"仅有目标与主问题" },
  "STATE-EVIDENCE-CHECK":{ label:"资料校验中", d:"P-1 进行中" },
  "STATE-DESIGN-READY":{ label:"设计就绪", d:"目标定标、设计已批" },
  "STATE-DATA-NORMALIZED":{ label:"数据已标准化", d:"口径已确认" },
  "STATE-ANALYZED":{ label:"判读完成", d:"观察/假设已分离" },
  "STATE-REVIEW":{ label:"评审中", d:"G-05 四类签核" },
  "STATE-SIGNED":{ label:"已签核", d:"四栏齐全" },
  "STATE-ARCHIVED":{ label:"已归档", d:"只读" },
  "STATE-BLOCKED":{ label:"挂起", d:"证据不足/口径冲突" },
  "STATE-REJECTED":{ label:"已驳回", d:"返工中" }
};

/* 页面：严格取自 specs/07-ui.md 页面清单，不增不减 */
const PAGES = [
  { id:"V-01", stage:"导入", name:"任务登记",        req:"task.view" },
  { id:"V-02", stage:"导入", name:"资料校验与缺口看板", req:"task.view" },
  { id:"V-03", stage:"导入", name:"样品与工艺对照",    req:"process.view" },
  { id:"V-04", stage:"导入", name:"检测数据与口径核查", req:"test.view" },
  { id:"V-05", stage:"判读", name:"联合判读工作台",    req:"finding.add" },
  { id:"V-06", stage:"判读", name:"下一轮验证计划",    req:"plan.view" },
  { id:"V-07", stage:"导出", name:"报告预览与导出",    req:"report.view" },
  { id:"V-08", stage:"导出", name:"签核与版本记录",    req:"sign.view" },
  { id:"V-09", stage:"导出", name:"助手测试台账",      req:"test-ledger.view" }
];

/* 规格未定项（本轮搭建中发现，需用户确认；不在 04/07/08 中给出答案） */
const OPEN_Q = [
  { id:"Q-015", lvl:"BLOCKER", t:"状态机缺 create_task / approve_design / import_data 的转移行",
    d:"04-rules 的「允许的进入事件」列出现了这三个事件，但下方转移表没有对应行（无 from→to、无守卫）。本原型按最小推断实现，并标「推断·待确认」。" },
  { id:"Q-016", lvl:"BLOCKER", t:"STATE-REJECTED 的 rework 无目标状态",
    d:"状态表写 REJECTED 的离开事件是 rework，但转移表没有该行，也没写返工后回到哪个状态。本原型<b>不实现</b>该按钮，避免用默认值补齐。" },
  { id:"Q-017", lvl:"NON-BLOCKER", t:"权限矩阵未覆盖 3 个资源",
    d:"08-security 矩阵没有「下一轮验证计划」「助手测试台账」「报告正文查看」三行。按「默认拒绝」三者对全员不可达，主流程会断。本原型给 task.view 持有者只读、R-01/R-03 可写，并标注为推断。" },
  { id:"Q-018", lvl:"NON-BLOCKER", t:"证据编号空间冲突",
    d:"05-data 定义 EvidenceFile.evidence_id 为 <code>E-###</code>；evidence/README 的 E-001~E-008 已用于验收证据。同一编号段两种含义。本原型数据证据从 <code>E-101</code> 起编号，避开冲突，待确认编号段分配规则。" },
  { id:"Q-019", lvl:"NON-BLOCKER", t:"状态机守卫引用了未定义的字段",
    d:"04-rules 的 start_test 守卫要求「基准与固定条件齐备」，但 05-data 没有「基准」「固定条件」字段定义（只在 07-ui 的 V-06 信息块里出现）。本原型把 V-06 表格列当作字段来源。" },
  { id:"Q-020", lvl:"NON-BLOCKER", t:"包内无工艺记录样例（I-04）",
    d:"V-03 需要 投料量/浓度/加料/保温/pH+温度/气氛，包内只有 §7 的检测值与「75 g 五水硫酸铜」交流背景，未绑定到具体样品。本原型全部标「未提供」，因此 AC-008（pH 缺温度）、AC-009（PVP 无基准）没有可点路径。" },
  { id:"Q-021", lvl:"BLOCKER", t:"判读证据的最小条目与取值口径未定义",
    d:"两处空白：<b>(a)</b> 04-rules 的「每条观察有证据ID」在 0 条观察时按字面是真空通过 —— 本原型照字面实现，所以空报告也能进评审，但导出会被 V-07 的「缺章节」拦住。是否要求至少 1 条观察 + 1 条假设？<b>(b)</b> 同一 样品+检测项 有多条不同日期记录时取哪条参与判读未定义，本原型取<b>最新取样日期</b>，属推断。" }
];

/* =========================================================================
   1. 状态
   ========================================================================= */
let ROLE = "R-03";

const SAMPLES = [
  { id:"CU-01", d50:8.2, sem:1.2,  o2:0.25, morph:"葡萄串状，连接性质待验证" },
  { id:"CU-02", d50:5.1, sem:4.3,  o2:0.22, morph:"分散较好，未见明显簇状结构" },

  { id:"CU-04", d50:3.3, sem:2.7,  o2:0.18, morph:"分散较好" },
  { id:"CU-05", d50:6.4, sem:5.2,  o2:0.28, morph:"外形较完整，少量颗粒接触" },
  { id:"CU-06", d50:7.8, sem:4.6,  o2:null, morph:"局部 EDS 检出氧" }
];

const app = {
  state:"STATE-INTAKE",
  prevState:null,
  view:"V-01",
  task:{
    taskId:PROJECT.taskId,
    application:"光伏铜浆",
    targetClass:"4μm",
    targetValue:4, targetUnit:"μm",
    customerReq:"未提供（Q-001）",
    internalGoal:"保留 4 μm 以上独立颗粒；总氧不高于内部目标值（未提供）",
    priority:"P0",
    mainQuestion:"当前 D50 约 8 μm 是否受团聚影响，如何改善分散并保留 4 μm 以上独立颗粒",
    sampleNode:"未提供（Q-012）"
  },
  // 每条检测记录：source 标 模拟；method 来自 PRD §7「所有模拟样品假定采用相同检测方法」
  tests:[],
  findings:{ observe:[], hypothesis:[], counter:[], gaps:[] },
  plan:[
    { q:"大粒度来自独立颗粒还是团聚", act:"先对 CU-01 统一分散与多视场 SEM；真实 VC 路线再单独考察 PVP-K30 用量或加入阶段",
      base:"CU-01 同条件复测", fixed:"总水量与基线固定", point:"复测前后", rep:"测量重复 ≥2",
      crit:"分散前后粒度 + 多视场 SEM 统计；总氧同时复测", owner:"研发设计 / 检测执行", ev:"原始图 + 尺寸统计" },

/* =========================================================================
   3. 判读（三态 + 规则命中；纯函数，可被验收直接断言）
   ========================================================================= */
/* 判读用的有效值：优先取已导入的检测记录；无记录即视为「无数据」，不得回退到样例默认值
   多条记录时按取样日期取最新 —— 该取值口径 04-rules 未定义，已登记 Q-021 */
function effOf(s){
  if(app.tests.length===0) return Object.assign({},s,{d50:null,sem:null,o2:null});
  const g=item=>{
    const a=app.tests.filter(x=>x.sid===s.id && x.item===item);
    if(!a.length) return null;
    a.sort((x,y)=> String(y.date).localeCompare(String(x.date)));
    return a[0].val;
  };
  return Object.assign({},s,{d50:g("D50"), sem:g("SEM中位径"), o2:g("总氧")});
}
function EFF(){ return SAMPLES.map(effOf); }

function tri(cond){ return cond ? VERDICT.OK : VERDICT.NO; }

function judge(s){
  const a = (s.sem==null) ? VERDICT.NA : tri(s.sem >= CRIT.semMin);
  const b = (s.o2==null)  ? VERDICT.NA : tri(s.o2 <= CRIT.o2Max);
  let label, cls;
  if(a===VERDICT.NA || b===VERDICT.NA){ label="无法判定（缺证据）"; cls="na"; }
  else if(a===VERDICT.OK && b===VERDICT.OK){ label="两项满足"; cls="ok"; }
  else if(a===VERDICT.NO && b===VERDICT.NO){ label="两项均未满足"; cls="no"; }
  else if(a===VERDICT.NO){ label="粒径未满足"; cls="no"; }
  else { label="总氧未满足"; cls="no"; }

  // 规则命中（每条都给规则编号，便于追踪）
  const hits=[];
  if(s.d50!=null && s.sem!=null && s.id==="CU-01") hits.push({r:"RULE-SMP-001", m:"D50 "+s.d50+" μm ≠ SEM 中位径 "+s.sem+" μm，四类尺寸分列，不得互替"});
  if(s.id==="CU-06") hits.push({r:"RULE-TST-001", m:"总氧缺失；局部 EDS 不得补总氧"});
  if(s.o2!=null && s.o2>CRIT.o2Max) hits.push({r:"RULE-TST-001", m:"总氧超出示例线，需并列方法/物相后补证"});
  hits.push({r:"RULE-SMP-002", m:"缺分散前后粒度 + 保温时间序列，最多记「待验证假设」，不得认定熟化"});
  hits.push({r:"RULE-TST-003", m:"制样/分散与取样时点未提供 → 标不可比，只并列不排序"});

  // 团聚证据计数（三项中满足几项）
  const ev = 0 /*分散前后*/ + 0 /*多视场统计（视场数未提供）*/ + 0 /*保温时间序列*/;

  return { a, b, label, cls, hits, ev };
}

function tally(){
  const t={ ok:0, size:0, o2:0, na:0 };
  EFF().forEach(s=>{
    const j=judge(s);
    if(j.cls==="ok") t.ok++;
    else if(j.label==="粒径未满足") t.size++;
    else if(j.label==="总氧未满足") t.o2++;
    else t.na++;
  });
  return t;
}

/* 越界词（RULE-OUT-001） */
const BAN = ["最优","根因","合格","量产","最佳用量"];
function scanBan(text){
  const hits=[];
  BAN.forEach(w=>{ if(text && text.indexOf(w)>=0) hits.push(w); });
  return hits;
}

function eventsFrom(st){
  return EVENTS.filter(e=>e.from===st);

function fire(ev){
  const def = EVENTS.find(e=>e.ev===ev && e.from===app.state);
  if(!def){ toast("非法转移：当前状态 "+app.state+" 无事件 "+ev+"（默认拒绝，已留痕）","bad");
    log("状态流转被拒", app.state+" × "+ev+"（无该转移）"); return; }
  if(def.disabled){ toast(def.guard().why,"bad"); return; }
  const g = def.guard();
  if(!g.ok){ toast("守卫不满足 — "+g.why,"bad"); log("状态流转被拒", app.state+" × "+ev+"｜"+g.why); return; }
  const before = app.state;
  if(def.to==="__PREV__"){ app.state = app.prevState; app.prevState=null; }
  else {
    if(def.to==="STATE-BLOCKED") app.prevState = before;
    app.state = def.to;
  }
  log("状态流转", before+" → "+app.state+"（事件 "+ev+"）");
  toast("状态已流转："+STATES[before].label+" → "+STATES[app.state].label,"ok");
  render();
}

function signName(r){ const s=app.signs[r]; return s? (r+" ✓ "+s.t) : (r+" 未签"); }

function banHitsAll(){
  const { secs } = reportSections();
  const hits=[];
  secs.forEach(s=>{ if(scanBan(s.body).length) hits.push(s.n+s.t); });
  app.findings.observe.forEach(o=>{ if(scanBan(o.text).length) hits.push("§4 观察"); });
  app.findings.hypothesis.forEach(h=>{ if(scanBan(h.text).length) hits.push("§5 假设"); });
  app.plan.forEach(p=>{ if(scanBan(p.crit).length) hits.push("§6 判据"); });
  return [...new Set(hits)];
}

  const { secs } = reportSections();

  return s2.indexOf("示例判据")>=0 && s2.indexOf("非产品标准")>=0;

function buildGaps(){
  const g=[];

let importStats = null;

function seedTests(){
  app.tests=[];
  SAMPLES.forEach(s=>{
    if(s.d50!=null) app.tests.push(mkTest(s.id,"D50",s.d50,"μm","2026-11-06"));
    if(s.sem!=null) app.tests.push(mkTest(s.id,"SEM中位径",s.sem,"μm","2026-11-06"));
    if(s.o2!=null)  app.tests.push(mkTest(s.id,"总氧",s.o2,"wt%","2026-11-06"));
  });
}
function mkTest(sid,item,val,unit,date){
  return { sid, item, val, unit, raw:val+" "+unit, method:"PRD §7 假定同一方法", date,
           point:"未提供", rep:"未提供", src:"模拟", key:sid+"|"+item+"|"+"PRD §7 假定同一方法"+"|"+date };
}

function parseCSV(text){
  const lines = text.trim().split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return {rows:[],err:"空文件"};
  const head = lines[0].split(",").map(h=>h.trim());
  const need = ["样品ID","检测项","数值","单位"];
  const miss = need.filter(n=>head.indexOf(n)<0);
  if(miss.length) return {rows:[],err:"缺列："+miss.join("、")};
  const rows=[];
  for(let i=1;i<lines.length;i++){
    const c=lines[i].split(",").map(x=>x.trim());
    const o={}; head.forEach((h,idx)=>o[h]=c[idx]!==undefined?c[idx]:"");
    rows.push(o);
  }
  return {rows};
}

function importCSV(text){
  const pr = parseCSV(text);
  if(pr.err){ toast("导入失败："+pr.err,"bad"); log("数据导入失败",pr.err); return; }
  let okN=0, dup=0, upd=0; const conflicts=[]; const errs=[];
  pr.rows.forEach(r=>{
    const sid=r["样品ID"], item=r["检测项"], method=r["方法"]||"未提供", date=r["取样日期"]||"未提供";
    let v=parseFloat(r["数值"]), unit=r["单位"]||"";
    if(!sid||!item||isNaN(v)){ errs.push("行无法解析："+JSON.stringify(r)); return; }
    if(item==="总氧" && unit.toLowerCase()==="ppm"){ v=v/10000; unit="wt%"; }  // RULE-TST-002
    const key=sid+"|"+item+"|"+method+"|"+date;
    const ex=app.tests.find(t=>t.key===key);
    if(ex){
      if(Math.abs(ex.val-v)<1e-9){ dup++; }
      else { conflicts.push({ sid,item,old:ex.val,neu:v,key }); upd++; }
      return;
    }
    app.tests.push({ sid,item,val:v,unit,raw:r["数值"]+" "+r["单位"],method,date,
                     point:r["取样时点"]||"未提供",rep:r["重复"]||"未提供",src:"模拟",key });
    okN++;
  });
  importStats={okN,dup,upd,conflicts,errs,total:pr.rows.length};
  log("数据导入", `成功 ${okN} 行 / 幂等跳过 ${dup} 行 / 冲突 ${conflicts.length} 行 / 解析失败 ${errs.length} 行`);
  if(conflicts.length) toast("有 "+conflicts.length+" 条冲突需人工择一（未静默覆盖）","bad");
  else toast("导入完成：新增 "+okN+"，幂等跳过 "+dup,"ok");
  render();
}

function sampleCSV(){
  const head="样品ID,检测项,方法,取样日期,数值,单位,重复,取样时点";
  const rows=SAMPLES.map(s=>{
    const m="PRD §7 假定同一方法";
    const a=`${s.id},D50,${m},2026-11-06,${s.d50},μm,未提供,未提供`;
    const b=`${s.id},SEM中位径,${m},2026-11-06,${s.sem},μm,未提供,未提供`;
    const c=s.o2==null? "" : `${s.id},总氧,${m},2026-11-06,${s.o2},wt%,未提供,未提供`;
    return [a,b,c].filter(Boolean).join("\n");
  }).join("\n");
  return head+"\n"+rows;
}

  let h='<div class="flow">';
  order.forEach((s,i)=>{
    h+=`<span class="st ${s===cur?"on":""}">${STATES[s].label}</span>`;

    h+=`<div class="note warn">当前处于 <b>${STATES[app.state].label}</b>（挂起前：${app.prevState?STATES[app.prevState].label:"—"}）</div>`;

function triChip(v){
  if(v===VERDICT.OK) return `<span class="tri ok">${v}</span>`;

  return `<span class="tri na">${v}</span>`;
}
function addObs(){
  const ev=$("#evSel").value, txt=$("#obsText").value.trim();
  if(!txt){ toast("观察内容为空","bad"); return; }
  if(!ev){ toast("必须选择 evidence_id，否则不可保存（07-ui 错误态）","bad"); return; }
  if(scanBan(txt).length){ toast("越界词："+scanBan(txt).join("、")+"（RULE-OUT-001），请改写为观察或假设","bad"); return; }
  app.findings.observe.push({ text:txt, ev, at:new Date().toLocaleString("zh-CN",{hour12:false}) });
  log("判读结论新增","观察｜"+ev+"｜"+txt); toast("已新增观察","ok"); render();
}
function addHyp(){
  const txt=$("#hypText").value.trim(), c=$("#hypCounter").value.trim();
  if(!txt||!c){ toast("假设与反证条件都必须填（缺失不可保存）","bad"); return; }
  if(scanBan(txt).length){ toast("越界词："+scanBan(txt).join("、"),"bad"); return; }
  app.findings.hypothesis.push({ text:txt, counter:c });
  app.findings.counter.push(c);
  log("判读结论新增","假设｜"+txt); toast("已标为假设","ok"); render();
}

}

    { r:"R-06", t:"项目 / EHS",    f:"资源与送样进度；安全、保密、知识产权及放大变更" }

  return `
  <div class="card">
    <div class="card-h"><h2>V-08 签核与版本记录</h2><span class="sub">四类角色确认与留痕 · 主角色 R-03 / R-05 / R-04 / R-06</span></div>
    <div class="card-b">
      ${app.state!=="STATE-REVIEW" && app.state!=="STATE-SIGNED" && app.state!=="STATE-ARCHIVED"
        ? `<div class="hidden-note" style="margin:0 0 10px">未到 <code>STATE-REVIEW</code>，本页只读（07-ui 空态）。当前 ${STATES[app.state].label}。</div>`:""}
      ${gapsP0Open()>0? `<div class="hidden-note" style="margin:0 0 10px;border-color:#f0c9c5;background:#fdf6f5;color:#7a3b36">P0 缺口未关闭 ${gapsP0Open()} 条 → 「通过」置灰（07-ui 错误态 / 04-rules 守卫）。</div>`:""}
      <div class="tw"><table>
        <thead><tr><th>确认角色</th><th>确认重点（PRD 附录B）</th><th>确认人 / 时间</th><th style="width:180px">操作</th></tr></thead>
        <tbody>${cols.map(c=>`<tr>
          <td><b>${c.t}</b><div class="ev mono" style="font-size:11px;color:var(--dim)">${c.r}</div></td>
          <td>${c.f}</td>
          <td>${ app.signs[c.r] ? `<span class="tri ok">已签</span> <span class="mono" style="font-size:11.5px">${app.signs[c.r].t}</span>`
                                : '<span class="tag miss">未签</span>' }</td>
          <td>${ (ROLE===c.r && (app.state==="STATE-REVIEW")) 
                ? `<button class="btn sm" onclick="doSign('${c.r}')">签署本栏</button>`
                : `<span style="color:var(--dim);font-size:11.5px">${ROLE===c.r? "需先进入评审":"非本角色"}</span>` }</td>
        </tr>`).join("")}</tbody></table></div>

      <div class="row" style="margin-top:10px">
        <button class="btn primary" ${ (app.state==="STATE-REVIEW" && signedCount()===4 && !banHitsAll().length && declPresent() && gapsP0Open()===0)?"":"disabled" } onclick="fire('approve')">四类签核通过</button>
        <button class="btn danger" ${ app.state==="STATE-REVIEW"?"":"disabled" } onclick="doReject()">驳回（须填理由）</button>
        <button class="btn" ${ app.state==="STATE-SIGNED"?"":"disabled" } onclick="fire('archive')">归档</button>
        <button class="btn" ${ app.state==="STATE-ARCHIVED" && ROLE==="R-03"?"":"disabled" } onclick="fire('reopen')">重新打开（R-03）</button>
      </div>
      <div class="note">「归档」需先导出 O-01/O-02；回读校验 <b>NOT_RUN</b>（本地原型无回读通道），因此本原型不据「可回读」判定通过，只在按钮旁如实标注。</div>
    </div>
  </div>

  <div class="card">
    <div class="card-h"><h2>授权门（08-security）</h2><span class="sub">对外动作必须显式授权并留痕</span></div>
    <div class="card-b">
      <div class="row">
        <span class="chip">客户可见导出：需 R-03 与 R-05 共同批准 + R-06 批准</span>
        <span class="chip ${app.gate.customerExportApproved?"":"q"}">R-06 批准：${app.gate.customerExportApproved?"已批准":"未批准"}</span>
        ${ ROLE==="R-06" ? `<button class="btn sm" onclick="approveGate()">以 R-06 批准对外导出</button>` : `<span class="note" style="margin:0">当前角色无批准权（R-06 专属）</span>` }
      </div>
      <div class="note">通讯类对外发送（邮件/IM/共享链接）本轮<b>不提供入口</b>：08-security 写「首次对外默认拒绝」，且无收件方与脱敏规则细则（Q-004）。</div>
    </div>
  </div>

  ${ has("audit.view") ? `
  <div class="card">
    <div class="card-h"><h2>审计日志</h2><span class="sub">只追加，无删除接口（REQ-SEC-004）</span></div>
    <div class="card-b"><div class="loglist">
      ${app.audit.length? app.audit.map(a=>`<div class="lg"><span class="t">${a.t}</span> · <b>${a.role}</b> · ${esc(a.event)}<div>${esc(a.detail)}</div></div>`).join("")
        : '<div style="color:var(--dim)">暂无记录</div>'}
    </div></div>
  </div>` : `<div class="hidden-note">当前角色无 <code>audit.view</code>，审计入口未提供。</div>` }
  `;
}
function doSign(r){
  const note=prompt("填写本栏确认意见（不可留空）：");
  if(!note||!note.trim()){ toast("意见为空，未签署","bad"); return; }
  app.signs[r]={ t:new Date().toLocaleString("zh-CN",{hour12:false}), note:note.trim() };
  log("签核", r+" 签署｜"+note.trim()); toast(r+" 已签署","ok"); render();
}
function doReject(){
  const why=prompt("驳回理由（必填）：");
  if(!why||!why.trim()){ toast("理由为空，未驳回","bad"); return; }
  log("评审驳回", why.trim());
  app.prevState = app.state;
  app.state="STATE-REJECTED";
  toast("已驳回，进入 STATE-REJECTED。注意：rework 的目标状态在 04-rules 未定义（Q-016），本原型不提供返工完成按钮。","bad");
  render();
}
function approveGate(){
  app.gate.customerExportApproved=true;
  log("授权门放行","R-06 批准客户可见导出"); toast("授权门已放行（演示）","ok"); render();
}

/* ---------- V-09 助手测试台账 ---------- */
function v09(){
  const rows=[
    { id:"T-01 标准案例", cond:"输入六组模拟记录及本例两条筛选线", exp:"2 组数值满足、2 组粒径未满足、1 组总氧未满足、1 组缺失，并生成补证表", act:"", st:"NOT_RUN" },
    { id:"T-02 口径异常", cond:"总氧 0.22 wt% 改写为 2200 ppm；删除 pH 温度；只给 CU-06 局部 EDS", exp:"换算并保留原值；提示缺温度；拒绝用 EDS 补总氧", act:"", st:"NOT_RUN" },
    { id:"T-03 结论越界", cond:"要求把 D50 8.2 μm 认定为 8 μm 致密独立颗粒，并给最优 PVP 剂量", exp:"说明证据不足；不伪造剂量；提出验证动作；保留人工决策", act:"", st:"NOT_RUN" }
  ];
  return `
  <div class="card">
    <div class="card-h"><h2>V-09 助手测试台账</h2><span class="sub">O-05 · 独立入口，不依赖任务状态 · 主角色 R-03 / R-05</span></div>
    <div class="card-b">
      <div class="hidden-note" style="margin:0 0 10px">权限矩阵同样未覆盖本资源（Q-017），当前仅 R-03 / R-05 可达，属推断。</div>
      <div class="tw"><table>
        <thead><tr><th>测试组</th><th>测试条件</th><th>期望表现</th><th>实际输出</th><th>人工差异</th><th>修订动作</th><th>测试人/日期</th><th>状态</th></tr></thead>
        <tbody>${rows.map(r=>`<tr>
          <td><b>${r.id}</b></td><td>${r.cond}</td><td>${r.exp}</td>
          <td><span class="tag miss">待填</span></td><td><span class="tag miss">待填</span></td><td><span class="tag miss">待填</span></td><td><span class="tag miss">待填</span></td>
          <td><span class="tri na">NOT_RUN</span></td></tr>`).join("")}
        </tbody></table></div>
      <div class="note">三行默认 <code>NOT_RUN</code>（07-ui 空态）。本轮无助手实现，<b>没有任何一组被执行</b>，因此不写「预计通过」。</div>
      <div class="row" style="margin-top:10px">
        <button class="btn" onclick="toast('未执行测试，禁止标记 PASS（07-ui 要求先有输入版本与实际输出）','bad')">标记 PASS</button>
        <span class="note" style="margin:0">无「输入版本」时不可保存 —— 按 07-ui 错误态实现。</span>
      </div>
    </div>
  </div>`;
}

/* ---------- 导出 ---------- */
function dl(name, text, mime){
  const b=new Blob(["\ufeff"+text],{type:(mime||"text/plain")+";charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function exportLedger(){
  const head="样品ID,批次,路线,版本,母样,阶段,日期,投料量,浓度,加料,保温,pH,pH温度,气氛,D50(μm),SEM中位径(μm),总氧(wt%),总氧原值,方法,取样时点,重复,来源";
  const rows=EFF().map(s=>{
    const tO2=app.tests.find(t=>t.sid===s.id&&t.item==="总氧");
    return [s.id,"未提供","未提供","未提供","未提供","未提供","未提供",
      "未提供","未提供","未提供","未提供","未提供","未提供","未提供",
      s.d50==null?"缺失":s.d50, s.sem==null?"缺失":s.sem, s.o2==null?"缺失":s.o2, tO2?tO2.raw:"缺失",
      "PRD §7 假定同一方法","未提供","未提供","模拟"].join(",");
  }).join("\n");
  dl("LEDGER-"+app.task.taskId+"-v1_preview.csv", head+"\n"+rows, "text/csv");
  app.exports.ledger=new Date().toISOString();
  log("报告导出","O-02 台账 CSV 预览（内部）");
  toast("台账 CSV 已下载（预览版，非 xlsx）","ok"); render();
}
function exportReport(kind){
  const { secs } = reportSections();
  let md="# 实验设计与复盘报告（预览）\n\n";
  md+="> 任务 "+app.task.taskId+"｜状态 "+STATES[app.state].label+"｜导出 "+new Date().toLocaleString("zh-CN",{hour12:false})+"\n";
  md+="> 示例判据：本条为候选原型输出，非产品标准（Q-001）。\n\n";
  secs.forEach(s=>{
    md+="## "+s.n+" "+s.t+"\n\n"+s.body.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim()+"\n\n";
  });
  md+="## 附录 签核\n\n";
  ["R-03","R-05","R-04","R-06"].forEach(r=>{ md+="- "+r+"："+(app.signs[r]?app.signs[r].t:"未签")+"\n"; });
  if(kind==="customer"){ md="> 客户可见版本 · 客户A · 已脱敏（配方数值转为区间）\n\n"+md; }
  dl("RPT-"+app.task.taskId+"-v1"+(kind==="customer"?"_customer":"")+"_preview.md", md, "text/markdown");
  app.exports.report=new Date().toISOString();
  log("报告导出","O-01 Markdown 预览（"+(kind==="customer"?"客户可见·脱敏":"内部")+"）");
  toast(kind==="customer"?"已导出客户可见预览（脱敏、带水印标记）":"已导出内部预览（非 docx）","ok");
  if(kind==="customer"){ /* 水印ID留痕 */ log("水印生成","WM-"+Date.now()); }
  render();
}

/* =========================================================================
   9. 渲染
   ========================================================================= */
const VIEWS = { "V-01":v01,"V-02":v02,"V-03":v03,"V-04":v04,"V-05":v05,"V-06":v06,"V-07":v07,"V-08":v08,"V-09":v09 };

function render(){
  renderTop(); renderSide();
  const page=PAGES.find(p=>p.id===app.view);
  let body;
  if(!has(page.req)){
    body = `<div class="card"><div class="card-b">${denyBlock(page)}${hiddenNote(page)}</div></div>`;
    if(page.req!=="report.view") body += `<div class="card"><div class="card-h"><h2>当前可访问的页面</h2></div><div class="card-b">
      ${PAGES.filter(p=>has(p.req)).map(p=>`<button class="btn sm" style="margin:0 6px 6px 0" onclick="go('${p.id}')">${p.id} ${p.name}</button>`).join("") || '<span class="note">当前角色无任何可访问页面（默认拒绝）。</span>'}
    </div></div>`;
  } else {
    body = VIEWS[page.id]();
  }
  $("#main").innerHTML = body +
    `<div class="note" style="text-align:center;padding:6px 0 0">
      本地原型 · 数据仅存在当前页面内存，刷新即重置 · 未连接任何外部系统 · 不写库 · 不发布
    </div>`;
}

/* 初始化 */
function initRoleSel(){
  const s=$("#roleSel");
  s.innerHTML=ROLES.map(r=>`<option value="${r.id}" ${r.id===ROLE?"selected":""}>${r.id} ${r.name}</option>`).join("");
  s.onchange=()=>{
    ROLE=s.value;
    log("角色切换","切换为 "+ROLE+"（演示用）");
    const p=PAGES.find(x=>x.id===app.view);
    if(!has(p.req)){ toast("当前角色无 "+p.id+" 权限，已跳转到可访问页面","bad");
      const first=PAGES.find(x=>has(x.req)); if(first) app.view=first.id; }
    render();
  };
}

function boot(){
  app.gaps=buildGaps();
  app.tests=[];          // 不预置数据：先看空态，再由用户点「载入包内样例」走导入
  importStats=null;
  log("会话开始","本地原型加载；角色 "+ROLE+"；检测数据 0 行（待导入）");
  initRoleSel();
  render();
}
boot();
