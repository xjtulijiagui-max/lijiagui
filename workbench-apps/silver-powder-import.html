<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聚和材料｜银粉采购前端导入 · v1.1.0_r001（本地预览）</title>
<!-- 依据：workspace/specs/07-ui.md 页面清单 V-01～V-10；04-rules.md 规则与状态机；08-security.md 权限矩阵 -->
<!-- 数据性质：模拟（PRD 第 7 节教学样例 + 演示构造），页面固定水印「模拟数据·不得外发」 RULE-SEC-004 -->
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --ink:#0f172a; --ink2:#475569; --ink3:#64748b;
  --line:#e2e8f0; --line2:#eef2f6;
  --brand:#0f766e; --brand-ink:#0b5f59; --brand-bg:#e6f2f1;
  --green:#15803d; --green-bg:#dcfce7; --amber:#b45309; --amber-bg:#fef3c7;
  --red:#b91c1c; --red-bg:#fee2e2; --gray:#64748b; --gray-bg:#eef1f5;
  --blue:#1d4ed8; --blue-bg:#e8eefc;
  --r:10px; --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -16px rgba(15,23,42,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:14px}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:600}
.wrap{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:236px 1fr;
  grid-template-areas:"head head" "side main" "foot foot"}
.wrap>*{min-width:0}
.stat,.ch,.cb,.rt{min-width:0}
/* ---------- header ---------- */
.hd{grid-area:head;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:10px 18px;position:sticky;top:0;z-index:40}
.hd .logo{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;flex:none}
.hd .logo svg{width:18px;height:18px}
.hd .tt{min-width:0}
.hd .tt b{display:block;font-size:14px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .tt span{display:block;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .sp{flex:1}
.hd .ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font-size:11.5px;
  border:1px solid var(--line);background:#fbfcfd;color:var(--ink2);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--gray)}
.pill.sim{border-color:#f0c9a8;background:#fff7ed;color:#9a3412;font-weight:600}
.pill.sim .dot{background:#ea580c}
select.role{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;color:var(--ink);max-width:190px}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;color:var(--ink2);
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:32px}
.iconbtn:hover{border-color:#cbd5e1;background:#fbfcfd}
.iconbtn svg{width:14px;height:14px}
/* ---------- sidebar ---------- */
.side{grid-area:side;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px 20px;
  position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto}
.side .grp{font-size:11px;color:var(--ink3);letter-spacing:.08em;padding:10px 10px 6px;font-weight:600}
.side a.nv{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--ink2);
  font-size:13px;margin-bottom:2px}
.side a.nv svg{width:15px;height:15px;flex:none;opacity:.75}
.side a.nv .tag{margin-left:auto;font-size:10.5px;color:var(--ink3);border:1px solid var(--line);
  border-radius:5px;padding:0 4px;line-height:15px}
.side a.nv:hover{background:var(--line2)}
.side a.nv.on{background:var(--brand-bg);color:var(--brand-ink);font-weight:600}
.side a.nv.on svg{opacity:1}
.side .note{font-size:11px;color:var(--ink3);padding:14px 10px 0;line-height:1.6;border-top:1px solid var(--line2);margin-top:12px}
/* ---------- main ---------- */
main{grid-area:main;padding:18px 20px 28px;max-width:1440px;width:100%;min-width:0}
.pg-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pg-h .no{font-size:11px;color:var(--brand-ink);background:var(--brand-bg);border-radius:6px;padding:2px 6px;font-weight:600}
.pg-h h1{font-size:18px;line-height:1.4}
.pg-h p{margin:2px 0 0;color:var(--ink3);font-size:12.5px}
.pg-h .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;min-width:0}
.card>.ch{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.card>.ch h3{font-size:13.5px}
.card>.ch .sub{font-size:11.5px;color:var(--ink3)}
.card>.ch .rt{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card>.cb{padding:14px}
.card>.cb.tight{padding:0}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink);
  display:inline-flex;align-items:center;gap:6px;min-height:34px;font-size:13px}
.btn:hover{border-color:#cbd5e1;background:#fbfcfd}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;min-height:28px;font-size:12px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.stat .k{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.stat .v{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .m{font-size:11px;color:var(--ink3);margin-top:1px}
.stat .v small{font-size:12px;font-weight:500;color:var(--ink3);margin-left:3px}
/* table */
.tw{overflow:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{background:#f8fafc;color:var(--ink2);text-align:left;font-weight:600;padding:9px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
tbody td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:hover{background:#fbfcfd}
tbody tr.sel{background:var(--brand-bg)}
td.num{font-variant-numeric:tabular-nums;text-align:right}
td.mono,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.muted{color:var(--ink3)}
.na{color:#94a3b8;font-style:italic}
/* badges */
.b{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:6px;font-size:11.5px;
  border:1px solid transparent;white-space:nowrap;line-height:18px}
.b.g{background:var(--green-bg);color:var(--green);border-color:#bbf7d0}
.b.a{background:var(--amber-bg);color:var(--amber);border-color:#fde68a}
.b.r{background:var(--red-bg);color:var(--red);border-color:#fecaca}
.b.p{background:var(--gray-bg);color:var(--gray);border-color:#e2e8f0}
.b.b{background:var(--blue-bg);color:var(--blue);border-color:#c7d7fb}
.b.t{background:#f0fdfa;color:var(--brand-ink);border-color:#ccfbf1}
.dotc{display:inline-block;width:8px;height:8px;border-radius:50%}
.dg{background:var(--green)}.da{background:#d97706}.dr{background:#dc2626}.dp{background:#94a3b8}
/* misc */
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kv{display:grid;grid-template-columns:112px 1fr;gap:6px 10px;font-size:12.5px}
.kv .k{color:var(--ink3)}
.note-box{border:1px dashed #cbd5e1;background:#fbfcfd;border-radius:8px;padding:9px 11px;font-size:12px;color:var(--ink2)}
.note-box b{color:var(--ink)}
.warn-box{border:1px solid #fed7aa;background:#fff7ed;border-radius:8px;padding:9px 11px;font-size:12px;color:#9a3412}
.err-box{border:1px solid #fecaca;background:#fef2f2;border-radius:8px;padding:9px 11px;font-size:12px;color:#991b1b}
.ok-box{border:1px solid #bbf7d0;background:#f0fdf4;border-radius:8px;padding:9px 11px;font-size:12px;color:#166534}
.sec-t{font-size:12px;color:var(--ink3);font-weight:600;margin:0 0 7px}
.hr{height:1px;background:var(--line2);margin:12px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:13px;
  color:var(--ink);background:#fff;min-height:34px}
.field input:focus,.field select:focus{outline:2px solid #99f6e4;outline-offset:0;border-color:var(--brand)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
/* footer */
footer{grid-area:foot;border-top:1px solid var(--line);background:var(--panel);padding:8px 18px;
  display:flex;gap:12px;align-items:center;font-size:11.5px;color:var(--ink3);flex-wrap:wrap}
footer .simtag{color:#9a3412;font-weight:600}
footer .sp{flex:1}
footer button{background:none;border:0;color:var(--ink2);cursor:pointer;font-size:11.5px;text-decoration:underline dotted;padding:2px}
/* modal */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;z-index:80;align-items:center;justify-content:center;padding:18px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:12px;max-width:720px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 24px 60px -20px rgba(15,23,42,.5)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:#fff;z-index:2}
.modal .mh h3{font-size:15px}
.modal .mh .x{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--ink3);font-size:20px;line-height:1;padding:4px 6px}
.modal .mb{padding:14px 16px}
.modal .mf{padding:12px 16px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:#0f172a;color:#fff;padding:10px 16px;border-radius:9px;font-size:12.5px;z-index:99;transition:.22s;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* watermark */
.wm{position:fixed;inset:0;pointer-events:none;z-index:3;display:grid;place-items:center;overflow:hidden}
.wm span{font-size:74px;font-weight:800;color:rgba(15,23,42,.045);transform:rotate(-24deg);white-space:nowrap;letter-spacing:.08em;user-select:none}
/* empty / 403 */
.big-empty{text-align:center;padding:40px 18px;color:var(--ink3)}
.big-empty svg{width:34px;height:34px;opacity:.4;margin-bottom:8px}
.big-empty b{display:block;color:var(--ink2);font-size:14px;margin-bottom:4px}
.big-empty p{margin:0 0 10px;font-size:12.5px;max-width:520px;margin-inline:auto}
/* progress */
.bar{height:7px;border-radius:999px;background:#eef2f6;overflow:hidden;min-width:64px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:999px}
@media (max-width:1080px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.three{grid-template-columns:1fr}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "side" "main" "foot";max-width:100vw}
  .side{max-width:100vw}
  .hd{flex-wrap:wrap}
  .hd .sp{display:none}
  .hd .ctl{width:100%;justify-content:flex-start;gap:6px}
  .hd .ctl .pill{font-size:11px;padding:3px 8px}
  .hd .ctl select.role{max-width:100%;flex:1}
  #batchPill{display:none}
  .hd .ctl .field{width:100%}
  .hd .ctl .field select{max-width:none;width:100%}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;
    overflow-x:auto;padding:8px 10px;white-space:nowrap;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .side .grp{display:none}
  .side a.nv{margin:0;flex:none;font-size:12.5px;padding:7px 10px}
  .side a.nv .tag{display:none}
  .side .note{display:none}
  main{padding:14px 12px 22px}
  .hd{padding:9px 12px;gap:8px}
  .hd .tt b{font-size:13px}
  .hd .tt span{display:none}
  .stats{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:92px 1fr}
  table{font-size:12px}
  .grid2,.grid4{grid-template-columns:1fr}
  .wm span{font-size:48px}
  footer{padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
}
@media print{
  .hd,.side,.pg-h .acts,.btn,.mask{display:none!important}
  .wrap{grid-template-columns:1fr;grid-template-areas:"main"}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
  thead th{position:static}
}
</style>
</head>
<body>
<div class="wm"><span>模拟数据 · 不得外发</span></div>

<div class="wrap">
  <header class="hd">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 20h18"/><path d="M6 20V9l5-5 5 5v11"/><path d="M11 20v-5h4v5"/>
      </svg>
    </div>
    <div class="tt">
      <b>聚和材料｜银粉采购前端导入</b>
      <span>本地预览 · 规格 v1.1.0_r001 · BASELINE_DRAFT（未批准 / 未开发 / 未上线）</span>
    </div>
    <div class="sp"></div>
    <div class="ctl">
      <span class="pill sim" title="RULE-SEC-004：数据性质标记为模拟，页面固定水印">
        <span class="dot"></span>模拟数据·不得外发
      </span>
      <span class="pill" id="batchPill" title="批次号格式为候选（Q-006）"></span>
      <label class="field" style="flex-direction:row;align-items:center;gap:6px;color:var(--ink3)">
        <span style="font-size:11.5px">角色</span>
        <select class="role" id="roleSel" aria-label="预览角色切换（无账号体系，Q-003 未确认）"></select>
      </label>
      <button class="iconbtn" data-act="about" title="本页范围与缺口">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
        说明
      </button>
    </div>
  </header>

  <nav class="side" id="nav" aria-label="页面导航"></nav>

  <main id="app"></main>

  <footer>
    <span>批次号 <b id="fBatch">—</b>（格式候选 Q-006）</span>
    <span>数据性质 <span class="simtag" id="fNature">模拟数据·不得外发</span></span>
    <span>版本 v1.1.0_r001 · 生成 <span id="fTime">—</span></span>
    <span>规格 07-ui / 04-rules / 08-security</span>
    <span class="sp"></span>
    <button data-act="audit">审计日志</button>
    <button data-act="acceptance">验收路径</button>
    <button data-act="gaps">未落地清单</button>
  </footer>
</div>

<div class="mask" id="mask" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* =====================================================================
   0. 常量：批次、阶段、事件、转换（全部取自 specs/04-rules.md，不增不改）
   ===================================================================== */
const BATCH = {
  no: 'WK-202645-01',            /* 候选格式 WK-YYYYWW-nn，Q-006 未确认 */
  ref: '2026-11-06',             /* date_ref：本期批次日期，见 04「计算口径」 */
  nature: '模拟',                /* RULE-SEC-004 */
  ver: 'v1.1.0_r001',
  generated: '2026-11-07 17:10'
};

const STAGES = [
  { id:'STATE-TECH-EXCHANGE', name:'技术交流',   idx:1 },
  { id:'STATE-BASIC-TEST',    name:'基本检测',   idx:2 },
  { id:'STATE-LAB-SAMPLE',    name:'研发小样',   idx:3 },
  { id:'STATE-PILOT-SAMPLE',  name:'研发大样',   idx:4 },
  { id:'STATE-SMALL-TRIAL',   name:'小试',       idx:5 },
  { id:'STATE-MID-TRIAL',     name:'中试',       idx:6 },
  { id:'STATE-TRANSFER',      name:'转产',       idx:7 },
  { id:'STATE-APPROVED',      name:'合格供应商', idx:8 },
  { id:'STATE-NG',            name:'NG',         idx:9 }
];
const stageName = id => (STAGES.find(s => s.id === id) || {}).name || '待指定';
const stageIdx  = id => (STAGES.find(s => s.id === id) || {}).idx || 0;

/* 事件与守卫：逐条对应 04「状态转移」表 */
const EVENTS = [
  { ev:'E-TECH-START',   from:null,                  to:'STATE-TECH-EXCHANGE', label:'建立技术交流' },
  { ev:'E-TECH-DONE',    from:'STATE-TECH-EXCHANGE', to:'STATE-BASIC-TEST',    label:'交流完成 → 基本检测' },
  { ev:'E-BASIC-PASS',   from:'STATE-BASIC-TEST',    to:'STATE-LAB-SAMPLE',    label:'基本检测通过 → 研发小样' },
  { ev:'E-LAB-PASS',     from:'STATE-LAB-SAMPLE',    to:'STATE-PILOT-SAMPLE',  label:'小样通过 → 研发大样' },
  { ev:'E-PILOT-PASS',   from:'STATE-PILOT-SAMPLE',  to:'STATE-SMALL-TRIAL',   label:'大样通过 → 小试' },
  { ev:'E-SMALL-PASS',   from:'STATE-SMALL-TRIAL',   to:'STATE-MID-TRIAL',     label:'小试通过 → 中试' },
  { ev:'E-MID-PASS',     from:'STATE-MID-TRIAL',     to:'STATE-TRANSFER',      label:'中试通过 → 转产' },
  { ev:'E-TRANSFER-PASS',from:'STATE-TRANSFER',      to:'STATE-APPROVED',      label:'转产通过 → 合格供应商' },
  { ev:'E-FAIL',         from:'*',                   to:'STATE-NG',            label:'结论不通过 → NG' },
  { ev:'E-REWORK',       from:'*',                   to:'*',                   label:'返工回退（指定目标阶段）' },
  { ev:'E-REOPEN',       from:'STATE-NG',            to:'*',                   label:'NG 重启' }
];

/* =====================================================================
   1. 样例数据：来源标注严格二分
      src='prd'  取自 PRD 第 7 节教学样例（SS-01..SS-06、项目A/B、500/420/80）
      src='demo' 演示构造（PRD 未给、但主流程必需），已在页面「说明」中列明
   ===================================================================== */

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && s.samples && s.config) return Object.assign(initialState(), s);
    }
  }catch(e){ /* 本地存储不可用时降级为内存态 */ }
  return initialState();
}

  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}

/* =====================================================================
   3. 工具与计算层（只读，不碰 DOM）
   ===================================================================== */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function dayNum(d){
  if(!d) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
  if(!m) return null;
  return Math.floor(Date.UTC(+m[1], +m[2]-1, +m[3]) / 86400000);
}
function nowStr(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
function supName(id){ const s = SEED.suppliers.find(x => x.id === id) || state.suppliers.find(x => x.id === id); return s ? s.name : id; }
function sampleById(id){ return state.samples.find(s => s.id === id); }
function audit(evt, detail){
  state.audits.unshift({ at: nowStr(), role: state.role, evt, detail });
  if(state.audits.length > 200) state.audits.length = 200;
  save();
}

/* 停留天数 D = date_ref − date_stage_enter（自然日，当日=0） RULE-SMP-003 */
function dwell(s){
  const a = dayNum(s.enter), b = dayNum(BATCH.ref);
  if(a == null || b == null) return { value:null, text:'待核', note:'缺阶段进入日' };
  const d = b - a;
  if(d < 0) return { value:null, text:'待核', note:'进入日晚于参考日' };
  return { value:d, text:d + ' 天', note:'' };
}
/* 阈值：逐阶段配置；未配置不判色 RULE-SMP-004 */
function threshold(stageId){
  const t = state.config.thresholds[stageId];
  if(!t || t.warn == null || t.stall == null) return null;
  return t;
}
function colorOf(s){
  const d0 = dwell(s);
  if(!hasAnyThreshold()) return { key:'p', label:'待配置', note:'阈值未配置，不判色（RULE-SMP-004 / Q-001）' };
  if(s.stage === 'STATE-APPROVED') return { key:'g', label:'绿（完成）', note:'终态 · 停留 ' + d0.text };
  const d = d0;
  if(d.value == null) return { key:'p', label:'待核', note:d.note };
  const t = threshold(s.stage);
  if(!t) return { key:'p', label:'待配置', note:'阈值未配置，不判色（RULE-SMP-004 / Q-001）' };
  if(d.value < t.warn) return { key:'g', label:'绿（正常）', note:'停留 '+d.value+' < 预警 '+t.warn };
  if(d.value < t.stall) return { key:'a', label:'黄（预警）', note:'预警 '+t.warn+' ≤ 停留 '+d.value+' < 停滞 '+t.stall };
  return { key:'r', label:'红（停滞）', note:'停留 '+d.value+' ≥ 停滞 '+t.stall };
}
/* 返工：>2 触发 RULE-SMP-005 */
function reworkFlag(n){ return n > 2; }
/* 切换完成率 / 偏差 RULE-SWT-001 */
function completion(p){
  if(p.total == null || p.done == null) return { value:null, text:'数据不完整', note:'节点数缺失（RULE-SWT-001）' };
  return { value: Math.round(p.done / p.total * 100), text: Math.round(p.done / p.total * 100) + '%', note:'' };
}
function deviation(p){
  if(!p.actualDone) return { value:null, text:'未完成', note:'未完成不算偏差' };
  const a = dayNum(p.actualDone), b = dayNum(p.planDone);
  if(a == null || b == null) return { value:null, text:'待核', note:'缺计划完成日' };
  const d = a - b;
  return { value:d, text:(d > 0 ? '+' : '') + d + ' 天', note:d > 0 ? '延后' : (d < 0 ? '提前' : '准点') };
}
/* 台账 DIFF = 入库 − (置换 + 结存) RULE-RPL-001 */
function ledgerDiff(r){ return Math.round((r.inbound - (r.replaced + r.balance)) * 10) / 10; }
function ledgerBalance(r){ const d = ledgerDiff(r); return { diff:d, ok: d === 0 }; }
/* 达标判定：对照表未提供 → 全部待数据 RULE-TST-002 / AC-014 */
function tst2(s){
  const tasks = state.tests.filter(t => t.sample === s.id);
  const f02ok = tasks.length > 0 && tasks.every(t => t.f02);
  return {
    state:'待数据',
    reason:'《原料检验项目对照表》JH01-01-023/025 未提供（Q-004）→ 区间无法判定，不出候选名单',
    f02: f02ok ? '齐全' : (tasks.length ? '缺 ' + tasks.filter(t => !t.f02).length + ' 项' : '无任务')
  };
}
/* 测试完成标志：F02 编号 + 结论非空 RULE-TST-001 */
function testDone(t){ return !!(t.f02 && t.result && t.result !== '进行中' && t.result !== '待数据'); }
/* 关联率 RULE-DAT-001 */
function linkRate(){
  const total = state.receipts.length;
  const hit = state.receipts.filter(r => state.samples.some(s => s.batch === r.sampleBatch)).length;
  return total ? { rate: Math.round(hit / total * 1000) / 10, hit, total } : { rate:null, hit:0, total:0 };
}

/* COA 表头 9 个指标 + 产品名称/型号，逐列取自用户截图；单位固定，不增删列（RULE-COA-001） */
const COA_FIELDS = [
  { k:'d10',    label:'D10',       unit:'μm',    grp:'粒度分布' },
  { k:'d50',    label:'D50',       unit:'μm',    grp:'粒度分布' },
  { k:'d99',    label:'D99',       unit:'μm',    grp:'粒度分布' },
  { k:'d100',   label:'D100',      unit:'μm',    grp:'粒度分布' },
  { k:'tap',    label:'振实密度',  unit:'g/cm³', grp:'物性指标' },
  { k:'bulk',   label:'松装密度',  unit:'g/cm³', grp:'物性指标' },
  { k:'ssa',    label:'比表面积',  unit:'m²/g',  grp:'物性指标' },
  { k:'loi110', label:'烧损 110℃', unit:'%',     grp:'烧损' },
  { k:'loi538', label:'烧损 538℃', unit:'%',     grp:'烧损' }
];
function coaOf(lot){
  const arr = state.coa.filter(c => c.lot === lot);
  if(!arr.length) return null;
  return arr.slice().sort((a, b) => String(a.date || '').localeCompare(String(b.date || ''))).pop();
}
function coaMissing(c){
  if(!c) return COA_FIELDS.map(f => f.label).concat(['产品名称/型号']);
  const out = [];
  if(!c.product) out.push('产品名称/型号');
  COA_FIELDS.forEach(f => { if(c[f.k] == null || c[f.k] === '' || isNaN(Number(c[f.k]))) out.push(f.label); });
  return out;
}
function inboundOf(rcvId){ return state.inbound.filter(i => i.rcv === rcvId); }
function cumInbound(){
  return state.inbound.filter(i => i.status === '已入库' && i.no).reduce((a, i) => a + Number(i.qty || 0), 0);
}
function inspOf(lot, stage){ return state.insp.find(i => i.lot === lot && i.stage === stage) || null; }
function prepReady(lot){ const e = inspOf(lot, '电镜'); return !!(e && e.conclusion); }
function measOf(lot){ const p = inspOf(lot, '制样'); return (p && p.measured) ? p.measured : null; }
function devOf(c, m, k){
  if(!c) return { text:'无申报值', cls:'p', note:'该批无 COA' };
  if(c[k] == null) return { text:'无申报值', cls:'p', note:'COA 缺项，不推算' };
  if(!m || m[k] == null) return { text:'未测', cls:'p', note:'制样实测待补' };
  const d = Number(m[k]) - Number(c[k]);
  return { value:d, text:(d > 0 ? '+' : '') + d.toFixed(2), cls:'t', note:'实测 − 申报，只展示不判定（RULE-COA-002）' };
}
function lotRows(){
  return state.receipts.map(r => ({ r, s: state.samples.find(x => x.batch === r.sampleBatch) || null, lot: r.lot }));
}

/* 缺口统计 */
function gapStats(){
  const missing = [];
  state.samples.forEach(s => {
    if(!s.level) missing.push({ who:s.id, f:'样品层级' });
    if(!s.req)   missing.push({ who:s.id, f:'需求单号' });
    if(!s.enter) missing.push({ who:s.id, f:'阶段进入日' });
    if(!s.owner) missing.push({ who:s.id, f:'负责人' });
  });
  state.receipts.forEach(r => { if(!r.inbound) missing.push({ who:r.id, f:'入库单号（在途/待核）' }); });
  const pending = pendingConfirms().length;
  const red = state.samples.filter(s => colorOf(s).key === 'r').length;
  const amber = state.samples.filter(s => colorOf(s).key === 'a').length;
  const gray = state.samples.filter(s => colorOf(s).key === 'p').length;
  return { missing, pending, red, amber, gray };
}
/* 待确认结论（RULE-SEC-002）：转产/导入/NG/风险评估/置换异常 */
function pendingConfirms(){
  const out = [];
  if(!state.confirms['EXT-002']) out.push({ key:'EXT-002', type:'转产结论', obj:'SS-05', text:'转产会议通过' });
  if(!state.confirms['REV-001']) out.push({ key:'REV-001', type:'风险评估', obj:'供应商A', text:'不符合项未闭环，可行性待定' });
  state.ledger.forEach(r => {
    if(!ledgerBalance(r).ok && !state.confirms['LED:' + r.id]) out.push({ key:'LED:' + r.id, type:'置换异常', obj:r.id, text:'台账差异 ' + ledgerDiff(r).toFixed(1) + ' kg' });
  });
  return out;
}

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.getAttribute('data-act');
  const id = el.getAttribute('data-id') || '';
  switch(act){
    case 'close': closeModal(); return;
    case 'about': showAbout(); return;
    case 'audit': showAudit(); return;
    case 'acceptance': showAcceptance(); return;
    case 'gaps': showGaps(); return;
    case 'sel': state.selectedSample = (state.selectedSample === id ? null : id); refreshAll(); return;
    case 'fst': FILTER.status = id; refreshAll(); return;
    case 'adv': openAdvance(id); return;
    case 'ev': doEvent(id, el.getAttribute('data-ev')); return;
    case 'mapfix': fixMapping(id); return;
    case 'cfg-demo': fillDemoThresholds(); return;
    case 'cfg-save': saveConfig(); return;
    case 'imp-run': runImport(false); return;
    case 'imp-conflict': runImport(true); return;
    case 'imp-rollback': rollbackImport(); return;
    case 'exp': doExport(el.getAttribute('data-kind')); return;
    case 'rep-gen': genReport(); return;
    case 'rep-final': finalizeReport(); return;
    case 'ledger-check': checkLedger(); return;
    case 'coa-form': openCoaForm(id); return;
    case 'coa-save': saveCoa(id); return;
    case 'inb-form': openInboundForm(id); return;
    case 'inb-save': saveInbound(id); return;
    case 'sem-form': openSemForm(id); return;
    case 'sem-save': saveSem(id); return;
    case 'prep-form': openPrepForm(id); return;

function runImport(conflict){
  if(!allowed('import', 'edit')){
    audit('越权尝试', '角色 ' + state.role + ' 请求导入，结果：拒绝');
    openModal('已拒绝', '<div class="err-box">当前角色无导入权限（08 矩阵：导入仅 R01）。</div>');
    return;
  }
  if(state.imported && !conflict){
    state.importRuns += 1;
    audit('导入', '批次 ' + BATCH.no + ' 重复导入同一文件 → 幂等跳过，记录数不变');
    save(); refreshAll(); toast('幂等跳过：记录数不变（第 ' + state.importRuns + ' 次）');
    return;
  }
  if(conflict){
    state.imported = true; state.importRuns += 1; state.conflictMode = true;
    audit('导入', '批次 ' + BATCH.no + ' 人为改动字段后重复导入 → 生成冲突清单，未自动覆盖');
    save(); refreshAll(); toast('已生成冲突清单（未覆盖原值）');
    return;
  }
  state.imported = true; state.importRuns = 1; state.conflictMode = false;
  audit('导入', '批次 ' + BATCH.no + ' 导入完成：' + (state.samples.length + state.receipts.length + state.tests.length) + ' 条，失败 3 行，冲突 2 条');
  save(); refreshAll(); toast('已载入样例批次');
}

function saveConfig(){
  if(access(state.role, 'config', 'edit') === 'no'){ toast('无配置修改权限'); return; }
  const next = {}, bad = [];
  STAGES.forEach(s => {
    const w = document.getElementById('w_' + s.id), st = document.getElementById('s_' + s.id);
    if(!w || !st) return;
    const wv = w.value === '' ? null : Number(w.value);
    const sv = st.value === '' ? null : Number(st.value);
    if(wv == null || sv == null) return;
    if(!(wv > 0) || !(sv > wv)){ bad.push(s.name + '：需满足 0 < W < S'); return; }
    next[s.id] = { warn:wv, stall:sv };
  });
  if(bad.length){
    openModal('保存被拒绝', '<div class="err-box">' + bad.map(b => '· ' + esc(b)).join('<br>') + '</div><div class="note-box" style="margin-top:10px">不合法值一律拒绝，不静默修正。</div>');
    return;
  }
  if(!Object.keys(next).length){ toast('未填写任何阈值，未保存'); return; }
  const old = JSON.stringify(state.config.thresholds);
  confirmBox('确认修改阈值',
    '将写入 ' + Object.keys(next).length + ' 个阶段的阈值，并重算整张看板。旧值：' + (old === '{}' ? '空' : esc(old)) + '。此动作会写入审计（变更前后值）。',

/* ---------------- V-02 测试进度看板 ---------------- */
function filteredSamples(){
  return state.samples.filter(s => {
    if(FILTER.sup !== 'all' && s.sup !== FILTER.sup) return false;
    if(FILTER.status === 'all') return true;
    return colorOf(s).key === FILTER.status;
  });
}
function viewBoard(){
  const p = pageById('board');
  const agg = isAgg();
  const canAdv = allowed('board', 'advance');
  const rows = filteredSamples();
  const counts = { all:state.samples.length, g:0, a:0, r:0, p:0 };
  state.samples.forEach(s => { counts[colorOf(s).key]++; });

  const statusChips = [
    ['all','全部 ' + counts.all], ['r','红 ' + counts.r], ['a','黄 ' + counts.a],
    ['g','绿 ' + counts.g], ['p','待配置/待核 ' + counts.p]
  ].map(([k, t]) => '<button class="chip' + (FILTER.status === k ? ' on' : '') + '" data-act="fst" data-id="' + k + '">' + t + '</button>').join('');

  return pageHead(p,
      '<button class="btn" data-act="exp" data-kind="O01">导出 O-01（CSV）</button>' +
      '<button class="btn" data-act="imp-run">刷新数据</button>') +
    (!hasAnyThreshold()
      ? '<div class="warn-box" style="margin-bottom:12px"><b>整表不判色：</b>阶段阈值未配置（Q-001 未答）。按 RULE-SMP-004 与 AC-006，状态色统一显示「待配置」灰，不出现黄/红，也不套用任何默认天数。可在 <a href="#/config" style="text-decoration:underline">V-10 配置</a> 录入阈值后复算。</div>'
      : '') +
    '<div class="card"><div class="ch">' +
      '<h3>样品状态</h3><span class="sub">共 ' + rows.length + ' / ' + state.samples.length + ' 行' +
        (agg ? ' · 汇总视图：不含逐条负责人' : '') + '</span>' +
      '<div class="rt">' + statusChips +
        '<select class="role" id="supFilter" style="min-height:30px">' +
          '<option value="all">全部供应商</option>' +
          SEED.suppliers.map(x => '<option value="' + x.id + '"' + (FILTER.sup === x.id ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('') +
        '</select></div></div>' +
      '<div class="cb tight"><div class="tw"><table>' +
        '<thead><tr><th>样品ID</th><th>供应商</th><th>规格</th><th>样品层级</th><th>当前阶段</th>' +
        '<th style="text-align:right">停留天数</th><th style="text-align:right">返工</th><th>状态色</th><th>最近更新</th>' +
        (agg ? '' : '<th>负责人</th>') + '<th>操作</th></tr></thead><tbody>' +
        (rows.length ? rows.map(s => {
          const d = dwell(s), c = colorOf(s);
          return '<tr class="' + (state.selectedSample === s.id ? 'sel' : '') + '" data-act="sel" data-id="' + s.id + '" style="cursor:pointer">' +
            '<td class="mono">' + esc(s.id) + '</td>' +
            '<td>' + esc(supName(s.sup)) + '</td>' +
            '<td>' + esc(s.spec) + '</td>' +
            '<td>' + (s.level ? esc(s.level) : na('待补全')) + '</td>' +
            '<td>' + esc(stageName(s.stage)) +
              (s.mapPending ? ' ' + badge('映射待确认', 'b', '原文「' + s.stageRaw + '」未人工指定（RULE-SMP-001）') : '') + '</td>' +
            '<td class="num">' + (d.value == null ? na(d.text) : d.value) + '</td>' +
            '<td class="num">' + s.rework + (reworkFlag(s.rework) ? ' ' + badge('反复NG风险', 'r', '返工 >2 次（RULE-SMP-005）') : '') + '</td>' +
            '<td>' + colorBadge(c) + '</td>' +
            '<td class="mono">' + esc(s.enter) + '</td>' +
            (agg ? '' : '<td>' + (s.owner || na('未指派')) + '</td>') +
            '<td>' + (canAdv && s.stage !== 'STATE-APPROVED'
              ? '<button class="btn sm" data-act="adv" data-id="' + s.id + '">推进</button>'
              : na('—')) + '</td>' +
          '</tr>';
        }).join('')
        : '<tr><td colspan="11">' + emptyState('本期无样品', '筛选条件下没有记录；或 I-02 送样数据尚未导入。', '<button class="btn sm" data-act="fst" data-id="all">清除筛选</button>') + '</td></tr>') +
      '</tbody></table></div></div></div>' +
    (state.selectedSample ? sampleDetailHTML(sampleById(state.selectedSample), agg, canAdv) : '') +
    '<div class="note-box">列即 O-01 必含字段（07-ui.md）。「最近更新」在样例中与「阶段进入日」取同一值——05 的 T-05.last_update 与 T-02.stage_enter_date 是两个字段，此处未区分，已列入未落地清单。</div>';

function sampleDetailHTML(s, agg, canAdv){
  if(!s) return '';
  const d = dwell(s), c = colorOf(s), t = threshold(s.stage), tt = tst2(s);
  const nextEv = EVENTS.filter(e => e.from === s.stage);
  const feas = nextEv.map(e => {
    const miss = guardOf(s, e.ev);
    return '<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line2)">' +
      '<span>' + (miss.length ? '⛔' : '✅') + '</span>' +
      '<div style="flex:1"><div style="font-size:12.5px">' + esc(e.label) + '</div>' +
      '<div class="muted" style="font-size:11.5px">' + (miss.length ? esc(miss.join('；')) : '守卫满足，可执行') + '</div></div></div>';
  }).join('');

  return '<div class="card"><div class="ch"><h3>' + esc(s.id) + ' · 判定依据</h3>' +
    '<span class="sub">' + esc(supName(s.sup)) + ' / ' + esc(s.spec) + '</span>' +
    '<div class="rt"><button class="btn sm" data-act="sel" data-id="' + s.id + '">收起</button>' +
    (canAdv ? '<button class="btn sm primary" data-act="adv" data-id="' + s.id + '">推进阶段</button>' : '') + '</div></div>' +
    '<div class="cb"><div class="two">' +
      '<div><div class="sec-t">基础字段（T-02 / T-05）</div><div class="kv">' +
        '<div class="k">样品ID / 批次</div><div class="mono">' + esc(s.id) + ' / ' + esc(s.batch) + '</div>' +
        '<div class="k">样品层级</div><div>' + (s.level ? esc(s.level) : na('待补全')) + (s.coDev ? ' ' + badge('共同开发', 't') : '') + '</div>' +
        '<div class="k">阶段原文</div><div>' + esc(s.stageRaw) + (s.mapPending ? ' ' + badge('待人工指定', 'b') : '') + '</div>' +
        '<div class="k">标准阶段</div><div>' + esc(stageName(s.stage)) + '</div>' +
        '<div class="k">阶段进入日</div><div class="mono">' + esc(s.enter) + '</div>' +
        '<div class="k">停留天数</div><div>' + (d.value == null ? na(d.text + '（' + d.note + '）') : d.value + ' 天') + '</div>' +
        '<div class="k">返工次数</div><div>' + s.rework + (reworkFlag(s.rework) ? ' ' + badge('反复NG风险', 'r') : '') + '</div>' +
        '<div class="k">需求单号</div><div>' + (s.req ? esc(s.req) : na('待补全')) + '</div>' +
      '</div></div>' +
      '<div><div class="sec-t">三态判读（RULE-SMP-004）</div>' +
        '<div style="margin-bottom:8px">' + colorBadge(c) + '</div>' +
        '<div class="kv">' +
          '<div class="k">判据</div><div>' + (t ? '预警 ' + t.warn + ' 天 / 停滞 ' + t.stall + ' 天' : na('阈值未配置')) + '</div>' +
          '<div class="k">说明</div><div>' + esc(c.note) + '</div>' +
        '</div>' +
        '<div class="hr"></div>' +
        '<div class="sec-t">达标判定（RULE-TST-002）</div>' +
        '<div style="margin-bottom:6px">' + badge(tt.state, 'p') + ' <span class="muted" style="font-size:11.5px">F02：' + esc(tt.f02) + '</span></div>' +
        '<div class="muted" style="font-size:11.5px">' + esc(tt.reason) + '</div>' +
      '</div>' +
    '</div>' +
    (s.mapPending ? '<div class="warn-box" style="margin-top:12px"><b>阶段映射待确认：</b>原文「' + esc(s.stageRaw) + '」映射为「中试」尚未人工指定（RULE-SMP-001）。' +
      (allowed('board','advance') ? ' <button class="btn sm" data-act="mapfix" data-id="' + s.id + '">指定为「中试」并留痕</button>' : ' 当前角色无确认权限。') + '</div>' : '') +
    (!canAdv ? '<div class="note-box" style="margin-top:12px">当前角色 <b>' + state.role + '</b> 未获「推进阶段」授权（08 矩阵），操作入口不渲染。</div>' : '') +
    '<div class="hr"></div><div class="sec-t">当前状态可用的转移与守卫（04 状态机）</div>' +
    (feas || '<div class="muted" style="font-size:12px">终态，无离开事件。</div>') +
    '</div></div>';
}

function coaInputs(c){
  return '<div class="field"><span>产品名称 / 型号</span><input id="coa_product" value="' + esc(c && c.product ? c.product : '') + '" placeholder="如：银粉 A-2"/></div>' +
    '<div class="two" style="margin-top:10px">' +
    COA_FIELDS.map(f => '<div class="field"><span>' + esc(f.label) + '（' + esc(f.unit) + '）</span>' +
      '<input id="coa_' + f.k + '" type="number" step="0.01" value="' + (c && c[f.k] != null ? c[f.k] : '') + '" placeholder="留空 = 缺项"/></div>').join('') +
    '</div>';
}
function openCoaForm(lot){
  if(!allowed('coa', 'edit')){ toast('无 COA 登记权限'); return; }
  const c = coaOf(lot);
  openModal('登记 COA · ' + lot,
    '<div class="note-box" style="margin-bottom:10px">列与单位照 COA 表头固定 10 列，<b>不增删列</b>。留空即计为「COA 缺项」，系统不会用实测值或上一批数据回填（RULE-COA-001）。' +
    (c ? '<br>已有记录：' + esc(c.id) + '（' + esc(c.date || '') + '），保存将覆盖为现行版。' : '') + '</div>' + coaInputs(c),
    '<button class="btn" data-act="close">取消</button>' +
    '<button class="btn primary" data-act="coa-save" data-id="' + esc(lot) + '">保存</button>');
}
function saveCoa(lot){
  if(!allowed('coa', 'edit')){ toast('无 COA 登记权限'); return; }
  const val = k => { const el = document.getElementById('coa_' + k); const v = el ? el.value.trim() : ''; return v === '' ? null : Number(v); };
  const product = (document.getElementById('coa_product') || {}).value || '';
  const c = coaOf(lot);
  const patch = { product: product.trim(), date: nowStr().slice(0, 10), src: 'demo' };
  COA_FIELDS.forEach(f => { patch[f.k] = val(f.k); });
  if(c){ Object.assign(c, patch); }
  else {
    const n = String(state.coa.length + 1).padStart(3, '0');
    state.coa.push(Object.assign({ id:'COA-' + n, lot: lot, ver:'录入' }, patch));
  }
  const rec = coaOf(lot), miss = coaMissing(rec);
  audit('COA 登记', lot + ' ' + (c ? '更正' : '新增') + '；缺项 ' + miss.length + ' 列' + (miss.length ? '（' + miss.join('、') + '）' : ''));
  save(); closeModal(); refreshAll();
  toast(miss.length ? '已保存，存在 ' + miss.length + ' 列缺项' : '已保存：10 列齐全');
}

function saveInbound(rcvId){
  if(!allowed('inbound', 'edit')){ toast('无建账权限'); return; }
  const r = state.receipts.find(x => x.id === rcvId);
  const g = k => { const el = document.getElementById(k); return el ? el.value.trim() : ''; };
  const no = g('inb_no'), qty = Number(g('inb_qty')), date = g('inb_date');
  if(!no){ toast('入库单号不能为空：无单号只能记「在途」，不计入累计'); return; }
  if(state.inbound.some(i => i.no === no)){ toast('入库单号重复：请核对，不自动相加'); return; }
  if(!(qty > 0)){ toast('入库数量须大于 0'); return; }
  if(!date || (r && date < r.date)){ toast('入库日期不得早于到货日'); return; }
  const n = String(state.inbound.length + 1).padStart(3, '0');
  state.inbound.push({
    id:'INB-' + n, no: no, rcv: rcvId, lot: r.lot, qty: qty, date: date,
    wh: g('inb_wh'), loc: g('inb_loc'), coa: coaOf(r.lot) ? coaOf(r.lot).id : '',
    status:'已入库', batchAdd:true, by: state.role, at: nowStr(), src:'demo'
  });
  audit('入库建账', r.lot + ' 单号 ' + no + '，数量 ' + qty.toFixed(1) + ' kg' + (r.inbound ? '' : '（原为在途，本次为补录）'));
  save(); closeModal(); refreshAll(); toast('已建账：' + no);
}

/* ---------------- 守卫判定 ---------------- */
function guardOf(s, ev){
  const miss = [];
  const hasReview = state.reviews.some(r => r.sup === s.sup);
  const tasks = state.tests.filter(t => t.sample === s.id);
  const f02ok = tasks.length > 0 && tasks.every(t => t.f02);
  const ext = state.ext.find(e => e.sample === s.id);
  switch(ev){
    case 'E-TECH-DONE':
      if(!hasReview) miss.push('交流纪要未归档（I-07 无记录）');
      break;
    case 'E-BASIC-PASS':
      if(!tasks.length) miss.push('检测记录与 F02 均缺失');
      break;
    case 'E-LAB-PASS':
      if(!f02ok) miss.push('F02 结论不齐全');
      if(s.level !== '量产线') miss.push('层级不符：进入研发大样须为量产线产品（RULE-SMP-002）');
      break;
    case 'E-PILOT-PASS':
      if(!f02ok) miss.push('F02 结论不齐全');
      if(s.level !== '量产线') miss.push('层级不符：进入小试须为量产线产品');
      break;
    case 'E-SMALL-PASS':
      if(!f02ok) miss.push('F02 结论不齐全');
      miss.push('「试产记录」在 05 数据模型中无对应实体 → 守卫无法判定');
      break;
    case 'E-MID-PASS':
      if(!f02ok) miss.push('F02 结论不齐全');
      if(!ext || ext.conclusion !== '通过') miss.push('导入会议结论未通过或未登记');
      break;
    case 'E-TRANSFER-PASS':
      if(!ext || ext.conclusion !== '通过') miss.push('转产会议未通过');
      miss.push('「名录登记」在 05 数据模型中无对应实体 → 守卫无法判定');
      break;
    default:
      break;
  }
  return miss;
}

function doEvent(sid, ev){
  const s = sampleById(sid);
  if(!s) return;
  if(!allowed('board', 'advance')){
    audit('越权尝试', '角色 ' + state.role + ' 执行 ' + ev + ' @ ' + sid + '，结果：拒绝');
    openModal('已拒绝', '<div class="err-box">无「推进阶段」权限（08 矩阵）。</div>');
    return;
  }
  if(ev === 'JUMP'){
    const target = (document.getElementById('jumpTo') || {}).value;
    const from = stageIdx(s.stage), to = stageIdx(target);
    const skipped = STAGES.filter(x => x.idx > from && x.idx < to).map(x => x.name);
    audit('阶段推进', sid + ' 请求跳阶段 ' + stageName(s.stage) + '→' + stageName(target) + '，结果：拒绝');
    openModal('拒绝 · 不允许跳阶段',
      '<div class="err-box"><b>当前状态：</b>' + esc(stageName(s.stage)) + '<br><b>请求事件：</b>跳阶段至 ' + esc(stageName(target)) +
      '<br><b>缺失守卫：</b>未经历 ' + esc(skipped.join(' → ') || '（无）') + '；无守卫可满足（04 状态转移表末行）。</div>' +
      '<div class="note-box" style="margin-top:10px">确需跳阶须走 ADR 与评审会，系统不自动补齐前置阶段。</div>' +
      '<div style="margin-top:10px"><button class="btn" data-act="adv" data-id="' + sid + '">返回推进面板</button></div>');
    return;
  }
  if(ev === 'E-FAIL'){
    const by = (document.getElementById('failBy') || {}).value || '';
    const basis = (document.getElementById('failBasis') || {}).value || '';
    if(!by || !basis){
      audit('阶段推进', sid + ' E-FAIL 拒绝：缺人工确认记录');
      openModal('拒绝 · 缺人工确认',
        '<div class="err-box"><b>当前状态：</b>' + esc(stageName(s.stage)) + '<br><b>请求事件：</b>E-FAIL<br><b>缺失守卫：</b>需人工确认结论并留痕（确认人 + 依据，RULE-SEC-002）</div>' +
        '<div style="margin-top:10px"><button class="btn" data-act="adv" data-id="' + sid + '">返回补充</button></div>');
      return;
    }
    const from = s.stage;
    s.stage = 'STATE-NG';
    s.enter = BATCH.ref;
    state.confirms['NG:' + sid] = { by, at: nowStr(), basis };
    audit('阶段推进', sid + ' ' + from + ' → STATE-NG（E-FAIL），确认人 ' + by + '，依据 ' + basis);
    save(); refreshAll(); closeModal(); toast('已置为 NG，并留痕');
    return;
  }
  if(ev === 'E-REWORK'){
    const target = (document.getElementById('rwTarget') || {}).value || '';
    const reason = (document.getElementById('rwReason') || {}).value || '';
    if(!target || !reason){
      openModal('拒绝 · 回退信息不全',
        '<div class="err-box"><b>当前状态：</b>' + esc(stageName(s.stage)) + '<br><b>请求事件：</b>E-REWORK<br><b>缺失守卫：</b>需指定回退目标阶段 + 返工原因</div>' +
        '<div style="margin-top:10px"><button class="btn" data-act="adv" data-id="' + sid + '">返回补充</button></div>');
      return;
    }
    if(stageIdx(target) >= stageIdx(s.stage) || target === 'STATE-NG' || target === 'STATE-APPROVED'){
      openModal('拒绝 · 目标阶段非法',
        '<div class="err-box"><b>当前状态：</b>' + esc(stageName(s.stage)) + '<br><b>请求事件：</b>E-REWORK → ' + esc(stageName(target)) +
        '<br><b>缺失守卫：</b>目标须为已经历的更早阶段（04：可回退至上一阶段或本阶段重测）</div>' +
        '<div style="margin-top:10px"><button class="btn" data-act="adv" data-id="' + sid + '">返回重选</button></div>');
      return;
    }
    const from = s.stage;
    s.stage = target; s.enter = BATCH.ref; s.rework += 1;
    audit('阶段推进', sid + ' ' + from + ' → ' + target + '（E-REWORK），原因：' + reason + '，返工 +1 → ' + s.rework);
    save(); refreshAll(); closeModal(); toast('已回退，返工次数 +1');
    return;
  }
  if(ev === 'E-REOPEN'){
    const doc = (document.getElementById('reopenDoc') || {}).value || '';
    if(!doc){
      openModal('拒绝 · 缺重启决定', '<div class="err-box">需采购经理 + 研发书面重启决定文号。</div>');
      return;
    }
    s.stage = 'STATE-BASIC-TEST'; s.enter = BATCH.ref;
    audit('阶段推进', sid + ' NG → 基本检测（E-REOPEN），决定文号 ' + doc);
    save(); refreshAll(); closeModal(); toast('已重启至基本检测');
    return;
  }
  const e = EVENTS.find(x => x.ev === ev);
  if(!e){ return; }
  const miss = guardOf(s, ev);
  if(miss.length){
    audit('阶段推进', sid + ' ' + ev + ' 拒绝；缺失守卫：' + miss.join('；'));
    openModal('推进被拒绝 · ' + sid,
      '<div class="err-box"><b>当前状态：</b>' + esc(s.stage) + ' · ' + esc(stageName(s.stage)) +
      '<br><b>请求事件：</b>' + esc(ev) +
      '<br><b>缺失守卫：</b>' + esc(miss.join('；')) + '</div>' +
      '<div class="note-box" style="margin-top:10px">按 04「非法转移统一行为」：拒绝写入、返回三要素、审计留痕；不静默降级、不自动补齐前置阶段。</div>' +
      '<div style="margin-top:10px"><button class="btn" data-act="adv" data-id="' + sid + '">返回推进面板</button></div>');
    return;
  }
  const from = s.stage;
  s.stage = e.to; s.enter = BATCH.ref;
  audit('阶段推进', sid + ' ' + from + ' → ' + e.to + '（' + ev + '），守卫校验通过');
  save(); refreshAll(); closeModal(); toast('已推进至 ' + stageName(e.to));
}

const SUP_SUGGEST = {

  'SS-02':'按计划等待研发小样排期',

function viewRisk(){
  const p = pageById('risk');
  const lv = access(state.role, 'review', 'view');
  const techOnly = lv === 'tech';
  const conclOnly = lv === 'conclusion';
  const order = { '高':0, '中':1, '低':2, '':3 };
  const cards = state.suppliers.slice().sort((a, b) => {
    const ra = (state.reviews.filter(r => r.sup === a.id).slice(-1)[0] || {}).risk || '';
    const rb = (state.reviews.filter(r => r.sup === b.id).slice(-1)[0] || {}).risk || '';
    return (order[ra] == null ? 3 : order[ra]) - (order[rb] == null ? 3 : order[rb]);
  }).map(s => {
    const rev = state.reviews.filter(r => r.sup === s.id).slice(-1)[0];
    const risk = rev ? (rev.risk || '') : '';
    const nc = rev ? (rev.ncStatus || '未提及') : '未提及';
    const blocked = nc === '未闭环';
    return '<div class="card" style="margin:0"><div class="ch"><h3 style="font-size:13px">' + esc(s.name) + '</h3>' +
      '<div class="rt">' + (risk ? badge(risk + '风险', risk === '高' ? 'r' : risk === '中' ? 'a' : 'g') : badge('未评级', 'p', '风险等级字段为空，不推断（RULE-SUP-001）')) + '</div></div>' +
      '<div class="cb"><div class="kv" style="grid-template-columns:76px 1fr">' +
        '<div class="k">类型</div><div>' + esc(s.type) + '</div>' +
        '<div class="k">最近审核</div><div>' + (rev ? '<span class="mono">' + esc(rev.date) + '</span> · ' + esc(rev.topic) : na('无纪要')) + '</div>' +
        '<div class="k">不符合项</div><div>' + (rev ? (conclOnly ? badge(nc, nc === '未闭环' ? 'r' : nc === '已闭环' ? 'g' : 'p') : esc(rev.nc || '未提及') + ' ' + badge(nc, nc === '未闭环' ? 'r' : nc === '已闭环' ? 'g' : 'p')) : na('未提及')) + '</div>' +
        '<div class="k">可行性</div><div>' + (rev ? (blocked ? badge('不可写「合作可行」（未闭环）', 'r') : badge(rev.feasible || '待定', 't')) : badge('待定', 'p')) + '</div>' +
      '</div>' +
      (conclOnly ? '<div class="muted" style="font-size:11.5px;margin-top:8px">当前角色仅可见结论，不符合项技术描述不渲染（08 矩阵）。</div>' : '') +
      (techOnly ? '<div class="muted" style="font-size:11.5px;margin-top:8px">当前角色仅可见技术部分，风险等级与可行性由质量 / 采购口径给出，不在此展开。</div>' : '') +
      '</div></div>';
  }).join('');

  return pageHead(p, '<button class="btn" data-act="exp" data-kind="O06">导出 O-06（CSV）</button>') +
    (state.suppliers.length ? '<div class="three">' + cards + '</div>'
      : '<div class="card"><div class="cb">' + emptyState('无纪要', 'I-07 交流/审核纪要尚未导入，无法给出任何风险等级。', '') + '</div></div>') +
    '<div class="card"><div class="ch"><h3>等级与可行性一览</h3><span class="sub">等级只转述纪要原文，不二次评级</span></div>' +
    '<div class="cb tight"><div class="tw"><table><thead><tr><th>供应商</th><th>风险等级</th><th>不符合项</th><th>闭环状态</th><th>最近审核日</th><th>可行性</th></tr></thead><tbody>' +
    state.suppliers.map(s => {
      const rev = state.reviews.filter(r => r.sup === s.id).slice(-1)[0];
      const risk = rev ? rev.risk : '';
      return '<tr><td>' + esc(s.name) + '</td>' +
        '<td>' + (risk ? badge(risk, risk === '高' ? 'r' : risk === '中' ? 'a' : 'g') : badge('未评级', 'p')) + '</td>' +
        '<td>' + (rev ? esc(rev.nc || '未提及') : na('无纪要')) + '</td>' +
        '<td>' + (rev ? badge(rev.ncStatus, rev.ncStatus === '未闭环' ? 'r' : rev.ncStatus === '已闭环' ? 'g' : 'p') : na('—')) + '</td>' +
        '<td class="mono">' + (rev ? esc(rev.date) : '—') + '</td>' +
        '<td>' + (rev ? (rev.ncStatus === '未闭环' ? badge('不可写可行', 'r') : esc(rev.feasible || '待定')) : na('待定')) + '</td></tr>';
    }).join('') +
    '</tbody></table></div></div></div>' +
    '<div class="note-box">供应商C 仅有技术交流纪要、无工厂审核与风险等级字段 → 显示「未评级」而非「低」（AC-020 第三类：无审核纪要）。这是样例数据构造，已在说明中标注。</div>';
}

/* ---------------- V-07 催办清单 ---------------- */
function viewUrge(){
  const p = pageById('urge');
  if(!hasAnyThreshold()){
    return pageHead(p, '') +
      '<div class="card"><div class="cb">' +
      emptyState('不出清单：阈值未配置',
        '按 AC-006，阈值未配置时不得生成催办级别，也不得套用默认天数。请先在 V-10 配置各阶段预警 / 停滞阈值。',
        '<a class="btn primary" href="#/config">去配置阈值</a>') +
      '</div></div>';
  }
  const rows = state.samples.filter(s => ['r','a'].includes(colorOf(s).key));
  return pageHead(p, '<button class="btn" data-act="urge-copy">复制清单</button><button class="btn" data-act="exp" data-kind="O05">导出 O-05</button>') +
    '<div class="card"><div class="ch"><h3>本期催办</h3><span class="sub">红 ' + rows.filter(s => colorOf(s).key === 'r').length +
      ' · 黄 ' + rows.filter(s => colorOf(s).key === 'a').length + ' · 每条须有责任人与动作</span></div>' +
    '<div class="cb tight"><div class="tw"><table><thead><tr><th>预警级别</th><th>样品</th><th>卡点</th><th>催办对象</th><th>建议动作</th><th>时限</th><th>状态</th></tr></thead><tbody>' +
    (rows.length ? rows.map(s => {
      const c = colorOf(s), d = dwell(s), t = threshold(s.stage);
      return '<tr><td>' + colorBadge(c) + '</td>' +
        '<td><b class="mono">' + esc(s.id) + '</b><div class="muted" style="font-size:11px">' + esc(supName(s.sup)) + ' · ' + esc(stageName(s.stage)) + '</div></td>' +
        '<td>停留 ' + d.value + ' 天 ≥ ' + (c.key === 'r' ? '停滞' : '预警') + '阈值 ' + (c.key === 'r' ? t.stall : t.warn) + ' 天</td>' +
        '<td>' + (s.owner || na('未指派')) + '</td>' +
        '<td>' + esc(SUP_SUGGEST[s.id] || '') + ' ' + badge('样例参考', 'p', 'PRD 第 7 节样例文案，非 04 规则生成') + '</td>' +
        '<td>' + na('待确认') + '</td>' +
        '<td>' + (s.urged ? badge('已催办', 't') : '<button class="btn sm" data-act="urge-mark" data-id="' + s.id + '">标记已催办</button>') + '</td></tr>';
    }).join('') : '<tr><td colspan="7">' + emptyState('本期无需催办', '当前无红 / 黄记录。阈值变更或新数据导入后重新判定。', '') + '</td></tr>') +
    '</tbody></table></div></div></div>' +
    '<div class="note-box"><b>未落地的两列：</b>「建议动作」在 04 中没有生成规则，此处仅为 PRD 样例文案，已标「样例参考」；「时限」同样无规则定义，标「待确认」，未用默认值补齐。' +
    '系统不发送任何函件，只记录「已人工沟通」与时间（08 授权门）。</div>';
}
/* ---------------- V-08 周报生成与预览 ---------------- */
function reportChapters(){
  const g = gapStats();
  const doneT = state.tests.filter(testDone).length;
  const doingT = state.tests.length - doneT;
  const led = state.ledger.reduce((a, r) => ({ i:a.i + r.inbound, p:a.p + r.replaced, b:a.b + r.balance }), { i:0, p:0, b:0 });
  const diff = Math.round((led.i - (led.p + led.b)) * 10) / 10;
  const ch = [];

  ch.push({ t:'概述', b:
    '本期批次 ' + BATCH.no + '（参考日 ' + BATCH.ref + '），在册样品 ' + state.samples.length + ' 个，覆盖 ' + state.suppliers.length + ' 家供应商。' +
    '状态分布：红 ' + g.red + ' / 黄 ' + g.amber + ' / 待配置或待核 ' + g.gray + '。' +
    (hasAnyThreshold() ? '' : '阶段阈值尚未配置，本期不出红黄结论。') });

  ch.push({ t:'本周测试进度', b:
    '测试任务 ' + state.tests.length + ' 项，其中完成（F02 + 结论齐全）' + doneT + ' 项、进行中 ' + doingT + ' 项。' +
    '达标候选：全部「待数据」——缺《原料检验项目对照表》JH01-01-023/025（Q-004），不生成候选名单。' });

  ch.push({ t:'切换进度', b: state.plans.map(pr => {
    const c = completion(pr), d = deviation(pr);
    return pr.name + '：完成率 ' + (c.value == null ? '数据不完整' : c.text) + '，偏差 ' + d.text;
  }).join('；') || '本周无' });

  ch.push({ t:'外测导入跟进', b: state.ext.map(e => {
    const s = sampleById(e.sample);
    return (s ? s.id : e.sample) + '：' + e.meeting + ' 结论「' + e.conclusion + '」' + (state.confirms[e.id] ? '（已确认）' : '（待确认）');
  }).join('；') || '本周无' });

  ch.push({ t:'供应商交流与工厂审核', b: state.reviews.map(r =>
    supName(r.sup) + ' ' + r.date + ' ' + r.topic + '：' + (r.conclusion || '结论摘要待补全') +
    '；不符合项 ' + (r.nc ? r.nc + '（' + r.ncStatus + '）' : '未提及') +
    '；风险 ' + (r.risk || '未评级') + '；可行性 ' + (r.feasible || '待定')
  ).join('；') || '本周无' });

  ch.push({ t:'风险评估与可行性', b:
    '供应商A 存在未闭环不符合项，按 RULE-SUP-001 不得写「合作可行」，' +
    (state.confirms['REV-001'] ? '已人工确认并留痕。' : '当前为「待确认」状态。') +
    '供应商C 无审核纪要，风险显示「未评级」，未推断为低。' });

  ch.push({ t:'置换入库与置换统计', b:
    '本期入库 ' + led.i.toFixed(1) + ' kg、置换 ' + led.p.toFixed(1) + ' kg、结存 ' + led.b.toFixed(1) + ' kg；' +
    '校验 ' + (diff === 0 ? '平衡（差异 0.0 kg）' : '异常（差异 ' + diff.toFixed(1) + ' kg，未自动改数）') + '。' +
    '期间与对账日口径为候选（Q-008）。' });

  ch.push({ t:'待办', b: (() => {
    const items = [];
    if(!hasAnyThreshold()) items.push('配置阶段阈值（Q-001）——未配置则整表不判色');
    if(g.missing.length) items.push('补全 ' + g.missing.length + ' 处字段：' + g.missing.slice(0, 4).map(m => m.who + '/' + m.f).join('、') + (g.missing.length > 4 ? ' 等' : ''));
    if(g.pending) items.push('人工确认 ' + g.pending + ' 条结论（' + pendingConfirms().map(x => x.type).join('、') + '）');
    return items.length ? items.map((x, i) => (i + 1) + '. ' + x).join('<br>') : '本期无待办。';
  })() });

  ch.push({ t:'下周计划', b:'待补全：缺下周计划输入（04/07 未定义下周计划的生成规则，需人工填写）。' });
  return ch;
}

function viewReport(){
  const p = pageById('report');
  const chs = reportChapters();
  const g = gapStats();
  const canFinal = allowed('report', 'finalize');
  const canExp = state.role === 'R01';
  const blockFinal = [];
  if(g.pending > 0) blockFinal.push(g.pending + ' 条结论待确认（AC-027）');
  if(!hasAnyThreshold()) blockFinal.push('阈值未配置，红黄结论不可判（Q-001）');
  if(!state.reportDraft) blockFinal.push('尚未生成初稿');

  return pageHead(p,
      '<button class="btn" data-act="rep-gen">生成初稿</button>' +
      (canExp ? '<button class="btn" data-act="exp" data-kind="O03"' + (state.reportDraft ? '' : ' disabled') + '>导出 .doc</button>' : '') +
      (canFinal
        ? '<button class="btn primary" data-act="rep-final"' + (blockFinal.length ? ' disabled' : '') + '>定稿</button>'
        : '')) +
    (!canFinal ? '<div class="note-box" style="margin-bottom:12px">当前角色 <b>' + state.role + '</b> 无「周报定稿 / 导出」授权（08 矩阵：仅 R01；R04 须会签后，会签流程未建模）。</div>' : '') +
    (!state.reportDraft
      ? '<div class="card"><div class="cb">' + emptyState('未生成', '九章结构已就绪，点「生成初稿」依据当前数据生成；缺数据的章节保留标题并写「待补全」。', '<button class="btn primary" data-act="rep-gen">生成初稿</button>') + '</div></div>'
      : '') +
    '<div class="two" style="align-items:start">' +
      '<div class="card"><div class="ch"><h3>九章目录</h3><span class="sub">RULE-REP-001：顺序固定，缺章保留标题</span></div><div class="cb">' +
        chs.map((c, i) => '<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line2);font-size:12.5px">' +
          '<span class="muted mono">' + String(i + 1).padStart(2, '0') + '</span><span>' + esc(c.t) + '</span>' +
          '<span style="margin-left:auto">' + (!state.reportDraft ? badge('未生成', 'p') : (c.b.indexOf('待补全') === 0 ? badge('待补全', 'a') : badge('已生成', 'g'))) + '</span></div>').join('') +
      '</div></div>' +
      '<div class="card"><div class="ch"><h3>定稿条件</h3><span class="sub">V-08 完成判据</span></div><div class="cb">' +
        '<div class="kv" style="margin-bottom:10px">' +
          '<div class="k">九章齐全</div><div>' + badge(chs.length === 9 ? '9/9' : chs.length + '/9', chs.length === 9 ? 'g' : 'r') + '</div>' +
          '<div class="k">待确认结论</div><div>' + (g.pending ? badge(g.pending + ' 条', 'a') : badge('0 条', 'g')) + '</div>' +
          '<div class="k">脱敏检索</div><div>' + (redlineScan().length ? badge('命中', 'r') : badge('通过', 'g')) + '</div>' +
          '<div class="k">阈值</div><div>' + (hasAnyThreshold() ? badge('已配置', 'g') : badge('未配置', 'p')) + '</div>' +
        '</div>' +
        (blockFinal.length ? '<div class="warn-box"><b>不可定稿：</b><br>' + blockFinal.map((x, i) => (i + 1) + '. ' + esc(x)).join('<br>') + '</div>'
          : '<div class="ok-box"><b>可定稿。</b>定稿动作将写入审计（确认人 / 时间 / 依据）。</div>') +
        (g.pending ? '<div class="hr"></div><div class="sec-t">待确认清单</div>' + pendingConfirms().map(x =>
          '<div style="display:flex;gap:8px;align-items:center;padding:5px 0;font-size:12px">' + badge(x.type, 'b') +
          '<span>' + esc(x.obj) + ' · ' + esc(x.text) + '</span>' +
          '<span style="margin-left:auto">' + (allowed('report','finalize') ? '<button class="btn sm" data-act="confirm-concl" data-id="' + x.key + '">确认</button>' : na('待确认')) + '</span></div>').join('') : '') +
      '</div></div>' +
    '</div>' +
    (state.reportDraft ? '<div class="card"><div class="ch"><h3>周报正文（初稿）</h3><span class="sub">' + BATCH.no + ' · 模拟数据·不得外发</span></div><div class="cb">' +
      chs.map((c, i) =>
        '<div style="padding:8px 0;border-bottom:1px solid var(--line2)">' +
        '<div style="display:flex;gap:8px;align-items:baseline"><b style="font-size:12.5px">' + (i + 1) + '. ' + esc(c.t) + '</b>' +
        (c.b.indexOf('待补全') === 0 ? badge('待补全', 'a') : '') + '</div>' +
        '<div style="font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.7">' + c.b + '</div></div>').join('') +
    '</div></div>' : '') +
    '<div class="note-box">导出为 Word 可打开的 <b>.doc（HTML 容器）</b>，不是 OOXML .docx；格式差异已列入未落地清单。页脚固定含水印与批次号（RULE-SEC-004）。</div>';
}

/* ---------------- V-10 配置 ---------------- */
function viewConfig(){
  const p = pageById('config');
  const canEdit = access(state.role, 'config', 'edit') !== 'no';
  const th = state.config.thresholds;
  return pageHead(p, canEdit ? '<button class="btn" data-act="cfg-demo">填入演示值</button><button class="btn primary" data-act="cfg-save">保存（二次确认）</button>' : '') +
    (!canEdit ? '<div class="note-box" style="margin-bottom:12px">当前角色 <b>' + state.role + '</b> 对配置仅只读（08 矩阵）。阈值 / 别名 / 红线属业务口径，仅 R01 可改。</div>' : '') +
    '<div class="card"><div class="ch"><h3>阶段阈值</h3><span class="sub">RULE-SMP-004：逐阶段配置；未配置 → 不判色</span>' +
      '<div class="rt">' + (hasAnyThreshold() ? badge('已配置 ' + Object.keys(th).length + ' 个阶段', 'g') : badge('未配置', 'p')) + '</div></div>' +
      '<div class="cb"><div class="grid2">' + STAGES.filter(s => s.id !== 'STATE-NG' && s.id !== 'STATE-APPROVED').map(s => {
        const t = th[s.id] || {};
        return '<div style="border:1px solid var(--line);border-radius:8px;padding:9px 11px">' +
          '<div style="font-size:12.5px;font-weight:600;margin-bottom:6px">' + esc(s.name) + '</div>' +
          '<div class="grid2">' +
            '<label class="field">预警 W（天）<input type="number" min="1" step="1" id="w_' + s.id + '" value="' + (t.warn == null ? '' : t.warn) + '" placeholder="未配置"' + (canEdit ? '' : ' disabled') + '></label>' +
            '<label class="field">停滞 S（天）<input type="number" min="2" step="1" id="s_' + s.id + '" value="' + (t.stall == null ? '' : t.stall) + '" placeholder="未配置"' + (canEdit ? '' : ' disabled') + '></label>' +
          '</div></div>';
      }).join('') + '</div>' +
      '<div class="note-box" style="margin-top:10px">系统不内置任何默认天数（Q-001 未答）。「填入演示值」只是把 15 / 25 写进输入框供你复核，仍需点保存并二次确认后生效；该值据 PRD 第 7 节样例反推（22/16 天为黄、31 天为红、9/3 天为绿），<b>不是业务确认值</b>。</div></div></div>' +
    '<div class="two">' +
      '<div class="card"><div class="ch"><h3>阶段别名</h3><span class="sub">RULE-SMP-001：非标名称须映射或人工指定</span></div><div class="cb">' +
        (Object.keys(state.config.alias).length ? Object.keys(state.config.alias).map(k => {
          const v = state.config.alias[k];
          return '<div style="display:flex;gap:8px;align-items:center;padding:5px 0;font-size:12.5px">' +
            '<span class="mono">' + esc(k) + '</span><span>→</span><span>' + esc(stageName(v.to)) + '</span>' +
            '<span style="margin-left:auto">' + (v.confirmed ? badge('已确认', 'g') : badge('待确认', 'b')) + '</span></div>';
        }).join('') : '<div class="muted" style="font-size:12px">无别名配置</div>') +
      '</div></div>' +
      '<div class="card"><div class="ch"><h3>红线与口径</h3><span class="sub">RULE-SEC-001 / Q-010</span></div><div class="cb">' +
        '<div class="sec-t">红线字段（禁止入库，只读）</div>' +
        '<div class="chips" style="margin-bottom:10px">' + state.config.redline.map(x => '<span class="b r">' + esc(x) + '</span>').join('') + '</div>' +
        '<div class="sec-t">日历口径</div>' +
        '<div class="muted" style="font-size:12.5px">' + esc(state.config.calendar) + '（候选口径，Q-010 未确认；工作日口径未实现）</div>' +
        '<div class="hr"></div><div class="sec-t">变更历史</div>' +
        (state.audits.filter(a => a.evt === '配置变更').length
          ? state.audits.filter(a => a.evt === '配置变更').slice(0, 5).map(a => '<div class="muted" style="font-size:11.5px">' + esc(a.at) + ' · ' + esc(a.detail) + '</div>').join('')
          : '<div class="muted" style="font-size:11.5px">无变更记录</div>') +
      '</div></div>' +
    '</div>';
}
/* 启动 */
state = load();
if(!location.hash) location.hash = '#/' + state.page;
else state.page = location.hash.replace(/^#\//, '') || 'import';
refreshAll();
</script>
</body>
</html>
