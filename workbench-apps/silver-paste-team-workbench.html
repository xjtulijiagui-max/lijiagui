<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光伏银浆销售团队工作台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="gh-snapshot-banner" style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#FFF7E6;border-bottom:1px solid #E8C87A;color:#8A5A00;padding:8px 16px;font:13px/1.5 'PingFang SC','Microsoft YaHei',sans-serif;text-align:center;">
📜 这是原内网工作台的<strong>静态快照</strong>（仅供存档预览）。完整交互版本需在 WorkBuddy 内网环境打开原链接。
<button onclick="this.parentNode.remove();document.body.style.paddingTop='0'" style="margin-left:10px;background:#8A5A00;color:#fff;border:0;border-radius:4px;padding:2px 10px;cursor:pointer;font-size:12px;">知道了</button>
</div>


<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">PV</div>
      <div class="brand-text">
        <div class="brand-title">银浆销售团队</div>
        <div class="brand-sub">多人协同工作台</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="sf-label">当前身份</div>
      <div class="sf-value" id="roleChip"></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">概览看板</h1>
        <div class="topbar-sub" id="pageSub">—</div>
      </div>
      <div class="topbar-right">
        <div class="id-pick">
          <label>身份</label>
          <select id="userSel" data-act="switch-user"></select>
        </div>
        <div class="today-chip" id="todayChip"></div>
        <button class="btn btn-primary" id="btnQuickAdd">+ 快速记录</button>
      </div>
    </header>

    <div class="content" id="content"></div>
  </main>

</div>

<div class="mask" id="mask">
  <div class="modal" id="modal">
    <div class="modal-head">
      <h2 id="modalTitle">标题</h2>
      <button class="icon-btn" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="core.js"></script>
<script src="forms.js"></script>
<script src="views.js"></script>
<script src="app.js"></script>
<script>
// 快照模式：拦截失效的相对资源请求，避免报错
(function(){
  try { document.body.style.paddingTop = '44px'; } catch(e) {}
  var origFetch = window.fetch;
  window.fetch = function(u){
    if (typeof u === 'string' && (u.startsWith('/') || (!u.startsWith('http') && !u.startsWith('data:') && !u.startsWith('#')))) {
      return Promise.resolve(new Response(JSON.stringify({items:[],error:'snapshot-mode'}), {status:200, headers:{'Content-Type':'application/json'}}));
    }
    return origFetch.apply(this, arguments);
  };
  // 阻止相对资源加载报错
  document.addEventListener('error', function(e){
    var t = e.target;
    if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) e.preventDefault();
  }, true);
})();
</script>
</body>
</html>
