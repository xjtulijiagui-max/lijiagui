<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爆款短视频实战流程图</title>
    <style>
        :root {
            --primary-blue: #5b9bd5;
            --header-blue: #337ab7;
            --accent-red: #d9534f;
            --bg-gray: #f5f5f5;
            --arrow-color: #333;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 顶部标题栏 */
        .header {
            width: 100%;
            background-color: var(--header-blue);
            color: white;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            font-style: italic;
            margin-bottom: 50px;
        }

        /* 流程容器 */
        .container {
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 60px;
            position: relative;
        }

        /* 流程行 */
        .row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            position: relative;
        }

        /* 步骤卡片 */
        .card {
            width: 220px;
            height: 140px;
            background-color: var(--primary-blue);
            border-radius: 8px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card.red {
            background-color: var(--accent-red);
        }

        /* 步骤数字 */
        .step-num {
            background-color: #ffcc00;
            color: #333;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .desc {
            font-size: 12px;
            line-height: 1.4;
            opacity: 0.9;
        }

        /* 连接箭头 (简单模拟) */
        .arrow {
            position: relative;
            width: 40px;
            height: 2px;
            background-color: var(--arrow-color);
        }

        .arrow::after {
            content: '';
            position: absolute;
            right: -2px;
            top: -4px;
            border-width: 5px 0 5px 8px;
            border-style: solid;
            border-color: transparent transparent transparent var(--arrow-color);
        }

        /* 折行箭头（第4步到第5步） */
        .connector-line {
            position: absolute;
            right: 110px;
            top: 140px;
            width: 2px;
            height: 60px;
            background-color: var(--arrow-color);
        }

        /* 提示栏 */
        .tip-bar {
            margin-top: 50px;
            background-color: #eeeeee;
            padding: 10px 40px;
            border-radius: 5px;
            font-size: 14px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tip-icon { color: #ffcc00; font-size: 18px; }

    </style>
</head>
<body>

    <div class="header">
        案例：爆款短视频实战短视频流程
    </div>

    <div class="container">
        <div class="row">
            <div class="card">
                <div class="step-num">1</div>
                <div class="title">搜索添加元宝</div>
                <div class="desc">在微信/APP中搜索<br>并添加元宝个人号</div>
            </div>
            <div class="arrow"></div>
            <div class="card">
                <div class="step-num">2</div>
                <div class="title">发送视频号</div>
                <div class="desc">将目标视频号链接<br>或内容发送给元宝</div>
            </div>
            <div class="arrow"></div>
            <div class="card">
                <div class="step-num">3</div>
                <div class="title">提取视频原文</div>
                <div class="desc">让元宝分析并提取<br>视频的完整文案</div>
            </div>
            <div class="arrow"></div>
            <div class="card">
                <div class="step-num">4</div>
                <div class="title">提取文案公式</div>
                <div class="desc">分析文案结构、套路<br>和写作模板</div>
            </div>
        </div>

        <div class="row" style="padding-left: 100px;">
            <div class="card">
                <div class="step-num">5</div>
                <div class="title">提供创作素材</div>
                <div class="desc">告诉元宝你的主题<br>和核心内容要点</div>
            </div>
            <div class="arrow"></div>
            <div class="card">
                <div class="step-num">6</div>
                <div class="title">生成新文案</div>
                <div class="desc">元宝按公式重新创作<br>适合你的内容</div>
            </div>
            <div class="arrow"></div>
            <div class="card red">
                <div class="step-num">7</div>
                <div class="title">导入剪映制作</div>
                <div class="desc">将文案放入剪映的<br>"文生视频"功能</div>
            </div>
        </div>
    </div>

    <div class="tip-bar">
        <span class="tip-icon">💡</span>
        <span><strong>提示：</strong>适合短视频创作者快速批量生产优质内容，提高创作效率</span>
    </div>

</body>
</html>
