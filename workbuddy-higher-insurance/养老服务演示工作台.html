<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>养老服务跟进 · 演示工作台｜WorkBuddy Insurance</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f5f8fd;color:#15223a;font:16px/1.75 "Microsoft YaHei",sans-serif}a{color:#1556b8}header{background:#061b46;color:white;padding:48px max(24px,calc((100vw - 1120px)/2))}header a{color:#d4e2ff}h1{font-size:clamp(30px,4vw,48px);line-height:1.25;max-width:980px;margin:20px 0}h2{font-size:26px;color:#12345b}h3{font-size:20px}main,nav{max-width:1168px;margin:auto;padding:24px}nav{display:flex;flex-wrap:wrap;gap:12px}section,.card{background:white;border:1px solid #d8e4f7;border-radius:14px;padding:28px;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{margin:0}.tag{display:inline-block;color:#d4e2ff;border:1px solid #6482b0;border-radius:8px;padding:5px 12px;margin:4px}.button,button{display:inline-block;border:0;border-radius:8px;background:#1556b8;color:white;padding:12px 18px;font:inherit;cursor:pointer;text-decoration:none;margin:6px 8px 6px 0}button:hover,.button:hover{background:#12345b}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf3fc;border-left:4px solid #1556b8;padding:20px;font:15px/1.8 "Microsoft YaHei",sans-serif}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{padding:10px 14px;border-bottom:1px solid #d8e4f7;text-align:left}th{background:#eef5ff}.scroll{overflow-x:auto}.note{background:#eaf2ff;border-left:4px solid #1556b8;padding:14px 20px}.metric{font-size:32px;font-weight:bold;color:#1556b8}footer{max-width:1120px;margin:20px auto 50px;padding:20px;color:#5f6f89}input,select{font:inherit;padding:10px;border:1px solid #94abc9;border-radius:6px;max-width:100%}:focus-visible{outline:3px solid #da9c2e;outline-offset:3px}@media(max-width:640px){.grid{grid-template-columns:1fr}main,nav{padding:16px}section,.card{padding:20px}header{padding:28px 20px}h2{font-size:23px}.button{display:block;text-align:center}}</style></head><body><header><a href="index.html">WorkBuddy Higher · Insurance</a><h1>养老服务跟进 · 演示工作台</h1><p>泰康集团 WorkBuddy 进阶实战 · 两小时演示精讲</p><span class="tag">保险</span><span class="tag">养老 / 医养</span><span class="tag">教学模拟数据</span></header><nav aria-label="课程导航"><a href="exercise-1.html">1 · 理赔材料解析</a><a href="exercise-2.html">2 · 客户与保单关联</a><a href="exercise-3.html">3 · 理赔运营分析</a><a href="exercise-4.html">4 · 养老服务工作台</a></nav><main><section><h2>服务待办</h2><p class="note">仅限模拟数据 · 修改保存在当前浏览器。切换设备不会同步；清除浏览器数据会丢失改动，请及时导出备份。</p><label>筛选状态 <select id="filter"><option value="">全部</option><option>待联系</option><option>已预约</option><option>已完成</option></select></label> <label>查找线索 <input id="search" placeholder="线索编号 / 家庭代号 / 负责人"></label><p id="stats" aria-live="polite"></p><div class="scroll"><table><thead><tr><th>编号</th><th>家庭代号</th><th>服务</th><th>状态（可修改）</th><th>负责人</th><th>下次联系</th></tr></thead><tbody id="rows"></tbody></table></div><button id="export">导出当前全部数据 CSV</button><button id="reset">恢复10条初始样本</button><p id="msg" aria-live="polite"></p><label>导入本页格式的CSV <input type="file" id="import" accept=".csv"></label></section></main><footer>讲师：李家贵 · 本资料用于课堂演示及课后复现。所有样本均为教学虚构，不代表泰康真实业务、产品条款或服务承诺。<br><a href="../list/">课程资源导航</a></footer><script>async function copyPrompt(id,b){const text=document.getElementById(id).textContent;try{await navigator.clipboard.writeText(text);b.textContent='已复制完整提示词'}catch(e){const s=window.getSelection(),r=document.createRange();r.selectNodeContents(document.getElementById(id));s.removeAllRanges();s.addRange(r);b.textContent='复制受限，请复制已选中文字'}}
const initial=[["L001", "模拟家庭01", "社区参访", "已预约", "顾问乙", "2026-10-17"], ["L002", "模拟家庭02", "健康咨询", "已完成", "顾问甲", "2026-10-18"], ["L003", "模拟家庭03", "居家服务", "待联系", "顾问乙", "2026-10-19"], ["L004", "模拟家庭04", "社区参访", "已预约", "顾问甲", "2026-10-20"], ["L005", "模拟家庭05", "健康咨询", "已完成", "顾问乙", "2026-10-21"], ["L006", "模拟家庭06", "居家服务", "待联系", "顾问甲", "2026-10-22"], ["L007", "模拟家庭07", "社区参访", "已预约", "顾问乙", "2026-10-23"], ["L008", "模拟家庭08", "健康咨询", "已完成", "顾问甲", "2026-10-24"], ["L009", "模拟家庭09", "居家服务", "待联系", "顾问乙", "2026-10-25"], ["L010", "模拟家庭10", "社区参访", "已预约", "顾问甲", "2026-10-26"]];const key='wb-insurance-demo-v1';let records=initial.map(r=>[...r]);try{const saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved)&&saved.every(r=>Array.isArray(r)&&r.length===6))records=saved}catch(e){}
const statuses=['待联系','已预约','已完成'];const $=id=>document.getElementById(id);function render(){const q=$('search').value.toLowerCase(),f=$('filter').value;const rows=records.filter(r=>(!f||r[3]===f)&&r.join(' ').toLowerCase().includes(q));$('rows').replaceChildren();for(const r of rows){const tr=document.createElement('tr');r.forEach((v,j)=>{const td=document.createElement('td');if(j===3){const s=document.createElement('select');s.setAttribute('aria-label',r[0]+'状态');statuses.forEach(t=>{const o=document.createElement('option');o.textContent=t;s.appendChild(o)});s.value=v;s.onchange=()=>{r[3]=s.value;save();render()};td.appendChild(s)}else td.textContent=v;tr.appendChild(td)});$('rows').appendChild(tr)}$('stats').textContent=`共 ${records.length} 条 · 显示 ${rows.length} 条 · 待联系 ${records.filter(r=>r[3]==='待联系').length} · 已预约 ${records.filter(r=>r[3]==='已预约').length} · 已完成 ${records.filter(r=>r[3]==='已完成').length}`}
function save(){try{localStorage.setItem(key,JSON.stringify(records));$('msg').textContent='已保存到当前浏览器；未上传服务器。'}catch(e){$('msg').textContent='浏览器保存失败，请立即导出备份。'}}
$('filter').onchange=render;$('search').oninput=render;$('reset').onclick=()=>{if(confirm('恢复初始样本会替换本浏览器的演示改动，确定继续？')){records=initial.map(r=>[...r]);save();render()}};
const heads=['lead_id','family_alias','service_type','status','owner','next_contact'];function csvcell(v){return '"'+String(v).replaceAll('"','""')+'"'}
$('export').onclick=()=>{const text='\ufeff'+[heads,...records].map(r=>r.map(csvcell).join(',')).join('\r\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='养老服务跟进.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function parseCSV(text){let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x))rows.push(row);row=[];cell=''}else cell+=c}if(q)throw Error('CSV引号未闭合');row.push(cell);if(row.some(x=>x))rows.push(row);return rows}
$('import').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>1000000)throw Error('课堂演示仅支持1MB以内的CSV');const all=parseCSV((await file.text()).replace(/^\ufeff/,''));if(JSON.stringify(all.shift())!==JSON.stringify(heads))throw Error('表头不匹配，请使用下载的数据格式');if(!all.length||all.some(r=>r.length!==6||!statuses.includes(r[3])))throw Error('记录或状态格式不正确');if(new Set(all.map(r=>r[0])).size!==all.length)throw Error('线索编号重复');records=all;save();render()}catch(err){$('msg').textContent='导入失败：'+err.message}e.target.value=''};render();
</script></body></html>
