    .empty { display:none; padding:28px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:8px; background:var(--panel); }

art, rotating pages, adding watermarks, creating new PDFs, filling PDF forms, encrypting/decrypting PDFs, extracting images, and OCR on scanned PDFs to make them searchable. If the user mentions a .pdf file or asks to produce one, use this skill.","note":""},{"name":"pptx","folder":"~/.skillhub/skills/pptx","category":"课程、授课与知识资产","description":"Use this skill any time a .pptx file is involved in any way — as input, output, or both. This includes: creating slide decks, pitch decks, or presentations; reading, parsing, or extracting text from any .pptx file (even if the extracted content will be used elsewhere, like in an email or summary); editing, modifying, or updating existing presentations; combining or splitting slide files; working with templates, layouts, speaker notes, or comments. Trigger whenever the user mentions \\\"deck,\\\" \\\"slides,\\\" \\\"presentation,\\\" or references a .pptx filename, regardless of what they plan to do with the content afterward. If a .pptx file needs to be opened, created, or touched, use this skill.","note":""},{"name":"pptx-generator","folder":"~/.skillhub/skills/skill_2053082606165762048","category":"课程、授课与知识资产","description":"专业 PPT 生成器。11 种幻灯片类型、5 套配色、图表/表格/时间线/图片支持。JSON 驱动，生成标准可编辑","note":""},{"name":"proactive-training-ai","folder":"~/.skillhub/skills/proactive-training-ai","category":"课程、授课与知识资产","description":"","note":""},{"name":"qq-email","folder":"~/.skillhub/skills/qq-email","category":"课程、授课与知识资产","description":"QQ邮箱 IMAP receive and SMTP send via Node.js scripts; credentials","note":""},{"name":"recording-to-training-video","folder":"~/.skillhub/skills/recording-to-training-video","category":"课程、授课与知识资产","description":"将课程录音或授课视频重建为原声培训视频、知识点短视频系列，或批量刷新已有成片的字幕与片头。以录音语义决定分段和画面，有合适PPT则复用，不匹配或没有PPT则按录音补页或重建可编辑课件；包含字幕纠错、语音对齐和成片验收。用户说“录音剪成课”“重建培训视频”“刷新全部短视频”时使用，不用于单纯撰写营销分镜或自动发布。","note":""},{"name":"slack-gif-creator","folder":"~/.skillhub/skills/slack-gif-creator","category":"课程、授课与知识资产","description":"Knowledge and 架构图,这类需求走原生 OpenAPI。","note":""},{"name":"lark-doc","folder":"~/.skillhub/skills/lark-doc","category":"连接、协作与发布","description":"飞书云文档（Docx / Wiki 文档）：读取和编辑飞书文档内容。当用户给出文档 URL 或 token，或需要查看、创建、编辑文档、插入或下载文档图片附件时使用。文档中嵌入的电子表格、多维表格、画板，先用本 skill 提取 token 再切到对应 skill。当用户给出 doubao.com 的 /docx/ 或 /wiki/ URL/token 时，也应直接使用本 skill；路由依据是 URL 路径模式和 token，而不是域名。不负责文档评论管理，也不负责表格或 Base 的数据操作。当用户明确要操作飞书思维笔记时，也使用本 skill。","note":""},{"name":"lark-event","folder":"~/.skillhub/skills/lark-event","category":"连接、协作与发布","description":"Lark/Feishu real-time event listening / subscribing / consuming: stream events as NDJSON via `lark-cli event consume <EventKey>` (covers IM messages/reactions/chat changes, Task updates, VC meeting started/joined/ended, Minutes generated, Whiteboard updated, etc.). Use for Lark bots, real-time message processing, long-running subscribers, streaming webhook/push handlers. Supports `--max-events` / `--timeout` bounded runs and a stderr ready-marker contract — designed for AI agents running as subprocesses.","note":""},{"name":"lark-im","folder":"~/.skillhub/skills/lark-im","category":"连接、协作与发布","description":"飞书即时通讯：收发消息和管理群聊。发送和回复消息、搜索聊天记录、管理群聊成员、上传下载图片和文件（支持大文件分片下载）、管理表情回复、发送应用内/短信/电话加急、发送和处理交互卡片（Interactive Card）、监听卡片按钮回调（card.action.trigger）。当用户需要发消息、查看或搜索聊天记录、下载聊天中的文件、查看群成员、搜索群、创建群聊或话题群、管理标记数据、管理 Feed 置顶（添加/移除/查询置顶会话）、管理标签数据、处理卡片回调时使用。","note":""},{"name":"lark-mail","folder":"~/.skillhub/skills/lark-mail","category":"连接、协作与发布","description":"飞书邮箱：Use when user mentions 起草邮件、写邮件、草稿、发送/回复/转发邮件、查阅邮件、看邮件、搜索邮件、邮件文件夹、邮件标签、邮件联系人、监听新邮件、邮件收信规则等；use for mail/email intent only. Do not use for docs/sheets/calendar/auth setup/pure contact lookup/IM chat tasks.","note":""},{"name":"lark-markdown","folder":"~/.skillhub/skills/lark-markdown","category":"连接、协作与发布","description":"飞书 Markdown：查看、创建、上传、编辑和比较 Markdown 文件。当用户需要创建或编辑 Markdown 文件、读取、修改、局部 patch 或比较差异时使用。不负责将 Markdown 导入为飞书在线文档，也不负责文件搜索、权限、评论、移动、删除等云空间管理操作。","note":""},{"name":"lark-minutes","folder":"~/.skillhub/skills/lark-minutes","category":"连接、协作与发布","description":"飞书妙记：搜索妙记、查看妙记基础信息、下载/上传音视频、读取或编辑妙记的产物内容、改标题、替换说话人/关键词、申请妙记查看/编辑权限。当给出minute_token、本地音视频文件，要查/改/转妙记产物，或用户明确要主动申请妙记权限时使用；本地音视频转纪要/逐字稿优先走本 skill，不要用 ffmpeg/whisper 本地转写。不负责：获取会议关联妙记，或仅按自然语言标题定位纪要","note":""},{"name":"lark-note","folder":"~/.skillhub/skills/lark-note","category":"连接、协作与发布","description":"飞书会议纪要（Note）直查：已知 note_id 时查询纪要详情、展示类型、关联文档 token，并读取 unified 原始逐字记录。当用户已持有 note_id，或从文档显式 vc-node-id 获得 note_id 时使用。不负责会议/日程/妙记定位、文档标题搜索或 Docx 正文读取。","note":""},{"name":"lark-okr","folder":"~/.skillhub/skills/lark-okr","category":"连接、协作与发布","description":"飞书 OKR：管理目标与关键结果。查看和编辑 OKR 周期、目标、关键结果、对齐关系、量化指标和进展记录。当用户需要查看或创建 OKR、管理目标和关键结果、查看对齐关系时使用。不负责：待办任务管理（lark-task）、日程/会议安排（lark-calendar）、绩效评估","note":""},{"name":"lark-openapi-explorer","folder":"~/.skillhub/skills/lark-openapi-explorer","category":"连接、协作与发布","description":"飞书/Lark 原生 OpenAPI 探索：从官方文档库中挖掘未经 CLI 封装的原生 OpenAPI 接口。当用户的需求无法被现有 lark-* skill 或 lark-cli 已注册命令满足，需要查找并调用原生飞书 OpenAPI 时使用。","note":""},{"name":"lark-shared","folder":"~/.skillhub/skills/lark-shared","category":"连接、协作与发布","description":"Use for lark-cli setup/auth tasks: auth login/status/logout, user vs bot identity, business-domain permissions (--domain, including all/docs/drive), missing scopes, revoking authorization, or handling _notice JSON.","note":""},{"name":"lark-sheets","folder":"~/.skillhub/skills/lark-sheets","category":"连接、协作与发布","description":"飞书电子表格：创建和操作电子表格。支持创建表格、管理工作表与行列结构（增删/合并/调整尺寸/隐藏/冻结）、读写单元格（值/公式/样式/批注/单元格图片）、查找替换、多操作原子批量更新，以及图表、透视表、条件格式、筛选器、迷你图、浮动图片等对象的创建与维护。当用户需要创建电子表格、管理工作表、批量读写或编辑数据、统计汇总与可视化、表格美化、公式计算（含 Excel 公式迁移）、金融/财务建模（DCF、三张表、预算、Sensitivity 等）等任务时使用。若用户是想按名称或关键词搜索云空间（云盘/云存储）里的表格文件，请改用 lark-drive 的 drive +search 先定位资源。当用户给出 doubao.com 的 /sheets/ URL/token 时，也应直接使用本 skill，不要因为域名不是飞书而回退到 WebFetch；路由依据是 URL 路径模式和 token，而不是域名。","note":""},{"name":"lark-skill-maker","folder":"~/.skillhub/skills/lark-skill-maker","category":"连接、协作与发布","description":"创建 lark-cli 的自定义 Skill。当用户需要把飞书 API 操作封装成可复用的 Skill（包装原子 API 或编排多步流程）时使用。","note":""},{"name":"lark-task","folder":"~/.skillhub/skills/lark-task","category":"连接、协作与发布","description":"飞书任务：管理任务、清单和任务智能体。创建待办任务、查看和更新任务状态、拆分子任务、组织任务清单、分配协作成员、上传任务附件、注册或注销任务智能体、更新任务智能体的主页数据、写入智能体任务记录。当用户需要创建待办事项、查看任务列表、跟踪任务进度、管理项目清单或给他人分配任务、为任务上传附件文件、注册注销任务智能体、更新智能体主页数据、写入任务记录时使用。","note":""},{"name":"lark-vc","folder":"~/.skillhub/skills/lark-vc","category":"连接、协作与发布","description":"飞书视频会议：搜索历史会议记录、查询会议纪要（总结/待办/章节/逐字稿）、查询参会人快照。当用户查询已结束的会议、获取会议产物（纪要/妙记）、查看参会人时使用；查询未来日程走 lark-calendar。不负责：Agent 真实入会/离会、会中实时事件（走 lark-vc-agent）。","note":""},{"name":"lark-vc-agent","folder":"~/.skillhub/skills/lark-vc-agent","category":"连接、协作与发布","description":"飞书视频会议会中能力：用于让应用机器人真实加入或离开正在进行的会议，并读取当前身份可见的会中事件、发送会中文本消息或会中表情。适用于用户询问正在开的会议发生了什么、谁在发言、是否共享内容，或需要发现当前可读的进行中会议 ID。不负责已结束会议搜索、参会人快照、纪要、逐字稿或录制查询，这些使用 lark-vc 技能。","note":""},{"name":"lark-whiteboard","folder":"~/.skillhub/skills/lark-whiteboard","category":"连接、协作与发布","description":">","note":""},{"name":"lark-workflow-meeting-summary","folder":"~/.skillhub/skills/lark-workflow-meeting-summary","category":"连接、协作与发布","description":"会议纪要整理工作流：汇总指定时间范围内的会议纪要并生成结构化报告。当用户需要整理会议纪要、生成会议周报、回顾一段时间内的会议内容时使用。","note":""},{"name":"lark-workflow-standup-report","folder":"~/.skillhub/skills/lark-workflow-standup-report","category":"连接、协作与发布","description":"日程待办摘要：编排 calendar +agenda 和 task +get-my-tasks，生成指定日期的日程与未完成任务摘要。适用于了解今天/明天/本周的安排。","note":""},{"name":"meegle","folder":"~/.skillhub/skills/lark-unified/skills/meegle","category":"连接、协作与发布","description":"|","note":""},{"name":"moments-writer-lite","folder":"~/.skillhub/skills/moment-writer__skillhub","category":"连接、协作与发布","description":"朋友圈文案生成器 v2.0 —— 灵感来自近5天问答记录，自动同步飞书多维表格","note":""},{"name":"podcast-transcript-txt","folder":"~/.skillhub/skills/podcast-transcript-txt","category":"连接、协作与发布","description":"一键式播客处理流程：从链接到可编辑的飞书云文档。支持小宇宙、YouTube等平台，自动转写、提炼内容、生成飞书文档。集成火山引擎ASR高质量语音转文字。","note":""},{"name":"portfolio-daily-pnl","folder":"~/.skillhub/skills/portfolio-daily-pnl","category":"连接、协作与发布","description":"每日持仓盈亏播报。从腾讯文档在线表格读取持仓数据，通过腾讯自选股 MCP","note":""},{"name":"skill-installer","folder":"~/.skillhub/skills/.system/skill-installer","category":"连接、协作与发布","description":"Install Codex skills into $CODEX_HOME/skills from a curated list or a GitHub repo path. Use when a user asks to list installable skills, install a curated skill, or install a skill from another repo (including private repos).","note":""},{"name":"tencent-docs","folder":"~/.skillhub/skills/skill_2053084036212973568","category":"连接、协作与发布","description":"腾讯文档（docs.qq.com）-在线云文档平台，是创建、编辑、管理文档的首选","note":""},{"name":"tencent-meeting-skill","folder":"~/.skillhub/skills/tencent-meeting-skill","category":"连接、协作与发布","description":"腾讯会议：会议管理与音视频协作助手。预约/创建/修改/取消会议、查询会议详情与会议号转换、查看参会成员/受邀人/等候室成员、查询用户会议列表（即将开始/进行中/已结束）、查询录制列表与下载地址、获取转写全文/段落/搜索、获取AI智能纪要（支持多语言翻译）、录制权限申请（预览+提交两步流程）、时间转换与版本检查、Agent意见箱反馈上报。当用户需要预约或管理腾讯会议、查看参会人员、查询会议录制或转写内容、获取智能纪要时使用；当用户访问录制相关内容（下载地址/转写/智能纪要）出现无权限错误时，自动发起录制权限申请流程；当Agent遇到以下任何情况时必须立即触发submit_feedback：工具缺失（功能不存在）、工具报错（返回错误码）、能力不足（参数/功能限制）、结果不符预期（数据异常）、改进建议（功能优化）；如果用户提供的是9位会议号而非meeting_id，优先使用get_meeting_by_code转换后再操作。不要在以下场景触发：日程管理（非腾讯会议日程）、即时通讯/聊天、腾讯文档操作、企业微信审批流程、电话/PSTN拨号、视频剪辑或视频编辑、其他视频会议平台（Zoom/Teams/飞书/钉钉）。","note":""},{"name":"tencent-survey","folder":"~/.skillhub/skills/tencent-survey","category":"连接、协作与发布","description":"腾讯问卷（wj.qq.com）-","note":""},{"name":"tencent-survey","folder":"~/.skillhub/skills/tencent-survey/tencent-survey","category":"连接、协作与发布","description":"腾讯问卷（wj.qq.com）- 在线问卷调查平台。涉及「问卷」「调查」「表单」「投票」「考试」「测评」「wj.qq.com」等操作时优先使用。支持能力：(1) 获取问卷详情（标题、设置、页面、题目、选项完整结构 + 纯文本 DSL + 自定义逻辑）(2) 使用纯文本创建问卷（text 必填，支持指定场景/指定项目）(3) 更新问卷中的单个题目（DSL 格式）(4) 获取问卷回答列表（支持游标分页）(5)","note":""},{"name":"website-change-monitor","folder":"~/.skillhub/skills/website-change-monitor","category":"连接、协作与发布","description":"监控任意网站清单（无 RSS 也可），每日抓取并与历史快照 diff，输出本地 Markdown 变化报告。Use when user wants to monitor a list of website 短视频文案\"），龙虾即可基于《IP提示词》方法论库，生成完整的获客文案。支持：热点拆解、选题策划、痛点文案、锁客文案、朋友圈、公众号等全链路内容。一次触发，完整交付。","note":""},{"name":"meeting-minutes","folder":"~/.skillhub/skills/meeting-minutes","category":"视频、音频与多媒体","description":"会议纪要智能生成技能。当用户提供音频/录音文件并要求生成会议纪要、会议记录、会议备忘录时使用。输入一段会议录音，自动完成语音转文字、AI摘要、生成正式商务风格Word文档全流程。支持","note":""},{"name":"podcast-to-audio","folder":"~/.skillhub/skills/podcast-to-audio","category":"视频、音频与多媒体","description":"从播客链接自动提取和下载音频文件。支持小宇宙、YouTube等平台，一键获取 m4a/mp3 音频文件。","note":""},{"name":"remotion-best-practices","folder":"~/.skillhub/skills/remotion-best-practices","category":"视频、音频与多媒体","description":"Best practices for Remotion - Video creation in React","note":""},{"name":"remotion-video-toolkit","folder":"~/.skillhub/skills/remotion-video-toolkit","category":"视频、音频与多媒体","description":"Complete toolkit for programmatic video creation with Remotion +","note":""},{"name":"简历初筛助手","folder":"~/.skillhub/skills/resume-screening","category":"数据分析与业务运营","description":"根据JD和简历自动生成简历初筛报告。当用户上传岗位JD和候选人简历，或要求'初筛简历'、'简历筛选'、'帮我看看这份简历'、'JD匹配分析'时触发此skill。输出岗位匹配证据、风险点、待追问问题和人工复核建议，不直接做出录用或淘汰决定。","note":""},{"name":"数据分析大师","folder":"~/.skillhub/skills/data-analysis-plus","category":"数据分析与业务运营","description":"|","note":""},{"name":"branch-performance-scorecard","folder":"~/.skillhub/skills/branch-performance-scorecard","category":"数据分析与业务运营","description":"银行总/分/支行经营评价计分分析师。当用户提供支行 KPI 样本（含「评比规则」「支行样本」的 xlsx），要求按\"片区+分组\"独立边界做组内极差归一化计分、组内排名、选定中游支行对标（同组第1名/组中位/相邻机构）、反推\"多拿1分\"所需增量，并输出多 sheet 结果 xlsx 时使用。内置\"组内极差为0→统一满分\"与\"待录入项不得编造\"两条硬规则。","note":""},{"name":"branch-weekly-report","folder":"~/.skillhub/skills/branch-weekly-report","category":"数据分析与业务运营","description":"支行周报汇总技能。将多个支行提交的周度经营报表进行文件齐套检查、字段映射、格式统一、汇总计算、异常识别、来源追溯，生成统一明细表、缺报清单、数据质量报告、异常指标清单及一页管理摘要。触发场景：用户提到生成支行周报、汇总本周经营、检查支行报表、支行周报汇总、weekly branch report、branch performance summary等，且需要处理多个支行提交的Excel/CSV/Word格式报表时使用。必需输入：支行清单、字段字典、各支行周报文件、指标口径说明、输出模板。当缺少指标口径、出现同名字段含义冲突、或发现未脱敏客户信息时，停止处理并报告。","note":""},{"name":"claude-api","folder":"~/.skillhub/skills/claude-api","category":"数据分析与业务运营","description":"Build apps with the Claude API or Anthropic SDK. TRIGGER when: code imports `anthropic`/`@anthropic-ai/sdk`/`claude_agent_sdk`, or user asks to use Claude API, Anthropic SDKs, or Agent SDK. DO NOT TRIGGER when: code imports `openai`/other AI SDK, general programming, or ML/data-science tasks.","note":""},{"name":"data-analysis-skill","folder":"~/.skillhub/skills/data-analysis-skill__skillhub","category":"数据分析与业务运营","description":"数据分析技能包 - 自动抓取、清洗、可视化、生成报告。适合数据分析师、运营人员，告别 Excel 手工操作。","note":""},{"name":"data-analyst-pro","folder":"~/.skillhub/skills/qclaw-data-analyst-pro","category":"数据分析与业务运营","description":"表格数据不会挖？10 大场景一键分析，自动清洗+出图+给结论，揪出异常和趋势——不用你写公式。","note":""},{"name":"generate-performance-ipo-standards","folder":"~/.skillhub/skills/generate-performance-ipo-standards","category":"数据分析与业务运营","description":"将组织目标、岗位职责、绩效制度、历史案例和本期结果数据转化为岗位绩效指标、权重、计算口径、五级评价标准及风险清单。用于用户提出绩效 IPO、岗位 KPI/OKR、绩效评价标尺、指标权重、分级标准、绩效校准、薪酬岗位绩效标准或需要生成 Word 报告与 Excel 指标明细时；适用于执行岗、管理岗和业务协同岗的差异化标准设计。","note":""},{"name":"generic-mall-bill-template-refresh","folder":"~/.skillhub/skills/generic-mall-bill-template-refresh","category":"数据分析与业务运营","description":"通用商城账单模板刷新技能。只要用户提供我们的原始商城账单 Excel 和客户要求的 Excel 模板，就用此技能按客户模板生成新版客户账单、验收单、结算单、明细表或报表。适用于不同客户格式不一致的商城运营账单交付场景；不要覆盖已有客户专用技能，客户专用技能可作为特例保留。","note":""},{"name":"gf-stock-f10","folder":"~/.skillhub/skills/gf-stock-f10","category":"数据分析与业务运营","description":"本Skill基于广发证券权威数据接口构建，查询股票基础信息，包含公司全称、板块、上市日期、主营业务、所属行业。","note":""},{"name":"gov-funding-application","folder":"~/.skillhub/skills/gov-funding-application","category":"数据分析与业务运营","description":"政府资金/补贴类项目申报书自动生成与申报材料整理。当用户提到项目申报、申报书、资金申请报告、补贴申报、专项资金申报、按申报要求整理材料，或提供申报通知/申报模板和素材文件夹（技术方案、财务资料、人事资料、公司资质）时使用。功能覆盖：解析申报要求、盘点素材库、缺件分析、撰写申报书正文、生成Word初稿、按官方模板填充。即使用户只说\"帮我整理申报材料\"\"把申报书写出来\"\"看看材料还缺什么\"也必须使用本技能。","note":""},{"name":"hotel-ops-cockpit","folder":"~/.skillhub/skills/hotel-ops-cockpit","category":"数据分析与业务运营","description":"酒店经营诊断驾驶舱生成器。当用户上传或提供本地 Excel/CSV 酒店经营数据（P&L、客房、餐饮、渠道、出租率等），并希望以收益管理专家视角做深度诊断、对标行业模型、输出 HTML 驾驶舱报告（含健康度打分、关键看板、异常预警、五维度分析、分层 Action Plan）时使用。触发词示例：分析这份酒店经营表、做个酒店经营诊断驾驶舱、酒店收益管理分析、帮我看下这家酒店的经营短板。仅在本地离线处理数据，不联网、不上传。","note":""},{"name":"invoice-collector","folder":"~/.skillhub/skills/invoice-collector","category":"数据分析与业务运营","description":"用于报销场景下的发票收集。只要用户提到从邮箱、邮件附件、12306、飞猪、发票下载链接、报销邮件、电子发票等来源批量收集发票文件，就应使用这个 skill。它负责搜索邮件、下载 PDF/OFD 等附件、识别邮件中的发票链接并尝试自动下载；如果链接无法自动处理，必须单独输出待人工确认列表，而不是中断整个流程。这个 skill 只负责采集，不负责最终去重汇总或 Excel 出表。","note":""},{"name":"invoice-organizer","folder":"~/.skillhub/skills/invoice-organizer","category":"数据分析与业务运营","description":"用于报销场景下的发票整理。只要用户提到整理电子发票、读取 PDF 或 OFD、提取发票号金额日期抬头、识别个人抬头、报销去重、汇总成 Excel、生成可提交报销表等任务，就应使用这个 skill。它负责读取采集好的发票文件，抽取关键信息，识别异常，并输出最终汇总表。尤其在同一张发票同时存在 PDF 和 OFD 版本时，不要只按发票号去重，必须考虑文件类型，避免误删。","note":""},{"name":"jinan-metro-bill-refresh","folder":"~/.skillhub/skills/jinan-metro-bill-refresh","category":"数据分析与业务运营","description":"济南地铁餐费商城账单刷新技能。凡是用户提供有分/商城运营的原始主账单、餐补汇总表、客户要求的 Excel 格式模板，并要求生成客户版账单、验收单、结算清单、按客户格式刷新报表时，都应使用本技能。尤其适用于“济南地铁”“餐费商城”“劳服/铭源/培森/舜安/舜洁”客户账单拆分与刷新场景。","note":""},{"name":"marketing-huoke-allinone","folder":"~/.skillhub/skills/marketing-huoke-allinone","category":"数据分析与业务运营","description":"全链路营销获客文案生成技能。用户输入任意话题，Skill自动分析并推荐最适合的内容平台（短视频/公众号/小红书/朋友圈等），再生成完整获客文案。一个话题输入，全链路内容输出。","note":""},{"name":"operational data anlysis","folder":"~/.skillhub/skills/operational data anlysis","category":"数据分析与业务运营","description":"","note":""},{"name":"plugin-creator","folder":"~/.skillhub/skills/.system/plugin-creator","category":"数据分析与业务运营","description":"Create and scaffold plugin directories for Codex with a required `.codex-plugin/plugin.json`, optional plugin folders/files, valid manifest defaults, and personal-marketplace entries by default. Use when Codex needs to create a new personal plugin, add optional plugin structure, generate or update marketplace entries for plugin ordering and availability metada description":"Create or update a Codex skill with appropriately scoped instructions and any needed supporting resources.","note":""},{"name":"typer","folder":"~/.skillhub/skills/generate-performance-ipo-standards/.venv/Lib/site-packages/typer/.agents/skills/typer","category":"Agent、开发与自动化","description":"Typer best practices and conventions. Use when working with Typer CLIs. Keeps Typer code clean and up to date with the latest features and patterns, updated with new versions. Write new code or refactor and update old code.","note":""}]};
    let currentCategory = "全部";
    const list = document.getElementById("list");
    const chips = document.getElementById("chips");
    const search = document.getElementById("search");
    const empty = document.getElementById("empty");
    document.getElementById("totalCount").textContent = data.total;
    document.getElementById("categoryCount").textContent = data.categories.length;
    function esc(value) { return String(value || "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }
    function matches(skill, query) {
      if (!query) return true;
      return [skill.name, skill.description, skill.folder, skill.category, skill.note].join(" ").toLowerCase().includes(query.toLowerCase());
    }
    function renderChips() {
      const cats = [{ name:"全部", count:data.total }, ...data.categories];
      chips.innerHTML = cats.map(c => '<button type="button" class="' + (c.name === currentCategory ? 'active' : '') + '" data-cat="' + esc(c.name) + '">' + esc(c.name) + ' · ' + c.count + '</button>').join("");
      chips.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => { currentCategory = btn.dataset.cat; render(); }));
    }
    function render() {
      renderChips();
      const query = search.value.trim();
      const rows = data.skills.filter(s => (currentCategory === "全部" || s.category === currentCategory) && matches(s, query));
      document.getElementById("visibleCount").textContent = rows.length;
      empty.style.display = rows.length ? "none" : "block";
      const grouped = new Map();
      for (const skill of rows) {
        if (!grouped.has(skill.category)) grouped.set(skill.category, []);
        grouped.get(skill.category).push(skill);
      }
      list.innerHTML = Array.from(grouped.entries()).map(([category, skills]) => {
        const items = skills.map(skill =>
          '<div class="skill">' +
            '<div>' +
              '<div class="name">' + esc(skill.name) + '</div>' +
              '<div class="meta">' + esc(skill.folder) + '</div>' +
              (skill.note ? '<div class="note">' + esc(skill.note) + '</div>' : '') +
            '</div>' +
            '<div class="desc">' + esc(skill.description || "未写 description，打开 SKILL.md 查看。") + '</div>' +
            '<div class="meta">' + esc(skill.category) + '</div>' +
          '</div>'
        ).join("");
        return '<section class="group"><h2>' + esc(category) + ' · ' + skills.length + '</h2>' + items + '</section>';
      }).join("");
    }
    search.addEventListener("input", render);
    render();
  </script>
