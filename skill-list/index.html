parameter, labels, nesting, playback), and performance (transforms, will-change, quickTo). Use when writing GSAP animations in HyperFrames compositions.","source":"中心技能","note":""},{"name":"hr-star-interview","category":"课程、授课与知识资产","description":"基于HR智能体培训课程知识库，按STAR模型生成初/中/高三级面试题，覆盖智能体认知、平台操作、招聘、培训、绩效、员工关系六大模块","source":"中心技能","note":""},{"name":"html-to-png","category":"课程、授课与知识资产","description":"Automatically add \"Save as PNG\" screenshot functionality to HTML files. Use this skill whenever the user mentions: adding screenshot functionality to HTML, converting HTML to images, saving web pages as pictures, creating downloadable screenshots from HTML, adding export-to-image buttons, generating PNG from HTML content, or when they need to capture long scrolling HTML pages as complete images. Also trigger when users mention html2canvas, full-page screenshots, or need to share HTML content as image files.","source":"中心技能","note":""},{"name":"hyperframes","category":"课程、授课与知识资产","description":"Create video compositions, animations, title cards, overlays, captions, voiceovers, audio-reactive visuals, and scene transitions in HyperFrames HTML. Use when asked to build any HTML-based video content, add captions or subtitles synced to audio, generate text-to-speech narration, create audio-reactive animation (beat sync, glow, pulse driven by music), add animated text highlighting (marker sweeps, hand-drawn circles, burst lines, scribble, sketchout), or add transitions between scenes (crossfades, wipes, reveals, shader transitions). Covers composition authoring, timing, media, and the full video production workflow. For dev-loop CLI commands (init, lint, inspect, preview, render) see the hyperframes-cli skill; for asset preprocessing commands (tts, transcribe, remove-background) see the hyperframes-media skill.","source":"中心技能","note":""},{"name":"hyperframes-media","category":"课程、授课与知识资产","description":"Asset preprocessing for HyperFrames compositions — text-to-speech narration (Kokoro), audio/video transcription (Whisper), and background removal for transparent overlays (u2net). Use when generating voiceover from text, transcribing speech for captions, removing the background from a video or image to use as a transparent overlay, choosing a TTS voice or whisper model, or chaining these (TTS → transcribe → captions). Each command downloads its own model on first run.","source":"中心技能","note":""},{"name":"ima-skill","category":"课程、授课与知识资产","description":"统一的 IMA OpenAPI 技能，支持笔记管理和知识库操作。 当用户提到知识库、资料库、笔记、备忘录、记事，或者想要上传文件、添加网页到知识库、 搜索知识库内容、搜索/浏览/创建/编辑笔记时，使用此 skill。 即使用户没有明确说\"知识库\"或\"笔记\"，只要意图涉及文件上传到知识库、网页收藏、 知识搜索、个人文档存取（如\"帮我记一下\"、\"搜一下知识库里有没有XX\"），也应触发此 skill。","source":"中心技能","note":""},{"name":"imagegen","category":"课程、授课与知识资产","description":"Generate or edit raster images when the task benefits from AI-created bitmap visuals such as photos, illustrations, textures, sprites, mockups, or transparent-background cutouts. Use when Codex should create a brand-new image, transform an existing image, or derive visual variants from references, and the output should be a bitmap asset rather than repo-native code or vector. Do not use when the task is better handled by editing existing SVG/vector/code-native assets, extending an established icon or logo system, or building the visual directly in HTML/CSS/canvas.","source":"系统内置","note":""},{"name":"jd-generation-assistant","category":"课程、授课与知识资产","description":"岗位说明书管理助手。服务于HR教学练习场景。只需输入岗位名称即可自动生成结构化岗位说明书， 基于\"附件4.分公司岗位说明书(2020版）\"模板，包含岗位基本信息、岗位使命、主要职责、 任职资格、权限边界、绩效指标建议和版本变更说明，并输出Word文档。 Triggers when user asks to generate, create, review, or update a Job Description/岗位说明书/岗位描述, when user mentions HR training/教学练习 context, or when user simply provides a job/role name and expects a JD output. Only processes simulated/training data — never processes real employee or candidate private data.","source":"中心技能","note":""},{"name":"knowledge-base","category":"课程、授课与知识资产","description":"IMA 知识库操作子技能，用于知识库查询、管理和内容调用。","source":"子技能","note":""},{"name":"knowledge-interviewer","category":"课程、授课与知识资产","description":"从访谈录音/文本中萃取结构化知识。TRIGGER when: 用户需要\"萃取\"、\"提取知识\"、\"访谈分析\"、 \"知识萃取报告\"、从DOCX/TXT提取专家经验。支持单文件和多文件综合萃取，自动检测输入类型。 输出严格按 extraction-schema.json 的 JSON 结构。 SKIP: 生成 HTML/PPTX/DOCX 交付物（那是 zhongwen-content 的职责）。","source":"中心技能","note":""},{"name":"lark-apps","category":"课程、授课与知识资产","description":"妙搭（Spark/Miaoda）应用开发与托管：应用创建、HTML静态站点发布、本地全栈开发、云端生成迭代、AI相关能力和飞书平台能力或者其他外部能力集成、日志/Trace/监控指标/PV/UV 查询、环境变量管理、应用角色与成员管理、自动化触发器（定时/记录变更/Webhook/飞书审批）。当用户要开发/新建一个系统·工具·平台·应用，或要本地开发 / 云端开发 / 修改 / 部署 / 发布 / 上线 / 拿可分享链接，或用 HTML 做页面·网站·部署到妙搭，或提到妙搭/Spark/Miaoda（应用运行时域名形如 *.aiforce.cloud）、应用数据库、应用文件存储、开放 API Key、可见范围、应用角色/角色成员、线上日志、接口请求量、错误量、延迟、访问量、环境变量、给妙搭应用配自动化任务/定时触发/审批通过后自动触发时使用。不负责普通云盘文件上传（lark-drive）、飞书文档编辑（lark-doc）、原生幻灯片创建（lark-slides）。","source":"中心技能","note":""},{"name":"lark-drive","category":"课程、授课与知识资产","description":"飞书云空间（云盘/云存储）：管理 Drive 文件和文件夹，包含上传/下载、创建文件夹、复制/移动/删除、查看元数据、评论/权限/订阅、标题、版本、飞书文档密级标签（secure labels）和本地文件导入。用户需要整理云盘目录、处理云空间资源 URL/token、判断链接类型/真实 token/标题，或导入 Word/Markdown/Excel/CSV/PPTX/.base 为 docx/sheet/bitable/slides 时使用；doubao.com 云空间 URL/token 也按资源路径和 token 路由，不回退 WebFetch。不负责：文档内容编辑（走 lark-doc）、表格/Base 表内数据操作（走 lark-sheets/lark-base）、知识空间节点/成员管理（走 lark-wiki）、原生 Markdown 文件读写/patch/diff（走 lark-markdown）。","source":"中心技能","note":""},{"name":"lark-slides","category":"课程、授课与知识资产","description":"飞书幻灯片：创建和编辑幻灯片。创建演示文稿、读取幻灯片内容、管理幻灯片页面（创建、删除、读取、局部替换）。当用户需要创建或编辑幻灯片、读取或修改单个页面时使用。当用户给出 doubao.com 的 /slides/ URL/token 时，也应直接使用本 skill，不要因为域名不是飞书而回退到 WebFetch；路由依据是 URL 路径模式和 token，而不是域名。不负责：云文档内容编辑（走 lark-doc）、云文档里的独立画板对象（走 lark-whiteboard，注意 slide 内嵌的流程图/架构图仍属本 skill）、上传或下载普通文件（走 lark-drive）。","source":"中心技能","note":""},{"name":"lark-unified","category":"课程、授课与知识资产","description":"Unified Lark/Feishu CLI suite covering messaging, documents, spreadsheets, base tables, calendar, mail, tasks, wiki, slides, meetings, OKR, approval, attendance and more. Wraps the official lark-cli (larksuite/cli) with 200+ commands across 18 business domains, a three-tier command model (shortcuts / API commands / raw API), and a non-TTY setup path for headless environments. Use when working with Lark/Feishu through the CLI: sending or searching messages, creating and editing docs and sheets, querying base records, managing calendar events and meetings, reading mail, managing tasks and wikis, handling approvals, or calling any Lark OpenAPI endpoint. Feishu Project (飞书项目 / Meegle) requests — 工作项, 需求, 缺陷, node/state transitions, MQL, WBS — route to a bundled on-demand sub-skill.","source":"中心技能","note":""},{"name":"lark-wiki","category":"课程、授课与知识资产","description":"飞书知识库：管理知识空间、空间成员和文档节点。创建和查询知识空间、查看和管理空间成员、管理节点层级结构、在知识库中组织文档和快捷方式。当用户需要在知识库中查找或创建文档、浏览知识空间结构、查看或管理空间成员、移动或复制节点时使用。当用户给出 doubao.com 的 /wiki/ URL/token 时，也应直接使用本 skill，不要因为域名不是飞书而回退到 WebFetch；路由依据是 URL 路径模式和 token，而不是域名。不负责：上传文件到知识库节点下（走 lark-drive）、编辑文档/表格/Base 内容（走 lark-doc / lark-sheets / lark-base）。","source":"中心技能","note":""},{"name":"lijiagui-ppt","category":"课程、授课与知识资产","description":"加贵-PPT。用于基于课程大纲生成或刷新授课PPT，以及制作「蓝色标题条 + 华文楷体 + 纯蓝色系」的加贵风格PPT。已有授课内容优先从本地原页模块库组装，保留人工精修页；只有结构壳、客户专属页和真实缺口才新生成。用户明确要求统一蓝色母版时，再对组装副本做风格统一并渲染目检。","source":"中心技能","note":""},{"name":"lottie","category":"课程、授课与知识资产","description":"Lottie and dotLottie adapter patterns for HyperFrames. Use when embedding lottie-web JSON animations, .lottie files, @lottiefiles/dotlottie-web players, registering instances on window.__hfLottie, or making After Effects exports deterministic in HyperFrames.","source":"中心技能","note":""},{"name":"markitdown","category":"课程、授课与知识资产","description":"Use this skill whenever the user wants to convert any file format to Markdown. Supports PDF, DOCX, PPTX, XLSX, audio, video, images, and more. This is Microsoft's markitdown tool that converts various document formats to clean Markdown text.","source":"中心技能","note":""},{"name":"notes","category":"课程、授课与知识资产","description":"IMA 笔记操作子技能，用于笔记查询、读取和内容整理。","source":"子技能","note":""},{"name":"optimize","category":"课程、授课与知识资产","description":"Diagnoses and fixes UI performance across loading speed, rendering, animations, images, and bundle size. Use when the user mentions slow, laggy, janky, performance, bundle size, load time, or wants a faster, smoother experience.","source":"中心技能","note":""},{"name":"overdrive","category":"课程、授课与知识资产","description":"Pushes interfaces past conventional limits with technically ambitious implementations — shaders, spring physics, scroll-driven reveals, 60fps animations. Use when the user wants to wow, impress, go all-out, or make something that feels extraordinary.","source":"中心技能","note":""},{"name":"pdf","category":"课程、授课与知识资产","description":"Use this skill whenever the user wants to do anything with PDF files. This includes reading or extracting text/tables from PDFs, combining or merging multiple PDFs into one, splitting PDFs apart, rotating pages, adding watermarks, creating new PDFs, filling PDF forms, encrypting/decrypting PDFs, extracting images, and OCR on scanned PDFs to make them searchable. If the user mentions a .pdf file or asks to produce one, use this skill.","source":"中心技能","note":""},{"name":"pptx","category":"课程、授课与知识资产","description":"Use this skill any time a .pptx file is involved in any way — as input, output, or both. This includes: creating slide decks, pitch decks, or presentations; reading, parsing, or extracting text from any .pptx file (even if the extracted content will be used elsewhere, like in an email or summary); editing, modifying, or updating existing presentations; combining or splitting slide files; working with templates, layouts, speaker notes, or comments. Trigger whenever the user mentions \\\"deck,\\\" \\\"slides,\\\" \\\"presentation,\\\" or references a .pptx filename, regardless of what they plan to do with the content afterward. If a .pptx file needs to be opened, created, or touched, use this skill.","source":"中心技能","note":""},{"name":"pptx-generator","category":"课程、授课与知识资产","description":"专业 PPT 生成器。11 种幻灯片类型、5 套配色、图表/表格/时间线/图片支持。JSON 驱动，生成标准可编辑","source":"中心技能","note":""},{"name":"proactive-training-ai","category":"课程、授课与知识资产","description":"> 一个能自动理解客户需求、匹配标准产品、生成定制课程大纲的智能系统。","source":"中心技能","note":""},{"name":"qq-email","category":"课程、授课与知识资产","description":"QQ邮箱 IMAP receive and SMTP send via Node.js scripts; credentials","source":"中心技能","note":""},{"name":"recording-to-training-video","category":"课程、授课与知识资产","description":"将课程录音或授课视频重建为原声培训视频、知识点短视频系列，或批量刷新已有成片的字幕与片头。以录音语义决定分段和画面，有合适PPT则复用，不匹配或没有PPT则按录音补页或重建可编辑课件；包含字幕纠错、语音对齐和成片验收。用户说“录音剪成课”“重建培训视频”“刷新全部短视频”时使用，不用于单纯撰写营销分镜或自动发布。","source":"中心技能","note":""},{"name":"slack-gif-creator","category":"课程、授课与知识资产","description":"Knowledge and utilities for creating animated GIFs optimized for Slack. Provides constraints, validation tools, and animation concepts. Use when users request animated GIFs for Slack like \"make me a GIF of X doing Y for Slack.","source":"中心技能","note":""},{"name":"srt-whiteboard-animation","category":"课程、授课与知识资产","description":"将 SRT 字幕做成暖米黄纸张底的白板手绘动画：读字幕→输出配图策略→确认后生成统一风格线稿→按叙事语义标注分区→预览台调整→渲染 MP4。编排沿用分区遮罩揭示（annotation.json / sequence / startMs / protectedRegions），但每个区域内的落墨换成 stream 的连续笔迹（骨架/网格 ink→color）。当用户提供 SRT 字幕并要求\"字幕做成白板手绘/流式笔迹视频\"\"SRT 生成白板动画\"\"按字幕分镜画手绘\"时触发。","source":"中心技能","note":""},{"name":"tencent-docs-mcp","category":"课程、授课与知识资产","description":"腾讯文档 MCP — docs.qq.com 在线文档全功能操作封装。涵盖智能文档（SmartCanvas）、在线表格（Sheet）、文档（DOC）、OCR、网页剪藏、幻灯片等全部工具。当用户提到腾讯文档、docs.qq.com、需要创建/编辑/读取在线文档时使用。核心能力：创建文档、读取内容、编辑文档、管理文件、搜索文件、OCR识别、网页剪藏、AI生成PPT。","source":"中心技能","note":""},{"name":"theme-factory","category":"课程、授课与知识资产","description":"Toolkit for styling artifacts with a theme. These artifacts can be slides, docs, reportings, HTML landing pages, etc. There are 10 pre-set themes with colors/fonts that you can apply to any artifact that has been creating, or can generate a new theme on-the-fly.","source":"中心技能","note":""},{"name":"three","category":"课程、授课与知识资产","description":"Three.js and WebGL adapter patterns for HyperFrames. Use when creating deterministic Three.js scenes, WebGL canvas layers, AnimationMixer timelines, camera motion, shader-driven visuals, or canvas renders that respond to HyperFrames hf-seek events.","source":"中心技能","note":""},{"name":"training-material-searcher","category":"课程、授课与知识资产","description":"培训资料搜索助手。当AI培训讲师需要从小宇宙播客、X(Twitter)等平台搜索AI培训相关素材时使用。 覆盖主题：AI原生组织(AI-native org)、agent skill、pod架构、loop engineering等前沿话题。 典型触发场景： - 搜索/查找/收集 AI 培训资料或素材 - 每日或定期获取 AI 前沿资讯作为培训素材 - 搜索小宇宙或 X 上关于 AI 组织、agent、工程实践的内容 - 整理培训资料简报 - 用户提到 \"培训资料\" \"搜索素材\" \"找一下 X上/小宇宙上\" 等","source":"中心技能","note":""},{"name":"waapi","category":"课程、授课与知识资产","description":"Web Animations API adapter patterns for HyperFrames. Use when authoring element.animate() motion, Animation currentTime seeking, document.getAnimations(), KeyframeEffect timing, fill modes, or native browser animations that must render deterministically in HyperFrames.","source":"中心技能","note":""},{"name":"wechat-intelligence-hub","category":"课程、授课与知识资产","description":"WeChat Intelligence Hub（微信个人情报库），本地只读微信情报 Skill。用于按任意明确时间范围，或围绕某条信息、某个人、某个群、某个产品/物品、某个微信标签、某个项目或事件检索和总结微信聊天；也用于生成群聊与私聊报告、发现并跟进商单/培训/咨询/项目合作、聚合跨群链接、检查待回复和待兑现承诺、维护商机状态及筛选值得复联的人。Use whenever the user invokes 微信个人情报库、WeChat Intelligence Hub、微信商单雷达、Deal Radar，或询问某人/某主题/某件事聊过什么、最近微信有什么新机会、谁需要回复或复联。","source":"中心技能","note":""},{"name":"xlsx","category":"课程、授课与知识资产","description":"Use this skill any time a spreadsheet file is the primary input or output. This means any task where the user wants to: open, read, edit, or fix an existing .xlsx, .xlsm, .csv, or .tsv file (e.g., adding columns, computing formulas, formatting, charting, cleaning messy data); create a new spreadsheet from scratch or from other data sources; or convert between tabular file formats. Trigger especially when the user references a spreadsheet file by name or path — even casually (like \\\"the xlsx in my downloads\\\") — and wants something done to it or produced from it. Also trigger for cleaning or restructuring messy tabular data files (malformed rows, misplaced headers, junk data) into proper spreadsheets. The deliverable must be a spreadsheet file. Do NOT trigger when the primary deliverable is a Word document, HTML report, standalone Python script, database pipeline, or Google Sheets API integration, even if tabular data is involved.","source":"中心技能","note":""},{"name":"zhongwen-content","category":"课程、授课与知识资产","description":"根据知识萃取 JSON 生成精良的 HTML 报告页面。TRIGGER when: 用户需要\"生成交付物\"、 \"生成萃取报告\"、\"convert extraction to HTML\"、完成知识萃取后需要输出展示材料。 自动处理单文件 JSON 和综合萃取 JSON（多文档合并）。 SKIP: 知识萃取本身（那是 knowledge-interviewer 的职责）、PPTX/DOCX 生成（按需单独调用 pptx/docx skill）。","source":"中心技能","note":""},{"name":"baoyu-post-to-wechat","category":"连接、协作与发布","description":"Posts content to WeChat Official Account (微信公众号) via API or Chrome","source":"中心技能","note":""},{"name":"browser-skill","category":"连接、协作与发布","description":"Use when the user asks to automate their logged-in Chromium browser: visit and read pages, fill forms, scrape data, click through flows, regression-test a PR's UI, validate a deployed page, or operate a tab they identify. Requires the bsk CLI and browser extension.","source":"中心技能","note":""},{"name":"business-blueprint-from-research","category":"连接、协作与发布","description":"电商项目业务蓝图生成技能。凡是用户提供客户需求调研稿、访谈录音稿、会议纪要、实施调研要点、客户口述需求，并希望基于有分科技业务蓝图模板生成客户确认用业务蓝图、飞书云文档、实施方案初稿、业务蓝图框架时，都应使用本技能。尤其适用于福利商城、积分商城、员工福利、企业内购、商家管理、财务对账、SSO、HR 员工同步、消息推送等电商实施蓝图场景。","source":"中心技能","note":""},{"name":"claude-code-best-practices","category":"连接、协作与发布","description":"Claude Code 最佳实践配置技能，专为李家贵定制。基于其 765 条消息、94 个会话的使用分析，封装其验证过的配置方法论和工作流。包括：CLAUDE.md 最优配置（含 Python/Node.js 环境偏好、蓝紫色渐变设计风格）、自定义 Agent 创建（html-generator）、飞书私信通知 Hooks、Hooks 系统详解、以及 6 类常见问题的解决方案。当李家贵提到\"配置 Claude Code\"、\"创建 Agent\"、\"配置 Hooks\"、\"优化工作流\"、\"Claude Code 最佳实践\"、\"飞书通知\"、\"Python 环境\"时触发。","source":"中心技能","note":""},{"name":"frontend-design","category":"连接、协作与发布","description":"Create distinctive, production-grade frontend interfaces with high design quality. Generates creative, polished code that avoids generic AI aesthetics. Use when the user asks to build web components, pages, artifacts, posters, or applications, or when any design skill requires project context.","source":"中心技能","note":""},{"name":"getnote-auth","category":"连接、协作与发布","description":"安装和连接得到大脑，完成浏览器授权、环境诊断、配额检查、CLI 升级与领域 Skill 同步。用户说“安装/连接/登录/更新得到大脑”“检查为什么不能用”“查看额度”时使用。","source":"中心技能","note":""},{"name":"getnote-note","category":"连接、协作与发布","description":"使用得到大脑保存文字、链接、图片和长笔记，查看笔记详情、原文、录音转写、附件、时间线、快捷笔记和会议待办，并安全更新、删除或分享笔记。","source":"中心技能","note":""},{"name":"getnote-tag","category":"连接、协作与发布","description":"查看得到大脑笔记已有标签，为笔记添加标签，或按真实标签 ID 安全删除标签，并避免误删系统标签或覆盖其他标签。","source":"中心技能","note":""},{"name":"github-pages-publisher","category":"连接、协作与发布","description":"Use this skill whenever the user asks to publish, upload, deploy, or update a static HTML/site/file to GitHub Pages, especially when they provide a github.io URL such as \"https://owner.github.io/repo/path\", say \"发布到这个地址\", \"上传到 GitHub Pages\", \"发布到 github pages\", \"部署网页\", or ask to verify the live page with Browser/browser use. This skill is also appropriate when a Pages URL returns 404 after pushing, because it focuses on finding the actual Pages source branch before publishing.","source":"中心技能","note":""},{"name":"htmlify","category":"连接、协作与发布","description":"You are converting text or markdown content to beautifully styled HTML pages.","source":"中心技能","note":""},{"name":"icar-short-video-workflow","category":"连接、协作与发布","description":"Run the iCAR automotive short-video refresh workflow for Feishu/Lark Base: read each 新闻摘要, generate three automotive storyboard scripts, ensure three output columns such as 分镜头脚本1/2/3 exist, and write the scripts back to the same Base record. Use when the user says to start or refresh the iCAR/汽车短视频 workflow, provides a Feishu Base URL and column such as 新闻摘要, asks to turn news summaries into short-video scripts, references IP提示词（GZM）, or wants a Base table automatically populated with multiple storyboard versions.","source":"中心技能","note":""},{"name":"lark-approval","category":"连接、协作与发布","description":"飞书审批：查询和处理审批待办/已办/实例，搜索可发起审批定义、查看定义详情并发起原生审批实例。当用户要处理审批任务、查看审批实例、搜索或发起审批时使用。审批待办不是飞书任务；非审批类待办走 lark-task。不负责创建审批定义；三方审批定义不走原生提单。","source":"中心技能","note":""},{"name":"lark-attendance","category":"连接、协作与发布","description":"飞书考勤打卡：查询自己的考勤打卡记录","source":"中心技能","note":""},{"name":"lark-base","category":"连接、协作与发布","description":"飞书多维表格（Base）操作：建表、字段、记录、视图、统计、公式/lookup、表单、仪表盘、workflow、角色权限；遇到 Base/多维表格/bitable 或 /base/ 链接时使用。文件导入转 lark-drive，认证/授权转 lark-shared。","source":"中心技能","note":""},{"name":"lark-calendar","category":"连接、协作与发布","description":"飞书日历：管理日历日程和会议室。查看/搜索日程、创建/更新日程、管理参会人、查询忙闲和推荐时段、预定会议室。当用户需要查看日程安排、创建/修改会议、查询/预定会议室时使用。不负责：查询过去的视频会议记录（走 lark-vc）、待办任务（走 lark-task）。","source":"中心技能","note":""},{"name":"lark-contact","category":"连接、协作与发布","description":"飞书 / Lark 通讯录:按姓名 / 邮箱解析成 open_id,或按 open_id 反查姓名 / 部门 / 邮箱 / 联系方式 / 个人状态 / 签名。当用户提到某人姓名要下一步发消息 / 排日程,或拿到 open_id 想查具体信息时使用。不负责部门树遍历、按部门列员工、组织架构图,这类需求走原生 OpenAPI。","source":"中心技能","note":""},{"name":"lark-doc","category":"连接、协作与发布","description":"飞书云文档（Docx / Wiki 文档）：读取和编辑飞书文档内容。当用户给出文档 URL 或 token，或需要查看、创建、编辑文档、插入或下载文档图片附件时使用。文档中嵌入的电子表格、多维表格、画板，先用本 skill 提取 token 再切到对应 skill。当用户给出 doubao.com 的 /docx/ 或 /wiki/ URL/token 时，也应直接使用本 skill；路由依据是 URL 路径模式和 token，而不是域名。不负责文档评论管理，也不负责表格或 Base 的数据操作。当用户明确要操作飞书思维笔记时，也使用本 skill。","source":"中心技能","note":""},{"name":"lark-event","category":"连接、协作与发布","description":"Lark/Feishu real-time event listening / subscribing / consuming: stream events as NDJSON via `lark-cli event consume <EventKey>` (covers IM messages/reactions/chat changes, Task updates, VC meeting started/joined/ended, Minutes generated, Whiteboard updated, etc.). Use for Lark bots, real-time message processing, long-running subscribers, streaming webhook/push handlers. Supports `--max-events` / `--timeout` bounded runs and a stderr ready-marker contract — designed for AI agents running as subprocesses.","source":"中心技能","note":""},{"name":"lark-im","category":"连接、协作与发布","description":"飞书即时通讯：收发消息和管理群聊。发送和回复消息、搜索聊天记录、管理群聊成员、上传下载图片和文件（支持大文件分片下载）、管理表情回复、发送应用内/短信/电话加急、发送和处理交互卡片（Interactive Card）、监听卡片按钮回调（card.action.trigger）。当用户需要发消息、查看或搜索聊天记录、下载聊天中的文件、查看群成员、搜索群、创建群聊或话题群、管理标记数据、管理 Feed 置顶（添加/移除/查询置顶会话）、管理标签数据、处理卡片回调时使用。","source":"中心技能","note":""},{"name":"lark-mail","category":"连接、协作与发布","description":"飞书邮箱：Use when user mentions 起草邮件、写邮件、草稿、发送/回复/转发邮件、查阅邮件、看邮件、搜索邮件、邮件文件夹、邮件标签、邮件联系人、监听新邮件、邮件收信规则等；use for mail/email intent only. Do not use for docs/sheets/calendar/auth setup/pure contact lookup/IM chat tasks.","source":"中心技能","note":""},{"name":"lark-markdown","category":"连接、协作与发布","description":"飞书 Markdown：查看、创建、上传、编辑和比较 Markdown 文件。当用户需要创建或编辑 Markdown 文件、读取、修改、局部 patch 或比较差异时使用。不负责将 Markdown 导入为飞书在线文档，也不负责文件搜索、权限、评论、移动、删除等云空间管理操作。","source":"中心技能","note":""},{"name":"lark-minutes","category":"连接、协作与发布","description":"飞书妙记：搜索妙记、查看妙记基础信息、下载/上传音视频、读取或编辑妙记的产物内容、改标题、替换说话人/关键词、申请妙记查看/编辑权限。当给出minute_token、本地音视频文件，要查/改/转妙记产物，或用户明确要主动申请妙记权限时使用；本地音视频转纪要/逐字稿优先走本 skill，不要用 ffmpeg/whisper 本地转写。不负责：获取会议关联妙记，或仅按自然语言标题定位纪要","source":"中心技能","note":""},{"name":"lark-note","category":"连接、协作与发布","description":"飞书会议纪要（Note）直查：已知 note_id 时查询纪要详情、展示类型、关联文档 token，并读取 unified 原始逐字记录。当用户已持有 note_id，或从文档显式 vc-node-id 获得 note_id 时使用。不负责会议/日程/妙记定位、文档标题搜索或 Docx 正文读取。","source":"中心技能","note":""},{"name":"lark-okr","category":"连接、协作与发布","description":"飞书 OKR：管理目标与关键结果。查看和编辑 OKR 周期、目标、关键结果、对齐关系、量化指标和进展记录。当用户需要查看或创建 OKR、管理目标和关键结果、查看对齐关系时使用。不负责：待办任务管理（lark-task）、日程/会议安排（lark-calendar）、绩效评估","source":"中心技能","note":""},{"name":"lark-openapi-explorer","category":"连接、协作与发布","description":"飞书/Lark 原生 OpenAPI 探索：从官方文档库中挖掘未经 CLI 封装的原生 OpenAPI 接口。当用户的需求无法被现有 lark-* skill 或 lark-cli 已注册命令满足，需要查找并调用原生飞书 OpenAPI 时使用。","source":"中心技能","note":""},{"name":"lark-shared","category":"连接、协作与发布","description":"Use for lark-cli setup/auth tasks: auth login/status/logout, user vs bot identity, business-domain permissions (--domain, including all/docs/drive), missing scopes, revoking authorization, or handling _notice JSON.","source":"中心技能","note":""},{"name":"lark-sheets","category":"连接、协作与发布","description":"飞书电子表格：创建和操作电子表格。支持创建表格、管理工作表与行列结构（增删/合并/调整尺寸/隐藏/冻结）、读写单元格（值/公式/样式/批注/单元格图片）、查找替换、多操作原子批量更新，以及图表、透视表、条件格式、筛选器、迷你图、浮动图片等对象的创建与维护。当用户需要创建电子表格、管理工作表、批量读写或编辑数据、统计汇总与可视化、表格美化、公式计算（含 Excel 公式迁移）、金融/财务建模（DCF、三张表、预算、Sensitivity 等）等任务时使用。若用户是想按名称或关键词搜索云空间（云盘/云存储）里的表格文件，请改用 lark-drive 的 drive +search 先定位资源。当用户给出 doubao.com 的 /sheets/ URL/token 时，也应直接使用本 skill，不要因为域名不是飞书而回退到 WebFetch；路由依据是 URL 路径模式和 token，而不是域名。","source":"中心技能","note":""},{"name":"lark-skill-maker","category":"连接、协作与发布","description":"创建 lark-cli 的自定义 Skill。当用户需要把飞书 API 操作封装成可复用的 Skill（包装原子 API 或编排多步流程）时使用。","source":"中心技能","note":""},{"name":"lark-task","category":"连接、协作与发布","description":"飞书任务：管理任务、清单和任务智能体。创建待办任务、查看和更新任务状态、拆分子任务、组织任务清单、分配协作成员、上传任务附件、注册或注销任务智能体、更新任务智能体的主页数据、写入智能体任务记录。当用户需要创建待办事项、查看任务列表、跟踪任务进度、管理项目清单或给他人分配任务、为任务上传附件文件、注册注销任务智能体、更新智能体主页数据、写入任务记录时使用。","source":"中心技能","note":""},{"name":"lark-vc","category":"连接、协作与发布","description":"飞书视频会议：搜索历史会议记录、查询会议纪要（总结/待办/章节/逐字稿）、查询参会人快照。当用户查询已结束的会议、获取会议产物（纪要/妙记）、查看参会人时使用；查询未来日程走 lark-calendar。不负责：Agent 真实入会/离会、会中实时事件（走 lark-vc-agent）。","source":"中心技能","note":""},{"name":"lark-vc-agent","category":"连接、协作与发布","description":"飞书视频会议会中能力：用于让应用机器人真实加入或离开正在进行的会议，并读取当前身份可见的会中事件、发送会中文本消息或会中表情。适用于用户询问正在开的会议发生了什么、谁在发言、是否共享内容，或需要发现当前可读的进行中会议 ID。不负责已结束会议搜索、参会人快照、纪要、逐字稿或录制查询，这些使用 lark-vc 技能。","source":"中心技能","note":""},{"name":"lark-whiteboard","category":"连接、协作与发布","description":"飞书画板：查询和编辑飞书云文档中的画板。支持导出画板为预览图片、导出原始节点结构、使用多种格式更新画板内容。 当用户需要查看画板内容、导出画板图片、编辑画板时使用此 skill。不负责：飞书云文档内容编辑（lark-doc）、文档内嵌电子表格/Base（lark-sheets / lark-base）。","source":"中心技能","note":""},{"name":"lark-workflow-meeting-summary","category":"连接、协作与发布","description":"会议纪要整理工作流：汇总指定时间范围内的会议纪要并生成结构化报告。当用户需要整理会议纪要、生成会议周报、回顾一段时间内的会议内容时使用。","source":"中心技能","note":""},{"name":"lark-workflow-standup-report","category":"连接、协作与发布","description":"日程待办摘要：编排 calendar +agenda 和 task +get-my-tasks，生成指定日期的日程与未完成任务摘要。适用于了解今天/明天/本周的安排。","source":"中心技能","note":""},{"name":"meegle","category":"连接、协作与发布","description":"飞书项目（Meegle / Meego，原飞书项目）操作工具。支持查询和管理工作项、节点流转、视图查询、个人待办、排期统计等功能。 Use when user needs to work with Feishu/Lark Meego project management — including querying work items, creating/updating work items, completing workflow nodes, checking views, listing todos, analyzing schedules/workloads, or searching with MQL. 关键词：飞书项目、meego、meegle、工作项、需求、任务、缺陷、排期、视图、待办、节点。","source":"子技能","note":""},{"name":"moments-writer-lite","category":"连接、协作与发布","description":"朋友圈文案生成器 v2.0 —— 灵感来自近5天问答记录，自动同步飞书多维表格","source":"中心技能","note":""},{"name":"podcast-transcript-txt","category":"连接、协作与发布","description":"一键式播客处理流程：从链接到可编辑的飞书云文档。支持小宇宙、YouTube等平台，自动转写、提炼内容、生成飞书文档。集成火山引擎ASR高质量语音转文字。","source":"中心技能","note":""},{"name":"portfolio-daily-pnl","category":"连接、协作与发布","description":"每日持仓盈亏播报。从腾讯文档在线表格读取持仓数据，通过腾讯自选股 MCP","source":"中心技能","note":""},{"name":"skill-installer","category":"连接、协作与发布","description":"Install Codex skills into $CODEX_HOME/skills from a curated list or a GitHub repo path. Use when a user asks to list installable skills, install a curated skill, or install a skill from another repo (including private repos).","source":"系统内置","note":""},{"name":"tencent-docs","category":"连接、协作与发布","description":"腾讯文档（docs.qq.com）-在线云文档平台，是创建、编辑、管理文档的首选","source":"中心技能","note":""},{"name":"tencent-meeting-skill","category":"连接、协作与发布","description":"腾讯会议：会议管理与音视频协作助手。预约/创建/修改/取消会议、查询会议详情与会议号转换、查看参会成员/受邀人/等候室成员、查询用户会议列表（即将开始/进行中/已结束）、查询录制列表与下载地址、获取转写全文/段落/搜索、获取AI智能纪要（支持多语言翻译）、录制权限申请（预览+提交两步流程）、时间转换与版本检查、Agent意见箱反馈上报。当用户需要预约或管理腾讯会议、查看参会人员、查询会议录制或转写内容、获取智能纪要时使用；当用户访问录制相关内容（下载地址/转写/智能纪要）出现无权限错误时，自动发起录制权限申请流程；当Agent遇到以下任何情况时必须立即触发submit_feedback：工具缺失（功能不存在）、工具报错（返回错误码）、能力不足（参数/功能限制）、结果不符预期（数据异常）、改进建议（功能优化）；如果用户提供的是9位会议号而非meeting_id，优先使用get_meeting_by_code转换后再操作。不要在以下场景触发：日程管理（非腾讯会议日程）、即时通讯/聊天、腾讯文档操作、企业微信审批流程、电话/PSTN拨号、视频剪辑或视频编辑、其他视频会议平台（Zoom/Teams/飞书/钉钉）。","source":"中心技能","note":""},{"name":"tencent-survey","category":"连接、协作与发布","description":"腾讯问卷（wj.qq.com）-","source":"中心技能","note":""},{"name":"tencent-survey","category":"连接、协作与发布","description":"腾讯问卷（wj.qq.com）- 在线问卷调查平台。涉及「问卷」「调查」「表单」「投票」「考试」「测评」「wj.qq.com」等操作时优先使用。支持能力：(1) 获取问卷详情（标题、设置、页面、题目、选项完整结构 + 纯文本 DSL + 自定义逻辑）(2) 使用纯文本创建问卷（text 必填，支持指定场景/指定项目）(3) 更新问卷中的单个题目（DSL 格式）(4) 获取问卷回答列表（支持游标分页）(5)","source":"子技能","note":""},{"name":"website-change-monitor","category":"连接、协作与发布","description":"监控任意网站清单（无 RSS 也可），每日抓取并与历史快照 diff，输出本地 Markdown 变化报告。Use when user wants to monitor a list of websites/pages for content changes and get a daily report.","source":"中心技能","note":""},{"name":"wechat-channels-publisher","category":"连接、协作与发布","description":"微信视频号自动发布：将用户指定的视频上传、保存草稿、从草稿箱设置定时发表，维护排期与去重记录，扫码后自动续接。用于视频号助手 channels.weixin.qq.com 的批量或每日定时发布，不用于微信公众号图文、微信聊天或付费投流。","source":"中心技能","note":""},{"name":"wechat-cli","category":"连接、协作与发布","description":"Read-only access to local WeChat chats through rion-wechat-cli, plus a guided first-access workflow when the user asks to connect their own account or obtain its local database keys. Use for chat search, contact history and unsent reply drafts; acquisition requires separate confirmation.","source":"中心技能","note":""},{"name":"wechat-publisher","category":"连接、协作与发布","description":"一键发布 Markdown 到微信公众号草稿箱。基于 wenyan-cli，支持多主题、代码高亮、图片自动上传。","source":"中心技能","note":""},{"name":"bid-proposal-creator","category":"其他","description":"端到端招投标文档生成专家。内置东部GDP前10省级公共交易平台，支持智能搜索相似标书、 自动提取招标要求、一键生成高质量投标初稿（Word格式）。适用于各类政府采购、 国企央企项目、福利采购等招投标场景。 **核心能力：** 1. 内置东部GDP前10省级交易平台数据库（广东、江苏、山东、浙江、河南、四川、湖北、福建、湖南、上海） 2. 智能搜索相似标书 - 输入公司名称或招标平台，自动匹配历史标书 3. 招标要求解析 - 自动提取关键条款、资质要求、评分标准 4. 投标初稿生成 - 基于模板和相似标书，生成可直接使用的Word文档","source":"中心技能","note":""},{"name":"harden","category":"其他","description":"Improve interface resilience through better error handling, i18n support, text overflow handling, and edge case management. Makes interfaces robust and production-ready. Use when the user asks to harden, make production-ready, handle edge cases, add error states, or fix overflow and i18n issues.","source":"中心技能","note":""},{"name":"hr-ai-scenario-card","category":"其他","description":"HR AI场景机会卡撰写指南与模板。当用户需要撰写、辅导或批改「HR AI场景机会卡 / 第一次课作业 / 机会卡」时使用；可作为 hr-scenario-ipo-generator 的上游——先把模糊的HR场景写成结构化机会卡，再转写为《AI智能体场景IPO需求定义书》。本技能提供七模块模板、逐字段填写规范、常见错误清单，以及一份金斯瑞HRBP的标杆范例。","source":"中心技能","note":""},{"name":"hr-offboarding","category":"其他","description":"HR 离职处理辅助工具。当用户输入员工离职相关信息时，自动生成 Markdown 报告并输出为 PDF 文件： 离职流程事项清单、离职访谈提纲、岗位交接清单、风险提示和组织改进建议。 触发词：/离职助手、/hr-offboarding、离职处理、员工离职、离职报告","source":"中心技能","note":""},{"name":"hr-offboarding","category":"其他","description":"HR 离职处理辅助工具。当用户输入员工离职相关信息时，自动生成 Markdown 报告并输出为 PDF 文件： 离职流程事项清单、离职访谈提纲、岗位交接清单、风险提示和组织改进建议。 触发词：/离职助手、/hr-offboarding、离职处理、员工离职、离职报告","source":"子技能","note":""},{"name":"hr-scenario-ipo-generator","category":"其他","description":"把「HR AI场景机会卡 / 第一次课作业」转写为《AI智能体场景IPO需求定义书 V0.1》+《IPO缺口清单》两份 Word。触发词：机会卡转IPO、IPO需求定义书、IPO缺口清单、HR场景IPO、智能体IPO、第一次作业转IPO。交付双 Word，严格不编造业务规则，缺失项标【待补充 GAP-xx】并与缺口清单编号一一对应。","source":"中心技能","note":""},{"name":"meeting minutes","category":"其他","description":"将会议记录转化为决策资产和执行任务。","source":"中心技能","note":""},{"name":"partner management","category":"其他","description":"帮助CEO持续理解关键合作伙伴变化。","source":"中心技能","note":""},{"name":"payment-cooperation-proposal","category":"其他","description":"生成支付公司与连锁品牌/SaaS平台的三方合作方案（Word","source":"中心技能","note":""},{"name":"performance managment","category":"其他","description":"跟踪战略目标、项目进度和执行结果。","source":"中心技能","note":""},{"name":"polish","category":"其他","description":"Performs a final quality pass fixing alignment, spacing, consistency, and micro-detail issues before shipping. Use when the user mentions polish, finishing touches, pre-launch review, something looks off, or wants to go from good to great.","source":"中心技能","note":""},{"name":"talent-profile-generator","category":"其他","description":"基于岗位战略价值、职责要求、业务场景和组织文化，构建可用于招聘、培养、盘点与配置的人才画像，形成知识、技能、经验、能力、动机和行为标准。","source":"中心技能","note":""},{"name":"typeset","category":"其他","description":"Improves typography by fixing font choices, hierarchy, sizing, weight, and readability so text feels intentional. Use when the user mentions fonts, type, readability, text hierarchy, sizing looks off, or wants more polished, intentional typography.","source":"中心技能","note":""},{"name":"ubo-screening-qcc","category":"其他","description":"企查查受益所有人（UBO）识别 SKILL · 反洗钱合规场景，基于 qcc-company 单 server 生成对齐官方《受益人·身份基本信息报告》的 KYC 合规档案。触发词：/ubo-screening-qcc、受益所有人识别、UBO 识别、UBO 核验、KYC 档案、反洗钱尽调。","source":"中心技能","note":""},{"name":"workspace-personalizer","category":"其他","description":"OpenClaw workspace 开机配置向导。当用户提到自己的职业、岗位、主要输出物，或希望配置或刷新 OpenClaw 的配置文件时触发。也适用于用户说帮我配置 OpenClaw、初始化工作区、我想让 AI 更了解我的工作、刷新配置、设置 AI 搭档等场景。即使用户没有明确提到文件名，只要表达了让 AI 搭档更懂我的意图，也应触发。不适用于：用户已经在配置文件中填好了信息，只需要调用现有 skill 完成具体任务。","source":"中心技能","note":""},{"name":"yinsheng-competitor-intelligence","category":"其他","description":"检索公开信息并形成可追溯的友商卡片、对比矩阵与机会判断。","source":"中心技能","note":""},{"name":"contribute-catalog","category":"视频、音频与多媒体","description":"Author a new HyperFrames registry block (caption style, VFX block, transition, lower third) or component (text effect, overlay, snippet) and ship it as an upstream PR to the hyperframes repo. Use ONLY when the user wants to CONTRIBUTE to the public catalog — for in-project caption/transition authoring use the `hyperframes` skill, for installing existing registry items use the `hyperframes-registry` skill.","source":"中心技能","note":""},{"name":"ip-huoke-wenan","category":"视频、音频与多媒体","description":"IP获客文案生成技能。用户只需说一句话话题（如\"帮我写一条获客短视频文案\"），龙虾即可基于《IP提示词》方法论库，生成完整的获客文案。支持：热点拆解、选题策划、痛点文案、锁客文案、朋友圈、公众号等全链路内容。一次触发，完整交付。","source":"中心技能","note":""},{"name":"koubo-script-generator","category":"视频、音频与多媒体","description":"本 Skill 自动从**李家贵最近 5 天的问答记录**中提取高价值选题，生成适配 AI 战略顾问人设的完整短视频口播脚本：**留人开头（前 5 秒）→ 分点干货（主体内容）→ 结尾引流引导（促互动/关注）**。全程口语化写作，模拟真人面对镜头说话的自然节奏。","source":"中心技能","note":""},{"name":"meeting-minutes","category":"视频、音频与多媒体","description":"会议纪要智能生成技能。当用户提供音频/录音文件并要求生成会议纪要、会议记录、会议备忘录时使用。输入一段会议录音，自动完成语音转文字、AI摘要、生成正式商务风格Word文档全流程。支持","source":"中心技能","note":""},{"name":"podcast-to-audio","category":"视频、音频与多媒体","description":"从播客链接自动提取和下载音频文件。支持小宇宙、YouTube等平台，一键获取 m4a/mp3 音频文件。","source":"中心技能","note":""},{"name":"remotion-best-practices","category":"视频、音频与多媒体","description":"Best practices for Remotion - Video creation in React","source":"中心技能","note":""},{"name":"remotion-video-toolkit","category":"视频、音频与多媒体","description":"Complete toolkit for programmatic video creation with Remotion +","source":"中心技能","note":""},{"name":"简历初筛助手","category":"数据分析与业务运营","description":"根据JD和简历自动生成简历初筛报告。当用户上传岗位JD和候选人简历，或要求'初筛简历'、'简历筛选'、'帮我看看这份简历'、'JD匹配分析'时触发此skill。输出岗位匹配证据、风险点、待追问问题和人工复核建议，不直接做出录用或淘汰决定。","source":"中心技能","note":""},{"name":"数据分析大师","category":"数据分析与业务运营","description":"全球跨区域数据分析专家，精通多平台数据采集、整合与解读，擅长市场调研数据处理、跨区域舆情监控、全链路ROI分析。当用户需要数据报告、舆情监控、竞品数据调研、ROI分析、市场趋势可视化时触发。适用场景：品牌数据报告、社交媒体舆情监控、营销ROI分析、市场趋势预测、用户反馈分析。","source":"中心技能","note":""},{"name":"branch-performance-scorecard","category":"数据分析与业务运营","description":"银行总/分/支行经营评价计分分析师。当用户提供支行 KPI 样本（含「评比规则」「支行样本」的 xlsx），要求按\"片区+分组\"独立边界做组内极差归一化计分、组内排名、选定中游支行对标（同组第1名/组中位/相邻机构）、反推\"多拿1分\"所需增量，并输出多 sheet 结果 xlsx 时使用。内置\"组内极差为0→统一满分\"与\"待录入项不得编造\"两条硬规则。","source":"中心技能","note":""},{"name":"branch-weekly-report","category":"数据分析与业务运营","description":"支行周报汇总技能。将多个支行提交的周度经营报表进行文件齐套检查、字段映射、格式统一、汇总计算、异常识别、来源追溯，生成统一明细表、缺报清单、数据质量报告、异常指标清单及一页管理摘要。触发场景：用户提到生成支行周报、汇总本周经营、检查支行报表、支行周报汇总、weekly branch report、branch performance summary等，且需要处理多个支行提交的Excel/CSV/Word格式报表时使用。必需输入：支行清单、字段字典、各支行周报文件、指标口径说明、输出模板。当缺少指标口径、出现同名字段含义冲突、或发现未脱敏客户信息时，停止处理并报告。","source":"中心技能","note":""},{"name":"claude-api","category":"数据分析与业务运营","description":"Build apps with the Claude API or Anthropic SDK. TRIGGER when: code imports `anthropic`/`@anthropic-ai/sdk`/`claude_agent_sdk`, or user asks to use Claude API, Anthropic SDKs, or Agent SDK. DO NOT TRIGGER when: code imports `openai`/other AI SDK, general programming, or ML/data-science tasks.","source":"中心技能","note":""},{"name":"data-analysis-skill","category":"数据分析与业务运营","description":"数据分析技能包 - 自动抓取、清洗、可视化、生成报告。适合数据分析师、运营人员，告别 Excel 手工操作。","source":"中心技能","note":""},{"name":"data-analyst-pro","category":"数据分析与业务运营","description":"表格数据不会挖？10 大场景一键分析，自动清洗+出图+给结论，揪出异常和趋势——不用你写公式。","source":"中心技能","note":""},{"name":"elon-musk-perspective","category":"数据分析与业务运营","description":"马斯克的思维操作系统。基于传记、播客、推文、法庭证词、决策记录和外部批评的深度调研， 提炼5个核心心智模型、8条决策启发式和完整的表达DNA。 用途：作为思维顾问，用马斯克的视角分析问题、审视决策、拆解成本结构、挑战行业假设。 当用户提到「用马斯克的视角」「马斯克会怎么看」「Musk模式」「马斯克perspective」「elon perspective」时使用。 即使用户只是说「这个成本合理吗」「从第一性原理想想」「白痴指数是多少」「五步算法」「能不能垂直整合」也可触发。 不要在用户只是问「能不能更快」「流程有必要吗」等一般性问题时触发——只在涉及成本拆解、第一性原理、激进迭代等马斯克核心方法论时激活。","source":"示例子技能","note":""},{"name":"generate-performance-ipo-standards","category":"数据分析与业务运营","description":"将组织目标、岗位职责、绩效制度、历史案例和本期结果数据转化为岗位绩效指标、权重、计算口径、五级评价标准及风险清单。用于用户提出绩效 IPO、岗位 KPI/OKR、绩效评价标尺、指标权重、分级标准、绩效校准、薪酬岗位绩效标准或需要生成 Word 报告与 Excel 指标明细时；适用于执行岗、管理岗和业务协同岗的差异化标准设计。","source":"中心技能","note":""},{"name":"generic-mall-bill-template-refresh","category":"数据分析与业务运营","description":"通用商城账单模板刷新技能。只要用户提供我们的原始商城账单 Excel 和客户要求的 Excel 模板，就用此技能按客户模板生成新版客户账单、验收单、结算单、明细表或报表。适用于不同客户格式不一致的商城运营账单交付场景；不要覆盖已有客户专用技能，客户专用技能可作为特例保留。","source":"中心技能","note":""},{"name":"gf-stock-f10","category":"数据分析与业务运营","description":"本Skill基于广发证券权威数据接口构建，查询股票基础信息，包含公司全称、板块、上市日期、主营业务、所属行业。","source":"中心技能","note":""},{"name":"gov-funding-application","category":"数据分析与业务运营","description":"政府资金/补贴类项目申报书自动生成与申报材料整理。当用户提到项目申报、申报书、资金申请报告、补贴申报、专项资金申报、按申报要求整理材料，或提供申报通知/申报模板和素材文件夹（技术方案、财务资料、人事资料、公司资质）时使用。功能覆盖：解析申报要求、盘点素材库、缺件分析、撰写申报书正文、生成Word初稿、按官方模板填充。即使用户只说\"帮我整理申报材料\"\"把申报书写出来\"\"看看材料还缺什么\"也必须使用本技能。","source":"中心技能","note":""},{"name":"hotel-ops-cockpit","category":"数据分析与业务运营","description":"酒店经营诊断驾驶舱生成器。当用户上传或提供本地 Excel/CSV 酒店经营数据（P&L、客房、餐饮、渠道、出租率等），并希望以收益管理专家视角做深度诊断、对标行业模型、输出 HTML 驾驶舱报告（含健康度打分、关键看板、异常预警、五维度分析、分层 Action Plan）时使用。触发词示例：分析这份酒店经营表、做个酒店经营诊断驾驶舱、酒店收益管理分析、帮我看下这家酒店的经营短板。仅在本地离线处理数据，不联网、不上传。","source":"中心技能","note":""},{"name":"invoice-collector","category":"数据分析与业务运营","description":"用于报销场景下的发票收集。只要用户提到从邮箱、邮件附件、12306、飞猪、发票下载链接、报销邮件、电子发票等来源批量收集发票文件，就应使用这个 skill。它负责搜索邮件、下载 PDF/OFD 等附件、识别邮件中的发票链接并尝试自动下载；如果链接无法自动处理，必须单独输出待人工确认列表，而不是中断整个流程。这个 skill 只负责采集，不负责最终去重汇总或 Excel 出表。","source":"中心技能","note":""},{"name":"invoice-organizer","category":"数据分析与业务运营","description":"用于报销场景下的发票整理。只要用户提到整理电子发票、读取 PDF 或 OFD、提取发票号金额日期抬头、识别个人抬头、报销去重、汇总成 Excel、生成可提交报销表等任务，就应使用这个 skill。它负责读取采集好的发票文件，抽取关键信息，识别异常，并输出最终汇总表。尤其在同一张发票同时存在 PDF 和 OFD 版本时，不要只按发票号去重，必须考虑文件类型，避免误删。","source":"中心技能","note":""},{"name":"jinan-metro-bill-refresh","category":"数据分析与业务运营","description":"济南地铁餐费商城账单刷新技能。凡是用户提供有分/商城运营的原始主账单、餐补汇总表、客户要求的 Excel 格式模板，并要求生成客户版账单、验收单、结算清单、按客户格式刷新报表时，都应使用本技能。尤其适用于“济南地铁”“餐费商城”“劳服/铭源/培森/舜安/舜洁”客户账单拆分与刷新场景。","source":"中心技能","note":""},{"name":"marketing-huoke-allinone","category":"数据分析与业务运营","description":"全链路营销获客文案生成技能。用户输入任意话题，Skill自动分析并推荐最适合的内容平台（短视频/公众号/小红书/朋友圈等），再生成完整获客文案。一个话题输入，全链路内容输出。","source":"中心技能","note":""},{"name":"nuwa-skill","category":"数据分析与业务运营","description":"Nuwa (女娲): Input any name, auto-research → extract thinking frameworks → generate a runnable perspective skill. Uses multi-agent parallel research, mental model extraction, and expression DNA analysis to create skills that \"think like that person.\" Trigger: \"create a perspective skill for X\", \"distill X\", \"nuwa\", \"make a skill for X\", \"X's thinking framework","source":"中心技能","note":""},{"name":"operational data anlysis","category":"数据分析与业务运营","description":"将企业经营数据转化为CEO可理解的经营洞察。","source":"中心技能","note":""},{"name":"plugin-creator","category":"数据分析与业务运营","description":"Create and scaffold plugin directories for Codex with a required `.codex-plugin/plugin.json`, optional plugin folders/files, valid manifest defaults, and personal-marketplace entries by default. Use when Codex needs to create a new personal plugin, add optional plugin structure, generate or update marketplace entries for plugin ordering and availability metadata, or update an existing local plugin during development with the CLI-driven cachebuster and reinstall flow.","source":"系统内置","note":""},{"name":"remotion-to-hyperframes","category":"数据分析与业务运营","description":"Translate an existing Remotion (React-based) video composition into a HyperFrames HTML composition. Use ONLY when the user explicitly asks to port, convert, migrate, translate, or rewrite a Remotion composition as HyperFrames (e.g. \"port my Remotion project to HyperFrames\"). Do NOT use when (a) authoring a NEW HyperFrames composition (even if A/B-testing a Remotion video); (b) Remotion is mentioned in passing; (c) Remotion code is shared as reference, not for translation; (d) the user wants \"the same video as my Remotion one\" without explicitly asking to migrate the source — treat as a fresh HyperFrames build. When in doubt, default to the `hyperframes` skill. Detects unsupported patterns (useState, useEffect side effects, async calculateMetadata, third-party React component libraries, `@remotion/lambda`) and recommends the runtime interop escape hatch instead of a lossy translation.","source":"中心技能","note":""},{"name":"strategy management","category":"数据分析与业务运营","description":"帮助CEO分析行业变化、竞争环境和战略机会。","source":"中心技能","note":""},{"name":"yinsheng-reconciliation-root-cause","category":"数据分析与业务运营","description":"结合规则和历史案例，对差异进行分类、证据归集和责任分流。","source":"中心技能","note":""},{"name":"adapt","category":"网页、设计与可视化","description":"Adapt designs to work across different screen sizes, devices, contexts, or platforms. Implements breakpoints, fluid layouts, and touch targets. Use when the user mentions responsive design, mobile layouts, breakpoints plate.html ## Pipeline Sub-Agents (called automatically) - **knowledge-interviewer** (Opus): 非结构化文本 → 结构化 JSON - **zhongwen-content** (Sonnet): JSON → HTML 报告","source":"中心技能","note":""},{"name":"mcp-builder","category":"网页、设计与可视化","description":"Guide for creating high-quality MCP (Model Context Protocol) servers that enable LLMs to interact with external services through well-designed tools. Use when building MCP servers to integrate external APIs or services, whether in Python (FastMCP) or Node/TypeScript (MCP SDK).","source":"中心技能","note":""},{"name":"normalize","category":"网页、设计与可视化","description":"Audits and realigns UI to match design system standards, spacing, tokens, and patterns. Use when the user mentions consistency, design drift, mismatched styles, tokens, or wants to bring a feature back in line with the system.","source":"中心技能","note":""},{"name":"onboard","category":"网页、设计与可视化","description":"Designs and improves onboarding flows, empty states, and first-run experiences to help users reach value quickly. Use when the user mentions onboarding, first-time users, empty states, activation, getting started, or new user flows.","source":"中心技能","note":""},{"name":"quieter","category":"网页、设计与可视化","description":"Tones down visually aggressive or overstimulating designs, reducing intensity while preserving quality. Use when the user mentions too bold, too loud, overwhelming, aggressive, garish, or wants a calmer, more refined aesthetic.","source":"中心技能","note":""},{"name":"recruiting-resume-workflow","category":"网页、设计与可视化","description":"Execute a human-in-the-loop recruiting workflow across BOSS直聘、猎聘 and similar hiring platforms: build a job requirement card, search a bounded number of public candidate profiles, anonymize and score them, draft personalized outreach, and prepare an HR recommendation report. Use when an authorized recruiter asks for 简历搜索、候选人筛选、人才评分、意向沟通话术、HR推荐清单、招聘走测 or IPO/SOP validation in Codex, ChatGPT Work, WorkBuddy, browser-use, or anoth ys \"capture this site\", \"turn this into a video\", \"make a promo from my site\", (3) the user wants a social ad, product tour, or any video based on an existing website, (4) the user shares a link and asks for any kind of video content. Even if the user just pastes a URL — this is the skill to use.","source":"中心技能","note":""},{"name":"bill-inmon-perspective","category":"写作、内容与思考模型","description":"Bill Inmon（数据仓库之父）的思维框架与表达方式。基于 6 个维度、30+ 一手来源的深度调研， 提炼 6 个核心心智模型、7 条决策启发式和完整表达DNA。 用途：作为思维顾问，用 Inmon 的视角审视数据架构、数据治理、建模选型、数据战略与\"AI+数据\"决策。 当用户提到「用 Inmon 的视角」「Inmon 会怎么看」「Inmon 模式」「切换到 Inmon」「bill inmon perspective」时使用。 即使用户只是说「帮我用数仓之父的角度想想」「如果 Inmon 会怎么做」也应触发。 不在与数据/架构/治理/建模/AI数据底座无关的一般性问题上自动触发。","source":"中心技能","note":""},{"name":"elon-musk-perspective","category":"写作、内容与思考模型","description":"埃隆·马斯克（Elon Musk）思维框架Skill。当用户需要以马斯克的第一性原理、极限效率、五步工作法等思维框架来审核方案、","source":"中心技能","note":""},{"name":"md-to-word","category":"写作、内容与思考模型","description":"Convert markdown files to professionally formatted Word documents with book-style formatting.","source":"中心技能","note":""},{"name":"naval-perspective","category":"写作、内容与思考模型","description":"Naval Ravikant的思维操作系统。基于著作、播客、推文、决策记录和外部批评的深度调研， 提炼5个核心心智模型、8条决策启发式和完整的表达DNA。 激活后沉浸式扮演Naval，直接以「我」的视角回应问题。 当用户提到「用Naval的视角」「Naval会怎么看」「纳瓦尔模式」「Naval perspective」「切换到Naval」时使用。 即使用户只是说「这份工作有杠杆吗」「什么是specific knowledge」「什么是真正的财富」「欲望太多怎么办」「无需许可的路径」也可触发。 不要在用户只是问「我该怎么选择」「帮我想清楚」等一般性决策问题时触发——只在涉及杠杆/特定知识/欲望管理/财富定义等Naval核心概念时激活。","source":"示例子技能","note":""},{"name":"nuwa-skill","category":"写作、内容与思考模型","description":"女娲造人：输入人名/主题/甚至只是模糊需求，自动深度调研→思维框架提炼→生成可运行的人物Skill。 两种入口：(1)明确人名→直接蒸馏 (2)模糊需求→诊断推荐→再蒸馏。 触发词：「造skill」「蒸馏XX」「女娲」「造人」「XX的思维方式」「做个XX视角」「更新XX的skill」。 模糊需求也触发：「我想提升决策质量」「有没有一种思维方式能帮我...」「我需要一个思维顾问」。 English triggers: \"distill [person]\", \"nuwa\", \"create a [person] perspective skill\", \"how does [person] think\", \"I need a thinking advisor\".","source":"中心技能","note":""},{"name":"self coach","category":"写作、内容与思考模型","description":"通过历史行为和决策帮助CEO进行认知复盘。","source":"中心技能","note":""},{"name":"algorithmic-art","category":"Agent、开发与自动化","description":"Creating algorithmic art using p5.js with seeded randomness and interactive parameter exploration. Use this when users request creating art using code, generative art, algorithmic art, flow fields, or particle systems. Create original algorithmic art rather than copying existing artists' work to avoid copyright violations.","source":"中心技能","note":""},{"name":"internal-comms","category":"Agent、开发与自动化","description":"A set of resources to help me write all kinds of internal communications, using the formats that my company likes to use. Claude should use this skill whenever asked to write some sort of internal communications (status reports, leadership updates, 3P updates, company newsletters, FAQs, incident reports, project updates, etc.).","source":"中心技能","note":""},{"name":"openai-docs","category":"Agent、开发与自动化","description":"Use for Codex models/pricing, scheduled tasks, skills, settings, setup, troubleshooting, customization, automations, and self-knowledge—including 'you,' 'your,' 'this app,' or 'this coding agent' when they refer to Codex—and for OpenAI APIs/products and ChatGPT Work. Also use for model choice/migration, prompting, SDKs, Responses, Realtime, agents, evals, and Chat/Work/Codex comparisons. Do not use for generic app/software tasks that merely mention Codex.","source":"系统内置","note":""},{"name":"review-agent","category":"Agent、开发与自动化","description":"Perform a read-only, defect-first review of a specified code change and return every actionable finding. Use when another agent delegates review of uncommitted changes, a base-branch diff, a commit, or custom review instructions.","source":"系统内置","note":""},{"name":"skill-creator","category":"Agent、开发与自动化","description":"Create or update a Codex skill with appropriately scoped instructions and any needed supporting resources.","source":"中心技能","note":"保留 2026-09-05 较新版；这里是同一份新版的入口。"}]};
    let currentCategory = "全部";
    const list = document.getElementById("list");
    const chips = document.getElementById("chips");
    const search = document.getElementById("search");
    const empty = document.getElementById("empty");
    document.getElementById("totalCount").textContent = data.total;
    document.getElementById("categoryCount").textContent = data.categories.length;
    function esc(value) { return String(value || "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }
    function protectCjk(value) {
      let text = esc(value);
      const terms = ["可编辑", "上传", "公式", "标准", "场景", "触发", "发布", "分类", "搜索", "说明", "目录", "技能", "知识库", "数据源", "工作流"];
      for (const term of terms) text = text.replaceAll(term, '<span class="nowrap">' + term + '</span>');
      return text.replace(/([一-鿿]{2})([。；，、：])/g, '<span class="nowrap">$1</span>$2');
    }
    function matches(skill, query) {
      if (!query) return true;
      return [skill.name, skill.description, skill.source, skill.category, skill.note].join(" ").toLowerCase().includes(query.toLowerCase());
    }
    function renderChips() {
      const cats = [{ name:"全部", count:data.total }, ...data.categories];
      chips.innerHTML = cats.map(c => '<button type="button" class="' + (c.name === currentCategory ? 'active' : '') + '" data-cat="' + esc(c.name) + '">' + esc(c.name) + ' · ' + c.count + '</button>').join("");
      chips.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => { currentCategory = btn.dataset.cat; render(); }));
    }
    function render() {
      renderChips();
      const query = search.value.trim();
      const rows = data.skills.filter(s => (currentCategory === "全部" || s.category === currentCategory) && matches(s, query));
      document.getElementById("visibleCount").textContent = rows.length;
      empty.style.display = rows.length ? "none" : "block";
      const grouped = new Map();
      for (const skill of rows) {
        if (!grouped.has(skill.category)) grouped.set(skill.category, []);
        grouped.get(skill.category).push(skill);
      }
      list.innerHTML = Array.from(grouped.entries()).map(([category, skills]) => {
        const items = skills.map(skill =>
          '<div class="skill">' +
            '<div>' +
              '<div class="name">' + esc(skill.name) + '</div>' +
              '<div class="meta">' + esc(skill.source) + '</div>' +
              (skill.note ? '<div class="note">' + esc(skill.note) + '</div>' : '') +
            '</div>' +
            '<div class="desc">' + protectCjk(skill.description || (skill.name + "：该 Skill 暂未写用途说明，后续可补齐 description。")) + '</div>' +
          '</div>'
        ).join("");
        return '<section class="group"><h2>' + esc(category) + ' · ' + skills.length + '</h2>' + items + '</section>';
      }).join("");
    }
    search.addEventListener("input", render);
    render();
  </script>
